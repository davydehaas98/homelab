name: Terraform Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yaml"
  workflow_dispatch:

env:
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_ipv4_address: ${{ secrets.SERVER_IPV4_ADDRESS }}

jobs:
  # One state per zone, each with its own role on the state bucket
  terraform:
    name: ${{ matrix.zone }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - zone: davydehaas.dev
            role: github-state-cloudflare-dev
          - zone: davydehaas.nl
            role: github-state-cloudflare-nl
    # A newer run waits for the apply of an older one
    concurrency:
      group: terraform-cloudflare-${{ matrix.zone }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/cloudflare/${{ matrix.zone }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ matrix.role }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "v1.17.2"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Format
        run: terraform fmt -check -diff

      - name: Validate
        run: terraform validate

      # Exit code 2 means changes. The plan file holds the secrets, so it stays on the runner.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" -ne 1 ] || exit 1
          if [ "$code" -eq 2 ]; then echo "changes=true"; else echo "changes=false"; fi >> "$GITHUB_OUTPUT"

      - name: Apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -input=false tfplan
