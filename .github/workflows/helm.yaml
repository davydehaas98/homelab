name: Helm lint
on:
  pull_request:
jobs:
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Render Argo CD Applications
        run: helm template chart > /dev/null
      - name: Lint and render changed applications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dirs=$(git diff --name-only "$BASE_SHA" HEAD -- kubernetes \
            | cut -d/ -f1-3 | sort -u)
          # A changed library chart also checks every app that depends on it (file://../../_library/<name>)
          for dir in $dirs; do
            case "$dir" in
              kubernetes/_library/*)
                dirs="$dirs $(grep -l "file://\.\./\.\./_library/${dir##*/}\$" kubernetes/*/*/Chart.yaml | xargs -r -n1 dirname)"
                ;;
            esac
          done
          for dir in $(echo $dirs | tr ' ' '\n' | sort -u); do
            [ -f "$dir/Chart.yaml" ] || continue
            echo "::group::$dir"
            helm dependency update "$dir"
            helm lint "$dir"
            # Library charts only provide templates and cannot be rendered on their own
            if ! grep -q '^type: library' "$dir/Chart.yaml"; then
              helm template "$dir" --api-versions monitoring.coreos.com/v1 > /dev/null
            fi
            echo "::endgroup::"
          done
