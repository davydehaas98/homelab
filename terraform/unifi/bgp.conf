router bgp 64513
 bgp router-id 192.168.1.1
 maximum-paths 8
 neighbor CILIUM peer-group
 neighbor CILIUM remote-as 64514
 bgp listen range 192.168.10.0/24 peer-group CILIUM
 address-family ipv4 unicast
  neighbor CILIUM activate
  neighbor CILIUM route-map CILIUM-IN in
  neighbor CILIUM route-map NONE out
 exit-address-family
exit
!
ip prefix-list LB seq 5 permit 192.168.200.0/24 le 32
route-map CILIUM-IN permit 10
 match ip address prefix-list LB
exit
route-map NONE deny 10
exit
