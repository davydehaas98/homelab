loki:
  loki:
    revisionHistoryLimit: 2
    # The pod security contexts of the chart have no seccomp profile, which the restricted standard requires
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    auth_enabled: false
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    commonConfig:
      replication_factor: 1
    limits_config:
      per_stream_rate_limit: 512M
      per_stream_rate_limit_burst: 1024M
      cardinality_limit: 200000
      ingestion_burst_size_mb: 1000
      ingestion_rate_mb: 10000
      # Deleted by the compactor below, otherwise the logs fill the SeaweedFS volume
      retention_period: 30d
    compactor:
      retention_enabled: true
      delete_request_store: s3
    storage:
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        s3: s3://seaweedfs-all-in-one.seaweedfs:8333
        endpoint: http://seaweedfs-all-in-one.seaweedfs:8333
        region: eu
        secretAccessKey: ${S3_SECRET_KEY}
        accessKeyId: ${S3_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true

  test:
    enabled: false

  lokiCanary:
    enabled: false

  sidecar:
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 90Mi

  memcachedExporter:
    resources:
      limits:
        memory: 40Mi
      requests:
        cpu: 30m
        memory: 30Mi

  memcached:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

  # Memcached grows to allocatedMemory (MB) and some overhead, so each limit stays above allocatedMemory * 1.2
  chunksCache:
    allocatedMemory: 512
    resources:
      limits:
        memory: 1.5Gi
      requests:
        cpu: 10m
        memory: 600Mi

  resultsCache:
    allocatedMemory: 128
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi

  monitoring:
    namespace: grafana
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Loki
    serviceMonitor:
      enabled: true

  singleBinary:
    # Wide queries over days need far more than its idle use
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 750Mi
    # zfs-fast only exists on midgard-0 (kubernetes/storage/zfs-localpv)
    persistence:
      size: 5Gi
      storageClass: zfs-fast
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  gateway:
    enabled: false
