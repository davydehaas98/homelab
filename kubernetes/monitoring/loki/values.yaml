loki:
  loki:
    revisionHistoryLimit: 2
    # The pod security contexts of the chart have no seccomp profile, which the restricted standard requires
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    auth_enabled: false
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    commonConfig:
      replication_factor: 1
    limits_config:
      per_stream_rate_limit: 512M
      per_stream_rate_limit_burst: 1024M
      cardinality_limit: 200000
      ingestion_burst_size_mb: 1000
      ingestion_rate_mb: 10000
      # Deleted by the compactor below, otherwise the logs fill the SeaweedFS volume
      retention_period: 30d
    compactor:
      retention_enabled: true
      delete_request_store: s3
    storage:
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      type: s3
      s3:
        s3: s3://seaweedfs-all-in-one.seaweedfs:8333
        endpoint: http://seaweedfs-all-in-one.seaweedfs:8333
        region: eu
        secretAccessKey: ${S3_SECRET_KEY}
        accessKeyId: ${S3_ACCESS_KEY}
        s3ForcePathStyle: true
        insecure: true
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

  test:
    enabled: false

  lokiCanary:
    enabled: false

  sidecar:
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 90Mi

  memcachedExporter:
    resources:
      limits:
        memory: 40Mi
      requests:
        cpu: 30m
        memory: 30Mi

  memcached:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

  # Memcached grows to allocatedMemory (MB) and some overhead, so each limit stays above allocatedMemory * 1.2
  chunksCache:
    allocatedMemory: 512
    resources:
      limits:
        memory: 1.5Gi
      requests:
        cpu: 10m
        memory: 600Mi

  resultsCache:
    allocatedMemory: 128
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 20Mi

  monitoring:
    dashboards:
      enabled: true
      namespace: grafana
      annotations:
        grafana_folder: Loki
      labels:
        grafana_dashboard: "1"
    serviceMonitor:
      enabled: true
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

  write:
    replicas: 1
    resources:
      limits:
        memory: 8Gi
      requests:
        cpu: 250m
        memory: 2.5Gi
    # A ZFS volume on midgard-0 (kubernetes/storage/zfs-localpv), bound to the claim of the StatefulSet
    persistence:
      size: 5Gi
      storageClass: zfs-fast
    tolerations: &storage-tolerations
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    affinity: null
    extraArgs:
      - "-config.expand-env=true"
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  read:
    replicas: 1
    legacyReadTarget: false
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 30m
        memory: 150Mi
    persistence:
      size: 5Gi
    affinity: null
    extraArgs:
      - "-config.expand-env=true"
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  backend:
    replicas: 1
    resources:
      limits:
        memory: 250Mi
      requests:
        cpu: 30m
        memory: 150Mi
    # A ZFS volume on midgard-0 (kubernetes/storage/zfs-localpv), bound to the claim of the StatefulSet
    persistence:
      size: 5Gi
      storageClass: zfs-fast
      enableStatefulSetAutoDeletePVC: false
    tolerations: *storage-tolerations
    affinity: null
    extraArgs:
      - "-config.expand-env=true"
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  gateway:
    enabled: true
    image:
      registry: docker.io
      repository: nginxinc/nginx-unprivileged
      tag: 1.31.7-alpine
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    verboseLogging: false
    replicas: 1
    resources:
      limits:
        memory: 40Mi
      requests:
        cpu: 20m
        memory: 30Mi
    affinity: null
