kube-prometheus-stack:
  # The CRDs come from the prometheus-crd app, its version has to match the operator of this chart
  crds:
    enabled: false

  # Grafana runs as its own app
  grafana:
    enabled: false

  # Talos does not expose these components, the monitors and rules would only produce alerts. etcd is scraped from
  # the nodes below instead (and its alerts are in templates/etcd-alerts.yaml): the chart's monitor and rules need an
  # Endpoints object, which Argo CD does not sync.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  prometheusOperator:
    resources:
      limits:
        memory: 90Mi
      requests:
        cpu: 10m
        memory: 50Mi
    prometheusConfigReloader:
      resources:
        limits:
          memory: 150Mi
        requests:
          memory: 40Mi

  prometheus:
    prometheusSpec:
      externalUrl: https://prometheus.davydehaas.dev
      retention: 15d
      # Deletes the oldest blocks before the disk of templates/prometheus-volume.yaml (10Gi) is full
      retentionSize: 8GB
      # Pick up every ServiceMonitor, PodMonitor, rule and probe in the cluster, not only the ones
      # labeled with this release
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # etcd of the control plane nodes, the metrics port is opened in talos/patches/controlplane.yaml. The job name
      # is the one the etcd rules of the chart look for. The etcd data is on the eMMC of the nodes, so the fsync and
      # commit latencies show when it gets slow.
      additionalScrapeConfigs:
        - job_name: kube-etcd
          static_configs:
            - targets:
                - 192.168.1.50:2381
                - 192.168.1.51:2381
                - 192.168.1.52:2381
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 200m
          memory: 4Gi
      # The iSCSI disk of templates/prometheus-volume.yaml
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ""
            volumeName: prometheus-db
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    # Everything goes to Discord, except the alerts below. The webhook is in templates/alertmanager-discord.yaml.
    config:
      route:
        receiver: discord
        group_by:
          - namespace
          - alertname
        routes:
          # Always fires to prove the pipeline works, never worth a notification
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          # Only says that another alert is suppressed
          - receiver: "null"
            matchers:
              - alertname = "InfoInhibitor"
      receivers:
        - name: "null"
        - name: discord
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
              send_resolved: true
    alertmanagerSpec:
      secrets:
        - alertmanager-discord
      resources:
        limits:
          memory: 150Mi
        requests:
          cpu: 10m
          memory: 70Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: nfs
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi

  kube-state-metrics:
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 30m
        memory: 300Mi
    # Exports the recommendations of the VerticalPodAutoscalers (kubernetes/core/vpa) as
    # kube_customresource_vpa_containerrecommendations_*, for the VPA dashboard in grafana-dashboards
    rbac:
      extraRules:
        - apiGroups:
            - autoscaling.k8s.io
          resources:
            - verticalpodautoscalers
          verbs:
            - list
            - watch
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: autoscaling.k8s.io
                kind: VerticalPodAutoscaler
                version: v1
              labelsFromPath:
                verticalpodautoscaler: [metadata, name]
                namespace: [metadata, namespace]
                target_kind: [spec, targetRef, kind]
                target_name: [spec, targetRef, name]
              metrics:
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu

  # node-exporter needs host access, it runs in its own privileged namespace (templates/namespace-node-exporter.yaml)
  prometheus-node-exporter:
    namespaceOverride: prometheus-node-exporter
    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 10m
        memory: 40Mi
