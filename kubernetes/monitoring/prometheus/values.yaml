kube-prometheus-stack:
  # From prometheus-crd, whose version must match this operator
  crds:
    enabled: false

  grafana:
    enabled: false

  # Talos does not expose these. etcd is scraped below, as the chart's monitor needs Endpoints Argo CD does not sync.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  prometheusOperator:
    resources:
      limits:
        memory: 90Mi
      requests:
        cpu: 10m
        memory: 50Mi
    prometheusConfigReloader:
      resources:
        limits:
          memory: 150Mi
        requests:
          memory: 30Mi

  prometheus:
    prometheusSpec:
      externalUrl: https://prometheus.davydehaas.dev
      retention: 15d
      # Below the 10Gi of templates/prometheus-volume.yaml
      retentionSize: 8GB
      # Every monitor and rule in the cluster, not only this release's
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # The metrics port is opened in talos/patches/controlplane.yaml; the job name is what the rules expect
      additionalScrapeConfigs:
        - job_name: kube-etcd
          static_configs:
            - targets:
                - 192.168.10.50:2381
                - 192.168.10.45:2381
                - 192.168.10.44:2381
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: 200m
          memory: 3.5Gi
      tolerations: &storage-tolerations
        - key: davydehaas.dev/dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: zfs-fast
            volumeName: zfs-prometheus-db
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    # Everything to Discord and ntfy except the alerts below
    config:
      route:
        receiver: default
        group_by:
          - namespace
          - alertname
        routes:
          # Always fires, to prove the pipeline works
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          # Only says that another alert is suppressed
          - receiver: "null"
            matchers:
              - alertname = "InfoInhibitor"
      receivers:
        - name: "null"
        - name: default
          discord_configs:
            - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
              send_resolved: true
          # Topic `alerts`, formatted by ntfy's built-in Alertmanager template; the token is of the ntfy user
          # `alertmanager`, which may only publish there (kubernetes/tools/ntfy)
          webhook_configs:
            - url: http://ntfy.ntfy.svc.cluster.local:8080/alerts?template=alertmanager
              send_resolved: true
              http_config:
                authorization:
                  credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
    alertmanagerSpec:
      secrets:
        - alertmanager-discord
        - alertmanager-ntfy
      resources:
        limits:
          memory: 150Mi
        requests:
          cpu: 10m
          memory: 40Mi
      tolerations: *storage-tolerations
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: zfs-fast
            volumeName: zfs-alertmanager
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi

  kube-state-metrics:
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 30m
        memory: 300Mi
    # VPA recommendations, for the VPA dashboard
    rbac:
      extraRules:
        - apiGroups:
            - autoscaling.k8s.io
          resources:
            - verticalpodautoscalers
          verbs:
            - list
            - watch
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: autoscaling.k8s.io
                kind: VerticalPodAutoscaler
                version: v1
              labelsFromPath:
                verticalpodautoscaler: [metadata, name]
                namespace: [metadata, namespace]
                target_kind: [spec, targetRef, kind]
                target_name: [spec, targetRef, name]
              metrics:
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, memory]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: memory
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound)
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                  commonLabels:
                    resource: cpu

  prometheus-node-exporter:
    namespaceOverride: prometheus-node-exporter
    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 10m
        memory: 40Mi
