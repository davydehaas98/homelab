# Usually a volume that cannot mount; the chart's rules fire much later
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-stuck-creating
  namespace: prometheus
spec:
  groups:
    - name: pod-stuck-creating
      rules:
        - alert: PodStuckCreating
          expr: max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="ContainerCreating"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{`Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck in ContainerCreating`}}"
            description: "Check the events of the pod: a volume that does not attach or mount keeps it here."
