# Also read by Authentik, which kubernetes-replicator copies it to
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prometheus-oidc-credentials
  namespace: prometheus
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replication-allowed: "true"
        replicator.v1.mittwald.de/replication-allowed-namespaces: "authentik"
      name: prometheus-oidc-credentials
      namespace: prometheus
    type: Opaque
