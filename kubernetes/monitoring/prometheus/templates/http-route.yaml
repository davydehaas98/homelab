apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - prometheus.davydehaas.dev
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
