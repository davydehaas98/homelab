node-problem-detector:
  # Newer than the chart default, which has known vulnerabilities
  image:
    repository: registry.k8s.io/node-problem-detector/node-problem-detector
    tag: v1.37.0

  # Talos has no Docker and no journal
  settings:
    log_monitors:
      - /config/kernel-monitor.json
      - /config/readonly-monitor.json

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      defaultRules:
        create: true

  resources:
    limits:
      memory: 100Mi
    requests:
      cpu: 20m
      memory: 40Mi
