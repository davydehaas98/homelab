grafana:
  sidecar:
    dashboards:
      enabled: true
      # Sort dashboards into the folder named by their `grafana_folder` annotation
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  datasources:
    datasource.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki-gateway.loki.svc.cluster.local
          editable: false
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
          access: proxy
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 30s
        - name: Alertmanager
          type: alertmanager
          uid: alertmanager
          url: http://prometheus-kube-prometheus-alertmanager.prometheus.svc.cluster.local:9093
          access: proxy
          jsonData:
            handleGrafanaManagedAlerts: false
            implementation: prometheus

  replicas: 1

  # The dashboards come from this namespace only, so no cluster role that reads Secrets everywhere
  rbac:
    namespaced: true

  ingress:
    enabled: false

  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: grafana-oauth-credentials
      defaultMode: 0440
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true

  grafana.ini:
    auth:
      oauth_allow_insecure_email_lookup: true
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      use_pkce: true
      client_id: $__file{/etc/secrets/auth_generic_oauth/client_id}
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
      scopes: "openid email profile offline_access"
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      auth_url: "https://auth.davydehaas.dev/application/o/authorize/"
      token_url: "https://auth.davydehaas.dev/application/o/token/"
      api_url: "https://auth.davydehaas.dev/application/o/userinfo/"
      signout_redirect_url: "https://auth.davydehaas.dev/application/o/grafana/end-session/"
      # Authentik group names: members of `authentik Admins` get GrafanaAdmin, `grafana-editors` get Editor
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'GrafanaAdmin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'
      allow_assign_grafana_admin: true
      # Only sign in through Authentik
      disable_login_form: true
      disable_signout_menu: false
    paths:
      data: /var/lib/grafana
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning
    analytics:
      check_for_updates: true
    log:
      mode: console
    grafana_net:
      url: https://grafana.net
    server:
      domain: "grafana.davydehaas.dev"
      root_url: "https://grafana.davydehaas.dev"

  serviceMonitor:
    enabled: true

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

  persistence:
    type: StatefulSet
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 16Gi

  admin:
    existingSecret: grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
