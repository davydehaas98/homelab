grafana-mcp:
  revisionHistoryLimit: 0

  grafana:
    url: http://grafana.grafana.svc
    apiKeySecret:
      name: grafana-mcp-credentials
      key: grafana-token

  # Checked by mcp-grafana itself
  serverAuth:
    tokenSecret:
      name: grafana-mcp-credentials
      key: server-token

  disableWrite: true
  disabledCategories:
    - asserts
    - clickhouse
    - cloudwatch
    - elasticsearch
    - incident
    - oncall
    - pyroscope

  extraArgs:
    - -t
    - streamable-http

  # Its own port skips the host validation
  metrics:
    enabled: true
    port: 9090

  serviceMonitor:
    enabled: true

  resources:
    limits:
      memory: 300Mi
    requests:
      cpu: 20m
      memory: 150Mi

  route:
    main:
      enabled: true
      annotations:
        davydehaas.dev/auth: native
      hostnames:
        - grafana.mcp.davydehaas.dev
      parentRefs:
        - name: envoy-gateway-private
          namespace: envoy-gateway
          sectionName: web-https
