grafana-mcp:
  revisionHistoryLimit: 0

  grafana:
    url: http://grafana.grafana.svc
    apiKeySecret:
      name: grafana-mcp-credentials
      key: grafana-token

  # Checked by mcp-grafana itself
  serverAuth:
    tokenSecret:
      name: grafana-mcp-credentials
      key: server-token

  disableWrite: true
  disabledCategories:
    - asserts
    - clickhouse
    - cloudwatch
    - elasticsearch
    - incident
    - oncall
    - pyroscope

  # The kubelet probes by pod IP; the bearer token guards the endpoint
  extraArgs:
    - -t
    - streamable-http
    - --allowed-hosts=*

  # Its own port skips the host validation
  metrics:
    enabled: true
    port: 9090

  serviceMonitor:
    enabled: true

  readinessProbe:
    httpGet:
      path: /healthz
      port: mcp-http
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /healthz
      port: mcp-http
    initialDelaySeconds: 15
    periodSeconds: 20

  resources:
    limits:
      memory: 300Mi
    requests:
      cpu: 20m
      memory: 150Mi

  route:
    main:
      enabled: true
      annotations:
        davydehaas.dev/auth: native
      hostnames:
        - grafana.mcp.davydehaas.dev
      parentRefs:
        - name: envoy-gateway-private
          namespace: envoy-gateway
          sectionName: web-https
