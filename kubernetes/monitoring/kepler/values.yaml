# Kepler reads the CPU energy counters (RAPL) of the node, which Rockchip boards do not have. Check that
# the pods find a power meter before enabling this app.
kepler:
  config:
    log:
      level: info

  serviceMonitor:
    enabled: true
    interval: 30s

  daemonset:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 64Mi
