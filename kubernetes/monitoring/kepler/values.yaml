# Power use per pod, from the CPU's energy counters (RAPL). Only midgard-0 has those: the RK1 nodes have no power
# sensors at all, so it runs there only.
kepler:
  config:
    log:
      level: info

  serviceMonitor:
    enabled: true
    interval: 30s

  daemonset:
    nodeSelector:
      kubernetes.io/hostname: midgard-0
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    resources:
      limits:
        memory: 300Mi
      requests:
        cpu: 20m
        memory: 70Mi
