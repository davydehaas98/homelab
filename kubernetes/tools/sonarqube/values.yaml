sonarqube:
  replicaCount: 1

  service:
    type: ClusterIP
    ports:
      http: 80
      elastic: 9001

  ingress:
    enabled: false

  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 2Gi

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

  prometheusExporter:
    enabled: true
    config:
      rules:
        - pattern: ".*"
