# Every user acts as Headlamp's service account, limited by templates/rbac.yaml
headlamp:
  config:
    inCluster: true
    # Safe only because the route is behind the Authentik login
    unsafeUseServiceAccountToken: true
    oidc:
      secret:
        create: false

  clusterRoleBinding:
    create: false

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 10m
      memory: 70Mi

  httpRoute:
    enabled: true
    annotations:
      davydehaas.dev/auth: gateway
    hostnames:
      - headlamp.davydehaas.dev
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: web-https
