apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: headlamp
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headlamp
  oidc:
    provider:
      # Set, so a discovery fetch while Authentik restarts cannot mark the policy Invalid
      issuer: https://auth.davydehaas.dev/application/o/headlamp/
      authorizationEndpoint: https://auth.davydehaas.dev/application/o/authorize/
      tokenEndpoint: https://auth.davydehaas.dev/application/o/token/
      endSessionEndpoint: https://auth.davydehaas.dev/application/o/headlamp/end-session/
    clientIDRef:
      name: headlamp-oidc-credentials
    clientSecret:
      name: headlamp-oidc-credentials
    redirectURL: https://headlamp.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
      - offline_access
