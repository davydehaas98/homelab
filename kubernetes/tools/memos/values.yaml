# Notes app with its own login and a SQLite database on the volume
image:
  registry: ghcr.io
  repository: usememos/memos
  tag: 0.31.0

port: 5230

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

# The SQLite database is on an iSCSI disk on yggdrasil, a target of its own for this app, see kubernetes/media-server/media-server/README.md
persistence:
  size: 1Gi
  mountPath: /var/opt/memos
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:memos
    lun: 0

route:
  enabled: true
  hostnames:
    - memos.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
