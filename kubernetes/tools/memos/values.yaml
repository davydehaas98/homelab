# Notes app with its own login and a SQLite database on the volume
image:
  registry: ghcr.io
  repository: usememos/memos
  tag: 0.31.0

port: 5230

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

persistence:
  size: 1Gi
  mountPath: /var/opt/memos
  # On the default StorageClass (NFS) for now, although SQLite can corrupt on NFS. To move it to
  # an iSCSI disk of its own on yggdrasil (`lun.sh create memos 1G`), add `iscsi` (see kubernetes/media-server/media-server/README.md)

route:
  enabled: true
  hostnames:
    - memos.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
