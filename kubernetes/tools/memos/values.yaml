# Notes app with its own login and a SQLite database on the volume
app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  controllers:
    memos:
      strategy: Recreate
      containers:
        app:
          image:
            repository: ghcr.io/usememos/memos
            tag: 0.31.0
          env:
            TZ: Europe/Amsterdam
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5230
            readiness: *probe
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi

  service:
    app:
      controller: memos
      ports:
        http:
          port: 5230

  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /var/opt/memos
