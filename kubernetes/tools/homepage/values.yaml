# Start page. Its config is in this file and the API keys of the widgets in the Secret `homepage-keys`
# (templates/keys.yaml), which Homepage fills in for `{{HOMEPAGE_VAR_...}}`. There is no Docker socket in the cluster,
# so the services are listed here. The files are mounted into an empty folder, as Homepage writes its logs there.
image:
  registry: ghcr.io
  repository: gethomepage/homepage
  tag: v2.5.0

port: 3000

# No volume, so it updates without a gap
kind: Deployment

env:
  # Requests for other hosts are refused
  HOMEPAGE_ALLOWED_HOSTS: homepage.davydehaas.dev

envFrom:
  - secretRef:
      name: homepage-keys

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1400
  runAsGroup: 1400
  fsGroup: 1400
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

emptyDirs:
  - name: config
    mountPath: /app/config

configFiles:
  - name: config
    mountPath: /app/config
    glob: config/*.yaml

route:
  enabled: true
  hostnames:
    - homepage.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - home.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
