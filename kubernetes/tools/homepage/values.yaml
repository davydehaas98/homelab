# The services are listed in config/, as there is no Docker socket
image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.7.0

port: 3000

kind: Deployment

env:
  HOMEPAGE_ALLOWED_HOSTS: homepage.davydehaas.dev
  # Read for `{{HOMEPAGE_FILE_...}}`: homepage-keys, and the API keys of the *arr apps (see configFiles)
  HOMEPAGE_FILE_BAZARR_KEY: /run/secrets/homepage/HOMEPAGE_VAR_BAZARR_KEY
  HOMEPAGE_FILE_JELLYFIN_KEY: /run/secrets/homepage/HOMEPAGE_VAR_JELLYFIN_KEY
  HOMEPAGE_FILE_LIDARR_KEY: /run/secrets/lidarr/api-key
  HOMEPAGE_FILE_PROWLARR_KEY: /run/secrets/prowlarr/api-key
  HOMEPAGE_FILE_RADARR_KEY: /run/secrets/radarr/api-key
  HOMEPAGE_FILE_SABNZBD_KEY: /run/secrets/homepage/HOMEPAGE_VAR_SABNZBD_KEY
  HOMEPAGE_FILE_SEERR_KEY: /run/secrets/homepage/HOMEPAGE_VAR_SEERR_KEY
  HOMEPAGE_FILE_SONARR_KEY: /run/secrets/sonarr/api-key

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 500Mi
  requests:
    cpu: 20m
    memory: 250Mi

emptyDirs:
  - name: config
    mountPath: /app/config

configFiles:
  - name: config
    mountPath: /app/config
    glob: config/*.yaml
  - name: keys
    mountPath: /run/secrets/homepage
    secret: homepage-keys
    keys:
      - HOMEPAGE_VAR_BAZARR_KEY
      - HOMEPAGE_VAR_JELLYFIN_KEY
      - HOMEPAGE_VAR_SABNZBD_KEY
      - HOMEPAGE_VAR_SEERR_KEY
    defaultMode: 0440
  # Copied here from media-server by kubernetes-replicator
  - name: lidarr-api-key
    mountPath: /run/secrets/lidarr
    secret: lidarr-api-key
    keys:
      - api-key
    defaultMode: 0440
  - name: prowlarr-api-key
    mountPath: /run/secrets/prowlarr
    secret: prowlarr-api-key
    keys:
      - api-key
    defaultMode: 0440
  - name: radarr-api-key
    mountPath: /run/secrets/radarr
    secret: radarr-api-key
    keys:
      - api-key
    defaultMode: 0440
  - name: sonarr-api-key
    mountPath: /run/secrets/sonarr
    secret: sonarr-api-key
    keys:
      - api-key
    defaultMode: 0440

route:
  enabled: true
  hostnames:
    - homepage.davydehaas.dev
  aliases:
    - home.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
