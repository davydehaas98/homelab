# Apps on the cluster use their address in the cluster for the widget, apps on the home server their public one
- Media:
    - Bazarr:
        icon: bazarr.png
        href: https://bazarr.davydehaas.dev
        description: Subtitle management
        siteMonitor: http://bazarr.media-server.svc.cluster.local:6767
        widget:
          type: bazarr
          url: http://bazarr.media-server.svc.cluster.local:6767
          key: "{{HOMEPAGE_FILE_BAZARR_KEY}}"

    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.davydehaas.dev
        description: Media server
        siteMonitor: http://jellyfin.media-server.svc.cluster.local:8096
        widget:
          type: jellyfin
          url: http://jellyfin.media-server.svc.cluster.local:8096
          key: "{{HOMEPAGE_FILE_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          enableMediaControl: false
          showEpisodeNumber: true
          expandOneStreamToTwoRows: false

    - Lidarr:
        icon: lidarr.png
        href: https://lidarr.davydehaas.dev
        description: Music management
        siteMonitor: http://lidarr.media-server.svc.cluster.local:8686
        widget:
          type: lidarr
          url: http://lidarr.media-server.svc.cluster.local:8686
          key: "{{HOMEPAGE_FILE_LIDARR_KEY}}"

    - Plex:
        icon: plex.png
        href: https://plex.davydehaas.dev
        description: Media server
        siteMonitor: https://plex.davydehaas.dev
        widget:
          type: plex
          url: https://plex.davydehaas.dev
          key: "{{HOMEPAGE_VAR_PLEX_KEY}}"

    - Prowlarr:
        icon: prowlarr.png
        href: https://prowlarr.davydehaas.dev
        description: Indexer proxy
        siteMonitor: http://prowlarr.media-server.svc.cluster.local:9696
