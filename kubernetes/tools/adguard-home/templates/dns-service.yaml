# Not translated, so AdGuard Home sees the client address
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-dns
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    lbipam.cilium.io/ips: 192.168.200.60
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
