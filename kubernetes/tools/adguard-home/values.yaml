# A new disk starts the setup wizard on port 3000, which the probes do not cover
image:
  repository: docker.io/adguard/adguardhome
  tag: v0.107.80

port: 80

args:
  - --no-check-update
  - -c
  - /data/conf/AdGuardHome.yaml
  - -w
  - /data/work

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
securityContext:
  # The binary carries a file capability to bind low ports, so the kernel needs it kept
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

resources:
  limits:
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 80Mi

persistence:
  size: 2Gi
  mountPath: /data
  storageClass: zfs-fast
  volumeName: zfs-adguard-home-config

# The gateway login, then its own; DNS has its own Service
route:
  enabled: true
  hostnames:
    - adguard.davydehaas.dev
  aliases:
    - adguardhome.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
