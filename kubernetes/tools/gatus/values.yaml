# Status monitor. The endpoints it checks are in config/config.yaml, with results kept in memory, so there is no
# volume and a restart starts the history again.
image:
  registry: ghcr.io
  repository: twin/gatus
  tag: v5.38.0

port: 8080

# No volume, so it updates without a gap
kind: Deployment

env:
  GATUS_CONFIG_PATH: /config/config.yaml

# DISCORD_WEBHOOK_URL, used in config/config.yaml
envFrom:
  - secretRef:
      name: gatus-discord

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1400
  runAsGroup: 1400
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 70Mi

configFiles:
  - name: config
    mountPath: /config
    glob: config/*.yaml

route:
  enabled: true
  hostnames:
    - gatus.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - status.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
