# Results are kept in memory
image:
  repository: ghcr.io/twin/gatus
  tag: v5.38.0

port: 8080

kind: Deployment

env:
  GATUS_CONFIG_PATH: /config/config.yaml

envFrom:
  - secretRef:
      name: gatus-discord

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 70Mi

configFiles:
  - name: config
    mountPath: /config
    glob: config/*.yaml

route:
  enabled: true
  hostnames:
    - gatus.davydehaas.dev
  aliases:
    - status.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
