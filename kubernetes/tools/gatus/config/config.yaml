# Apps are checked at their address in the cluster or their public one, which also checks the certificate. Gatus
# follows redirects, so a login page counts as up.
metrics: true

storage:
  type: memory

# Notifies Discord after three failed checks, and when the endpoint recovers
alerting:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

ui:
  title: yggdrasil status
  header: yggdrasil

endpoints:
  - name: Dispatcharr
    group: Media
    url: http://dispatcharr.media-server.svc.cluster.local:9191
    interval: 1m
    conditions:
      - "[STATUS] < 400"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: discord
  - name: Jellyfin
    group: Media
    url: http://jellyfin.media-server.svc.cluster.local:8096
    interval: 1m
