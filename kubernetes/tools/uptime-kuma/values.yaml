# Uptime monitor with a SQLite database on the volume. The image runs as root.
image:
  registry: docker.io
  repository: louislam/uptime-kuma
  tag: 2.5.6

port: 3001

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 20m
    memory: 128Mi

# The SQLite database is on an iSCSI disk on yggdrasil, a target of its own for this app, see kubernetes/media-server/media-server/README.md
persistence:
  size: 2Gi
  mountPath: /app/data
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:uptime-kuma
    lun: 0

route:
  enabled: true
  hostnames:
    - uptime-kuma.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - kuma.davydehaas.dev
    - uptime.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
