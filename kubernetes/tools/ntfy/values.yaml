# Users and tokens: see README.md
image:
  repository: docker.io/binwiederhier/ntfy
  tag: v2.38.0

port: 8080
metricsPort: 9090

args:
  - serve

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  fsGroup: 65532
securityContext:
  capabilities:
    drop:
      - ALL

env:
  NTFY_BASE_URL: https://ntfy.davydehaas.dev
  NTFY_LISTEN_HTTP: ":8080"
  NTFY_BEHIND_PROXY: "true"
  NTFY_AUTH_FILE: /var/lib/ntfy/user.db
  NTFY_AUTH_DEFAULT_ACCESS: deny-all
  NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
  NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
  # Needed for instant notifications on iOS
  NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
  NTFY_ENABLE_METRICS: "true"
  NTFY_METRICS_LISTEN_HTTP: ":9090"

probe:
  httpGet:
    path: /v1/health
    port: http

resources:
  limits:
    memory: 100Mi
  requests:
    cpu: 10m
    memory: 30Mi

persistence:
  size: 1Gi
  mountPath: /var/lib/ntfy
  storageClass: zfs-fast

route:
  enabled: true
  hostnames:
    - ntfy.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  auth: native

oidc:
  enabled: false
