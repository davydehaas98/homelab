apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: it-tools
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: it-tools
  # Sign in with Authentik (application `it-tools`), restrict who may log in with policy bindings there.
  # The client credentials are in the `oidc-credentials` Secret of this namespace, see the Authentik README.md
  oidc:
    provider:
      issuer: https://auth.davydehaas.dev/application/o/it-tools/
    clientIDRef:
      name: oidc-credentials
    clientSecret:
      name: oidc-credentials
    redirectURL: https://it-tools.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
