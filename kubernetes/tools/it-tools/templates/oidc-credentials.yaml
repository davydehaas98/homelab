# Also read by Authentik, which kubernetes-replicator copies it to
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: it-tools-oidc-credentials
  namespace: it-tools
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replicate-to: authentik
      name: it-tools-oidc-credentials
      namespace: it-tools
    type: Opaque
