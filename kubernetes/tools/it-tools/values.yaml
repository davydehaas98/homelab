# Static site served by nginx, no state. It runs as uid 101 on port 8080 with its own nginx.conf, as the stock
# image starts nginx as root on port 80.
image:
  registry: ghcr.io
  repository: corentinth/it-tools
  tag: 2024.10.22-7ca5933

port: 8080

# No volume, so it updates without a gap
kind: Deployment

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# nginx writes its pid and temp files here
emptyDirs:
  - name: tmp
    mountPath: /tmp

configFiles:
  - name: nginx
    mountPath: /etc/nginx
    files:
      nginx.conf: |
        worker_processes auto;
        error_log /dev/stderr warn;
        pid /tmp/nginx.pid;
        events {
            worker_connections 1024;
        }
        http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            access_log /dev/stdout;
            sendfile on;
            client_body_temp_path /tmp/client_temp;
            proxy_temp_path /tmp/proxy_temp;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;
            server {
                listen 8080;
                server_name localhost;
                root /usr/share/nginx/html;
                index index.html;
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
        }

resources:
  limits:
    memory: 20Mi
  requests:
    cpu: 10m
    memory: 20Mi

route:
  enabled: true
  hostnames:
    - it-tools.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik. The credentials were sealed as `oidc-credentials`, before the library named them
oidc:
  enabled: true
  secretName: oidc-credentials
