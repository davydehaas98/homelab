# Static site served by nginx, no state. The image starts nginx as root on port 80 and drops to its
# own user, so it keeps a few capabilities instead of running non-root.
image:
  registry: ghcr.io
  repository: corentinth/it-tools
  tag: 2024.10.22-7ca5933

port: 80

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

route:
  enabled: true
  hostnames:
    - it-tools.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik. The credentials were sealed as `oidc-credentials`, before the library named them
oidc:
  enabled: true
  secretName: oidc-credentials
