# WireGuard VPN with a web interface (wg-easy). Its state and settings are a SQLite database in /etc/wireguard, filled
# by its setup wizard. Talos has the kernel module built in and a pod inherits the node's ip_forward, so it needs no
# SYS_MODULE or sysctls. The interface has no route, see README.md.
image:
  registry: ghcr.io
  repository: wg-easy/wg-easy
  tag: 15.5.0

# The VPN port, UDP
port: 51820
protocol: UDP

env:
  # The interface is plain HTTP inside the cluster, which wg-easy refuses to log in over unless told so
  INSECURE: "true"

# The NAT of the VPN clients needs to change the firewall of the pod. The image runs as root.
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_ADMIN

# The VPN port is UDP, so the probe checks the web interface
probe:
  tcpSocket:
    port: 51821

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 10m
    memory: 70Mi

persistence:
  size: 1Gi
  mountPath: /etc/wireguard

# The router forwards UDP 51820 to this address
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.61
