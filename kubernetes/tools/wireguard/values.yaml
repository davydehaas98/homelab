# Talos has the kernel module and the pod inherits ip_forward, so no SYS_MODULE or sysctls
image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: 15.5.0

port: 51820
protocol: UDP

env:
  # Plain HTTP inside the cluster
  INSECURE: "true"

# For the NAT of the VPN clients
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_ADMIN

# The VPN port is UDP
probe:
  tcpSocket:
    port: 51821

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 10m
    memory: 70Mi

persistence:
  size: 1Gi
  mountPath: /etc/wireguard

# The router forwards UDP 51820 here
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.61
