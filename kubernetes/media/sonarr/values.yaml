app-template:
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  controllers:
    sonarr:
      strategy: Recreate
      containers:
        app:
          image:
            repository: ghcr.io/linuxserver/sonarr
            tag: 4.0.20
          env:
            TZ: Europe/Amsterdam
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ping
                  port: 8989
            readiness: *probe
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi

  service:
    app:
      controller: sonarr
      ports:
        http:
          port: 8989

  persistence:
    config:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      globalMounts:
        - path: /config
    media:
      type: persistentVolumeClaim
      existingClaim: media
      globalMounts:
        - path: /downloads
          subPath: downloads
        - path: /series
          subPath: media/series
