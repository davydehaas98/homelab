podSecurityContext:
  fsGroup: 5000
securityContext: {}

mediaPvcName: media

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 20m
    memory: 150Mi

image:
  registry: ghcr.io
  repository: linuxserver/sonarr
  tag: 4.0.20

persistence:
  size: 5Gi
  labels:
    backup.velero.io/include: "true"

route:
  enabled: true
  hostnames:
    - sonarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
