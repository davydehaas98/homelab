apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
  # Sign in with Authentik (application `prowlarr`), restrict who may log in with policy bindings there.
  # The client credentials are in the `prowlarr-oidc-credentials` Secret of this namespace, see the Authentik README.md
  oidc:
    provider:
      issuer: https://auth.davydehaas.dev/application/o/prowlarr/
    clientIDRef:
      name: prowlarr-oidc-credentials
    clientSecret:
      name: prowlarr-oidc-credentials
    redirectURL: https://prowlarr.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
