# To test a game server on an RK1. No autopause, which needs extra privileges.
image:
  repository: docker.io/itzg/minecraft-server
  tag: 2026.10.1-java25

port: 25565

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL

env:
  EULA: "TRUE"
  VERSION: LATEST
  INIT_MEMORY: 1G
  MAX_MEMORY: 3G
  SERVER_NAME: vanilla
  MOTD: Davy's Vanilla Minecraft server.
  MODE: survival
  DIFFICULTY: normal
  MAX_PLAYERS: "10"
  VIEW_DISTANCE: "8"
  SIMULATION_DISTANCE: "6"
  ENABLE_COMMAND_BLOCK: "TRUE"
  PVP: "TRUE"
  ONLINE_MODE: "TRUE"
  OPS: Capta1nCreeper
  WHITELIST: Capta1nCreeper,Draakjeiscool
  ENFORCE_WHITELIST: "TRUE"

# The server port is TCP
probe:
  tcpSocket:
    port: 25565

resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 450m
    memory: 1.5Gi

persistence:
  size: 5Gi
  mountPath: /data
  storageClass: zfs-fast
  volumeName: zfs-minecraft-config

service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: "192.168.1.62,192.168.200.62"
