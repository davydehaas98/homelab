image:
  registry: docker.io
  repository: factoriotools/factorio
  tag: 2.1.24-rootless

replicas: 1

port: 34197
protocol: UDP

# The rootless image runs as uid 1000 in group 0, and the volume is writable through the group 845
podSecurityContext:
  fsGroup: 845
  runAsNonRoot: true
  runAsUser: 1000

# The game port is UDP, so the probe checks RCON
probe:
  tcpSocket:
    port: 27015

resources:
  limits:
    memory: 1.5Gi
  requests:
    cpu: 30m
    memory: 800Mi

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  backup: true
  size: 5Gi
  mountPath: /factorio
  storageClass: zfs-fast
  volumeName: zfs-factorio-config

# Reachable on the LAN at this address, outside the HTTP gateway
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.58
