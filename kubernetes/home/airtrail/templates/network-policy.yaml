apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airtrail-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: airtrail-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
