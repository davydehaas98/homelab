apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: airtrail-database
  annotations:
    # Hibernates while the app is suspended
    cnpg.io/hibernation: {{ if eq (toString .Values.suspend) "true" }}"on"{{ else }}"off"{{ end }}
spec:
  instances: 1
  # With one instance, its budget would block every drain
  enablePDB: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: airtrail-database
  affinity:
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
  resources:
    limits:
      memory: 550Mi
    requests:
      memory: 150Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: airtrail
      owner: airtrail
  storage:
    size: 2Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: zfs-fast
      volumeName: zfs-airtrail-database
      resources:
        requests:
          storage: 2Gi
