image:
  repository: docker.io/johly/airtrail
  tag: v3.14.0

port: 3000

kind: Deployment

# The app writes nothing to disk
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
securityContext:
  capabilities:
    drop:
      - ALL

env:
  # SvelteKit checks it against form posts
  ORIGIN: https://airtrail.davydehaas.dev
  DB_URL:
    secretKeyRef:
      name: airtrail-database-app
      key: uri

resources:
  limits:
    memory: 250Mi
  requests:
    cpu: 150m
    memory: 250Mi

route:
  enabled: true
  hostnames:
    - airtrail.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
