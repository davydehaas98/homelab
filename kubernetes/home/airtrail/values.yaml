# Flight log. The database (templates/database.yaml) is CloudNativePG, so the app keeps no state of its own and
# updates without a gap. Moved from the home server's compose file; its `chain-authentik` login is now the gateway
# login.
image:
  registry: docker.io
  repository: johly/airtrail
  tag: v3.13.1

port: 3000

kind: Deployment

env:
  # The public URL, which SvelteKit checks against form posts behind a proxy
  ORIGIN: https://airtrail.davydehaas.dev
  # The connection string CloudNativePG puts in the Secret of the database
  DB_URL:
    secretKeyRef:
      name: airtrail-database-app
      key: uri

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

route:
  enabled: true
  hostnames:
    - airtrail.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `airtrail`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
