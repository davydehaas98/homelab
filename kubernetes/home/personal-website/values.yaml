image:
  repository: ghcr.io/davydehaas98/personal-website
  tag: 2026.11.3

replicas: 2

port: 8080

kind: Deployment

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

emptyDirs:
  - name: tmp
    mountPath: /tmp

resources:
  limits:
    memory: 20Mi
  requests:
    cpu: 10m
    memory: 20Mi

oidc:
  enabled: false

route:
  auth: public
  enabled: true
  # Stricter than the gateway's defaults, as it only loads its own files
  filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
          - name: cross-origin-embedder-policy
            value: require-corp
          - name: cross-origin-opener-policy
            value: same-origin
          - name: cross-origin-resource-policy
            value: same-origin
          - name: x-frame-options
            value: DENY
          - name: content-security-policy
            # yamllint disable-line rule:line-length
            value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  hostnames:
    - davydehaas.nl
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https-nl-apex
