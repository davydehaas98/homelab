# Notes, with its SQLite database in /var/opt/memos. Moved from the home server's compose file; its `chain-authentik`
# login is now the gateway login.
image:
  registry: ghcr.io
  repository: usememos/memos
  tag: 0.31.0

port: 5230

# Started as root, the entrypoint chowns the data and drops to 10001; started as this user, it skips that
podSecurityContext:
  runAsUser: 1400
  runAsGroup: 1400
  runAsNonRoot: true
  fsGroup: 1400
securityContext:
  capabilities:
    drop:
      - ALL

# The Service `memos` makes Kubernetes set MEMOS_PORT to tcp://<ip>:5230, which Memos reads as port 0
env:
  MEMOS_PORT: 5230

resources:
  limits:
    memory: 60Mi
  requests:
    cpu: 10m
    memory: 40Mi

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  mountPath: /var/opt/memos
  storageClass: zfs-fast
  volumeName: zfs-memos-config

route:
  enabled: true
  hostnames:
    - memos.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `memos`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
