image:
  repository: ghcr.io/usememos/memos
  tag: 26.11.0

port: 5230

# As this user, the entrypoint skips its chown
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
securityContext:
  capabilities:
    drop:
      - ALL

# The Service makes Kubernetes set MEMOS_PORT to a URL, which Memos reads as port 0
env:
  MEMOS_PORT: 5230

resources:
  limits:
    memory: 150Mi
  requests:
    cpu: 10m
    memory: 40Mi

persistence:
  size: 1Gi
  mountPath: /var/opt/memos
  storageClass: zfs-fast
  volumeName: zfs-memos-config

route:
  enabled: true
  hostnames:
    - memos.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
