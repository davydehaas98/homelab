# Runs as root for its init system. The pod network is a trusted proxy, set in the UI (.storage/http).
# config/ reaches the volume through the sidecar below: reload the YAML after a change.
image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: 2026.10.4

port: 8123

# For discovery and HomeKit on midgard-0's network, the Servers VLAN; the gateway reflects mDNS to the other networks.
# The sidecars keep their health port off 8080.
hostNetwork: true

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    memory: 1.5Gi
  requests:
    cpu: 150m
    memory: 650Mi

# Copies the `home-assistant-config` ConfigMaps and Secrets to the volume: once at start, then on change
serviceAccountName: home-assistant
initContainers:
  - name: config-init
    image: docker.io/kiwigrid/k8s-sidecar:2.14.3
    env:
      - name: METHOD
        value: LIST
      - name: HEALTH_PORT
        value: "18080"
      - name: LABEL
        value: home-assistant-config
      - name: FOLDER
        value: /config
      - name: FOLDER_ANNOTATION
        value: io.home-assistant/config-folder
      - name: RESOURCE
        value: both
    volumeMounts: &config-loader-mounts
      - name: config
        mountPath: /config
    # Home Assistant runs as root and owns the files
    securityContext: &config-loader-security
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources: &config-loader-resources
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 40Mi
  - name: config-watch
    restartPolicy: Always
    image: docker.io/kiwigrid/k8s-sidecar:2.14.3
    env:
      - name: IGNORE_ALREADY_PROCESSED
        value: "true"
      - name: HEALTH_PORT
        value: "18080"
      - name: LABEL
        value: home-assistant-config
      - name: FOLDER
        value: /config
      - name: FOLDER_ANNOTATION
        value: io.home-assistant/config-folder
      - name: RESOURCE
        value: both
    volumeMounts: *config-loader-mounts
    securityContext: *config-loader-security
    resources: *config-loader-resources

persistence:
  size: 5Gi
  storageClass: zfs-fast
  volumeName: zfs-home-assistant-config

# Its own login: the mobile app cannot follow a redirect
oidc:
  enabled: false

route:
  auth: native
  enabled: true
  hostnames:
    - home-assistant.davydehaas.dev
  aliases:
    - hass.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
