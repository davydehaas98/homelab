# Home Assistant with its SQLite database on the volume. The image runs as root, its init system needs that.
# The gateway passes the real client address in a header, so its pods (the pod network) are trusted proxies.
# The configuration is in config/, so Home Assistant cannot rewrite it; devices and dashboards are added in the UI.
# The volume holds what the UI writes (automations.yaml, scripts.yaml) and secrets.yaml, with the location. Not moved
# yet: the TTS.
image:
  registry: ghcr.io
  repository: home-assistant/home-assistant
  # The version of the home server's installation, so the move from there is not also an upgrade
  tag: 2026.9.4

port: 8123

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

configFiles:
  - name: config
    mountPath: /config
    glob: config/*.yaml
  - name: integrations
    mountPath: /config/integrations
    glob: config/integrations/*.yaml

# The SQLite database is on an iSCSI disk on yggdrasil, a target of its own for this app, see
# kubernetes/media-server/media-server/README.md
persistence:
  size: 5Gi
  labels:
    backup.velero.io/include: "true"
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:home-assistant
    lun: 0

# Its own login, as the mobile app cannot follow a redirect to the identity provider
route:
  enabled: true
  hostnames:
    - home-assistant.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - hass.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
