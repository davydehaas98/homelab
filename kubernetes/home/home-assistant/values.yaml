# Home Assistant with its SQLite database on the volume. The image runs as root, its init system needs that.
# The gateway passes the real client address in a header, so its pods (the pod network, 10.244.0.0/16) are trusted
# proxies. That is set in the UI and kept in .storage/http on the volume; once migrated there, an `http:` in YAML is
# ignored.
# The configuration is in config/, a file per device or purpose in config/integrations/, so Home Assistant cannot
# rewrite it. Integrations, devices and dashboards are added in the UI and live in .storage on the volume, with what the
# editors write (automations.yaml, scripts.yaml); Velero backs the volume up. The location in secrets.yaml is sealed in
# templates/home-assistant-secrets.yaml.
image:
  registry: ghcr.io
  repository: home-assistant/home-assistant
  # The version of the home server's installation, so the move from there is not also an upgrade
  tag: 2026.10.3

port: 8123

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

configFiles:
  - name: config
    mountPath: /config
    glob: config/*.yaml
  - name: integrations
    mountPath: /config/integrations
    glob: config/integrations/*.yaml
  - name: automations
    mountPath: /config/automations
    glob: config/automations/*.yaml
  - name: scripts
    mountPath: /config/scripts
    glob: config/scripts/*.yaml
  # Only the location (`!secret` in configuration.yaml), as the volume holds no other file Home Assistant needs from it
  - name: secrets
    mountPath: /config
    secret: home-assistant-secrets
    keys:
      - secrets.yaml

# The SQLite database is on an iSCSI disk on yggdrasil, a target of its own for this app, see
# kubernetes/media-server/media-server/README.md
persistence:
  size: 5Gi
  backup: true
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:home-assistant
    lun: 0

# Its own login, as the mobile app cannot follow a redirect to the identity provider
oidc:
  enabled: false

route:
  auth: native
  enabled: true
  hostnames:
    - home-assistant.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - hass.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
