# The configuration in config/, one ConfigMap per folder of /config, subfolders included. The sidecar writes each file
# where the annotation says (see values.yaml), and Home Assistant picks a changed file up when YAML is reloaded
# (Developer tools > YAML), without a restart of the pod. A file that is removed from git stays on the volume until it is
# deleted there.
{{- $folders := dict }}
{{- range $path, $_ := .Files.Glob "config/**.yaml" }}
{{- $_ := set $folders (dir $path) true }}
{{- end }}
{{- range $folder, $_ := $folders }}
{{- $sub := trimPrefix "config" $folder }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" $ }}-cfg-{{ $sub | trimPrefix "/" | replace "/" "-" | default "base" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    home-assistant-config: "1"
  annotations:
    io.home-assistant/config-folder: {{ printf "/config%s" $sub | quote }}
data:
  {{- (($.Files.Glob (printf "%s/*.yaml" $folder)).AsConfig) | nindent 2 }}
{{- end }}
