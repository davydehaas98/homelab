---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
spec:
  encryptedData:
    secrets.yaml: 
  template:
    metadata:
      name: home-assistant-secrets
      namespace: home-assistant
      # The sidecar writes secrets.yaml to /config, see values.yaml. Only the location is in it.
      labels:
        home-assistant-config: "1"
      annotations:
        io.home-assistant/config-folder: /config
    type: Opaque
