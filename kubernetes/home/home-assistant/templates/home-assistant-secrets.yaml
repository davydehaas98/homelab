# secrets.yaml of Home Assistant, which the sidecar writes to /config (see values.yaml); the label and annotation of
# the template tell it where
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
spec:
  encryptedData:
    secrets.yaml: 
  template:
    metadata:
      annotations:
        io.home-assistant/config-folder: /config
      labels:
        home-assistant-config: "1"
      name: home-assistant-secrets
      namespace: home-assistant
    type: Opaque
