# Notifications to the phone.
# Moved here from the automation editor, with the same ids, so the entities keep their history and state. The
# editor shows them but cannot save them: change them in git. New ones made in the editor go to automations.yaml on
# the volume.
- id: '1767795795548'
  alias: Washing machine done
  description: ''
  triggers:
    - type: power
      device_id: 663337a96fda9f3f0eae7c980eff5407
      entity_id: af4688462207bb5bcc85f8aa3599944b
      domain: sensor
      trigger: device
      below: 4
      for:
        hours: 0
        minutes: 0
        seconds: 10
  conditions:
    - condition: and
      conditions:
        - condition: device
          type: is_on
          device_id: 663337a96fda9f3f0eae7c980eff5407
          entity_id: adbd9d9f88a4e97306ec2c32b56d09ad
          domain: switch
          for:
            hours: 0
            minutes: 5
            seconds: 0
  actions:
    - action: notify.mobile_app_davys_iphone_15_pro_max
      metadata: {}
      data:
        message: Washer is done
  mode: single
