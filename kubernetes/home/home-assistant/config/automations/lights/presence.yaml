- id: '1740053048200'
  alias: Coming home
  description: ''
  triggers:
    - trigger: zone
      entity_id: person.davy
      zone: zone.home
      event: enter
  conditions:
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "-01:00:00"
        - condition: sun
          before: sunrise
  actions:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 50
        color_temp_kelvin: 2000
      target:
        entity_id:
          - light.kitchen_lightstrip
          - light.living_lamp_go
          - light.bedroom_light
    - action: light.turn_on
      data:
        brightness_pct: 20
        color_temp_kelvin: 2000
      target:
        entity_id: light.hallway_light
    # The Iris has no color temperature and often misses the first command
    - repeat:
        sequence:
          - action: light.turn_on
            data:
              brightness_pct: 50
              xy_color: [0.598, 0.383]
            target:
              entity_id: light.bedroom_lamp_iris
          - delay:
              seconds: 15
        until:
          - condition: or
            conditions:
              - condition: state
                entity_id: light.bedroom_lamp_iris
                state: "on"
              - condition: template
                value_template: "{{ repeat.index >= 3 }}"
  mode: single
- id: '1746124120811'
  alias: Leaving home
  description: ''
  triggers:
    - trigger: zone
      entity_id: person.davy
      zone: zone.home
      event: leave
  conditions: []
  actions:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        floor_id: '0'
  mode: single
