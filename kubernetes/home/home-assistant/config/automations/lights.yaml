# Lights by time, sun and presence.
# Moved here from the automation editor, with the same ids, so the entities keep their history and state. The
# editor shows them but cannot save them: change them in git. New ones made in the editor go to automations.yaml on
# the volume.
- id: '1740052749577'
  alias: Sunrise
  description: ''
  triggers:
    - trigger: time
      at: 08:00:00
    - trigger: sun
      event: sunrise
      offset: 0
  conditions: []
  actions:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        area_id:
          - living_room
          - bedroom
  mode: single
- id: '1740052903670'
  alias: Sunset
  description: ''
  triggers:
    - trigger: sun
      event: sunset
      offset: -01:00:00
  conditions: []
  actions:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 50
        kelvin: 3385
      target:
        area_id:
          - living_room
          - bedroom
  mode: single
- id: '1740053048200'
  alias: Coming home
  description: ''
  triggers:
    - trigger: zone
      entity_id: person.davy
      zone: zone.home
      event: enter
  conditions: []
  actions:
    - action: light.turn_on
      metadata: {}
      data:
        brightness_pct: 50
        color_temp_kelvin: 2000
      target:
        entity_id:
          - light.kitchen_light_strip
          - light.living_light_go
        area_id:
          - kitchen
          - bedroom
  mode: single
- id: '1746124120811'
  alias: Leaving home
  description: ''
  triggers:
    - trigger: zone
      entity_id: person.davy
      zone: zone.home
      event: leave
  conditions: []
  actions:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        floor_id: '0'
  mode: single
- id: '1771863323896'
  alias: Sleep
  description: ''
  triggers: []
  conditions: []
  actions:
    - action: light.turn_off
      metadata: {}
      target:
        area_id:
          - bedroom
          - living_room
      data: {}
    - action: light.turn_on
      metadata: {}
      target:
        area_id: kitchen
      data:
        brightness_pct: 15
  mode: single
