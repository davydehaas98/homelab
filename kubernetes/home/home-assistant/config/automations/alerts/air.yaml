- id: "1793700000005"
  alias: Ventilate
  description: ""
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_pm25
      above: 50
      for:
        minutes: 15
      variables:
        message: "Fine dust in the bedroom is {{ states('sensor.bedroom_air_quality_pm25') }} µg/m³"
    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_voc_index
      above: 350
      for:
        minutes: 30
      variables:
        message: "The VOC index in the bedroom is {{ states('sensor.bedroom_air_quality_voc_index') }}"
    - trigger: numeric_state
      entity_id:
        - sensor.bedroom_climate_sensor_humidity
        - sensor.bedroom_air_quality_humidity
        - sensor.living_climate_sensor_humidity
      above: 70
      for:
        minutes: 30
      variables:
        message: "The humidity is {{ trigger.to_state.state }}% ({{ trigger.to_state.name }})"
  conditions: []
  actions:
    - action: notify.mobile_app_davys_iphone_18_pro_max
      data:
        title: Ventilate
        message: "{{ message }}"
  mode: single
- id: "1793700000099"
  alias: Ventilate done
  description: ""
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_pm25
      below: 50
      for:
        minutes: 15
      variables:
        message: "Fine dust in the bedroom is back to normal ({{ states('sensor.bedroom_air_quality_pm25') }} µg/m³)"
    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_voc_index
      below: 350
      for:
        minutes: 30
      variables:
        message: "The VOC index in the bedroom is back to normal ({{ states('sensor.bedroom_air_quality_voc_index') }})"
    - trigger: numeric_state
      entity_id:
        - sensor.bedroom_climate_sensor_humidity
        - sensor.bedroom_air_quality_humidity
        - sensor.living_climate_sensor_humidity
      below: 70
      for:
        minutes: 30
      variables:
        message: "The humidity is back to normal at {{ trigger.to_state.state }}% ({{ trigger.to_state.name }})"
  conditions:
    - condition: template
      value_template: >-
        {% set alert = state_attr('automation.ventilate', 'last_triggered') %}
        {% set done = state_attr('automation.ventilate_done', 'last_triggered') %}
        {{ alert is not none and (done is none or alert > done) }}
  actions:
    - action: notify.mobile_app_davys_iphone_18_pro_max
      data:
        title: Ventilate done
        message: "{{ message }}"
  mode: single
- id: "1793700000098"
  alias: Humidify
  description: ""
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.bedroom_climate_sensor_humidity
        - sensor.bedroom_air_quality_humidity
        - sensor.living_climate_sensor_humidity
      below: 30
      for:
        hours: 2
      variables:
        message: "The humidity is {{ trigger.to_state.state }}% ({{ trigger.to_state.name }})"
  conditions: []
  actions:
    - action: notify.mobile_app_davys_iphone_18_pro_max
      data:
        title: Humidify
        message: "{{ message }}"
  mode: single
- id: "1793700000097"
  alias: Humidify done
  description: ""
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.bedroom_climate_sensor_humidity
        - sensor.bedroom_air_quality_humidity
        - sensor.living_climate_sensor_humidity
      above: 30
      for:
        minutes: 30
      variables:
        message: "The humidity is back to normal at {{ trigger.to_state.state }}% ({{ trigger.to_state.name }})"
  conditions:
    - condition: template
      value_template: >-
        {% set alert = state_attr('automation.humidify', 'last_triggered') %}
        {% set done = state_attr('automation.humidify_done', 'last_triggered') %}
        {{ alert is not none and (done is none or alert > done) }}
  actions:
