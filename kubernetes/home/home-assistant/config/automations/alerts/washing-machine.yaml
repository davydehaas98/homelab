- id: "1767795795548"
  alias: Washing machine done
  description: ""
  triggers:
    - trigger: numeric_state
      entity_id: sensor.storage_plug_washing_machine_power
      below: 4
      for:
        seconds: 10
  conditions:
    # A restart of Zigbee2MQTT or Home Assistant is not the end of a wash
    - condition: template
      value_template: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] }}"
  actions:
    - action: notify.mobile_app_davys_iphone_18_pro_max
      data:
        message: Washer is done
  mode: single
