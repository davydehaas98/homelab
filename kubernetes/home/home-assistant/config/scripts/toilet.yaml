toilet:
  sequence:
    - if:
        - condition: state
          entity_id: binary_sensor.toilet_motion_sensor_occupancy
          state: 'on'
      then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: "{{ 10 if now().hour >= 23 or now().hour < 7 else 100 }}"
          target:
            device_id: 3171401fcd0c5fccfeb8da3c588b3d04
        - wait_for_trigger:
            - type: not_occupied
              device_id: 1067cb993be6f0f2968f34ea42fac81b
              entity_id: 3defc0991ca50a4850fcad20c1952446
              domain: binary_sensor
              trigger: device
        - type: turn_off
          device_id: 3171401fcd0c5fccfeb8da3c588b3d04
          entity_id: a184dff4bebf75083f3a80ae44d8d135
          domain: light
  alias: Toilet
  description: ''
