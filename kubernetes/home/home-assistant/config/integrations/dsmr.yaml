# The gateway's status from MQTT, and meters over the DSMR Reader readings
mqtt:
  sensor:
    - name: "DSMR running firmware version"
      unique_id: dsmr_running_firmware_version
      state_topic: dsmr/smart_gateways/running_firmware_version
    - name: "DSMR available firmware version"
      unique_id: dsmr_available_firmware_version
      state_topic: dsmr/smart_gateways/available_firmware_version
    - name: "DSMR update firmware version"
      unique_id: dsmr_update_firmware_version
      state_topic: dsmr/smart_gateways/update_available
    - name: "DSMR MAC address"
      unique_id: dsmr_mac_address
      state_topic: dsmr/smart_gateways/mac_address
    - name: "DSMR Wi-Fi signal strength (RSSI)"
      unique_id: dsmr_wi_fi_signal_strength_rssi
      state_topic: dsmr/smart_gateways/wifi_rssi
      unit_of_measurement: "dBm"
    - name: "DSMR startup time"
      unique_id: dsmr_startup_time
      state_topic: dsmr/smart_gateways/startup_time
      device_class: timestamp
      icon: mdi:clock-start
    - name: "DSMR IP address"
      unique_id: dsmr_ip_address
      state_topic: dsmr/smart_gateways/ip_address

template:
  - sensor:
      - name: "Electricity today"
        unique_id: electricity_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >-
          {{ (states('sensor.daily_energy_delivered_peak') | float(0)
              + states('sensor.daily_energy_delivered_offpeak') | float(0)) | round(3) }}
        availability: >-
          {{ has_value('sensor.daily_energy_delivered_peak') and has_value('sensor.daily_energy_delivered_offpeak') }}
      # Off-peak (dal) is tariff 1, peak (normaal) tariff 2; a measurement, so the statistics keep each day's maximum
      - name: "Electricity cost today"
        unique_id: electricity_cost_today
        unit_of_measurement: "€"
        state_class: measurement
        state: >-
          {{ (states('sensor.daily_energy_delivered_offpeak') | float(0)
                * states('sensor.electricity_price_tariff_1') | float(0)
              + states('sensor.daily_energy_delivered_peak') | float(0)
                * states('sensor.electricity_price_tariff_2') | float(0)) | round(2) }}
        availability: >-
          {{ has_value('sensor.daily_energy_delivered_peak') and has_value('sensor.daily_energy_delivered_offpeak')
             and has_value('sensor.electricity_price_tariff_1') and has_value('sensor.electricity_price_tariff_2') }}

utility_meter:
  hourly_energy_delivered_offpeak:
    unique_id: hourly_energy_delivered_offpeak
    source: sensor.dsmr_reading_electricity_delivered_1
    cycle: hourly
  hourly_energy_delivered_peak:
    unique_id: hourly_energy_delivered_peak
    source: sensor.dsmr_reading_electricity_delivered_2
    cycle: hourly

  hourly_energy_returned_offpeak:
    unique_id: hourly_energy_returned_offpeak
    source: sensor.dsmr_reading_electricity_returned_1
    cycle: hourly
  hourly_energy_returned_peak:
    unique_id: hourly_energy_returned_peak
    source: sensor.dsmr_reading_electricity_returned_2
    cycle: hourly

  daily_energy_delivered_offpeak:
    unique_id: daily_energy_delivered_offpeak
    source: sensor.dsmr_reading_electricity_delivered_1
    cycle: daily
  daily_energy_delivered_peak:
    unique_id: daily_energy_delivered_peak
    source: sensor.dsmr_reading_electricity_delivered_2
    cycle: daily

  daily_energy_returned_offpeak:
    unique_id: daily_energy_returned_offpeak
    source: sensor.dsmr_reading_electricity_returned_1
    cycle: daily
  daily_energy_returned_peak:
    unique_id: daily_energy_returned_peak
    source: sensor.dsmr_reading_electricity_returned_2
    cycle: daily

  monthly_energy_delivered_offpeak:
    unique_id: monthly_energy_delivered_offpeak
    source: sensor.dsmr_reading_electricity_delivered_1
    cycle: monthly
  monthly_energy_delivered_peak:
    unique_id: monthly_energy_delivered_peak
    source: sensor.dsmr_reading_electricity_delivered_2
    cycle: monthly

  monthly_energy_returned_offpeak:
    unique_id: monthly_energy_returned_offpeak
    source: sensor.dsmr_reading_electricity_returned_1
    cycle: monthly
  monthly_energy_returned_peak:
    unique_id: monthly_energy_returned_peak
    source: sensor.dsmr_reading_electricity_returned_2
    cycle: monthly
