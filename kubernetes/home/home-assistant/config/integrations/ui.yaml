# Automations and scripts come from two places. The ones in git are in ../automations, a folder per theme and a file
# per purpose, and ../scripts. The editors of Home Assistant show them but cannot save them; the ones moved here from
# the editors kept their ids, so their entities keep history and state. The editors save what is made in the UI in
# automations.yaml and scripts.yaml on the volume, next to the configuration (Velero backs the volume up). The ids must
# differ between the two. Notifications use the action of the phone in the Companion app, named after the phone, so it
# changes with a new phone.
automation: !include ../automations.yaml
automation git: !include_dir_merge_list ../automations
script: !include ../scripts.yaml
script git: !include_dir_merge_named ../scripts
