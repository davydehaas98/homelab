# The water meter gateway, from MQTT: the reading (a total, for the energy dashboard), the flow, the leak alarm and the
# status of the gateway. The names of the status sensors have no prefix, so their entities are
# sensor.running_firmware_version and so on; renaming them would break the dashboards that use them.
mqtt:
  sensor:
    - name: "Current usage"
      state_topic: watermeter/reading/current_value
      state_class: total_increasing
      device_class: water
      unit_of_measurement: "L"
      icon: mdi:water
    # Litres used in the last minute, so a flow rate: a water sensor may only be a total, and Home Assistant refused
    # `measurement` for it
    - name: "Water used last minute"
      state_topic: watermeter/reading/water_used_last_minute
      state_class: measurement
      device_class: volume_flow_rate
      unit_of_measurement: "L/min"
      icon: mdi:water
    - name: "Running firmware version"
      state_topic: watermeter/smart_gateways/running_firmware_version
    - name: "Available firmware version"
      state_topic: watermeter/smart_gateways/available_firmware_version
    - name: "Update firmware version"
      state_topic: watermeter/smart_gateways/update_available
    - name: "MAC Address"
      state_topic: watermeter/smart_gateways/mac_address
    - name: "Wi-Fi signal strength (RSSI)"
      state_topic: watermeter/smart_gateways/wifi_rssi
      unit_of_measurement: "dBm"
    - name: "Startup time"
      state_topic: watermeter/smart_gateways/startup_time
      device_class: timestamp
      icon: mdi:clock-start
    - name: "IP address"
      state_topic: watermeter/smart_gateways/ip_address

  binary_sensor:
    # The meter publishes true or false, which a sensor with a water device class refused as it expects a number
    - name: "Leak detected"
      state_topic: watermeter/reading/leak_detect
      device_class: moisture
      payload_on: "true"
      payload_off: "false"
