# The device and entity ids are from the old installation. Re-pick the devices in the UI once zigbee2mqtt is moved.
automation:
  - id: "1752317083520"
    alias: Toilet free
    triggers:
      - trigger: device
        domain: binary_sensor
        type: not_occupied
        device_id: 1067cb993be6f0f2968f34ea42fac81b
        entity_id: 3defc0991ca50a4850fcad20c1952446
        for:
          minutes: 5
    actions:
      - action: light.turn_off
        target:
          device_id: 3171401fcd0c5fccfeb8da3c588b3d04
    mode: single

  - id: "1751388526592"
    alias: Toilet occupied
    triggers:
      - trigger: device
        domain: binary_sensor
        type: occupied
        device_id: 1067cb993be6f0f2968f34ea42fac81b
        entity_id: 3defc0991ca50a4850fcad20c1952446
    actions:
      - action: light.turn_on
        data:
          brightness_pct: 100
        target:
          device_id: 3171401fcd0c5fccfeb8da3c588b3d04
    mode: single
