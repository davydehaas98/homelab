# Only the persistence database is on the volume
image:
  repository: docker.io/library/eclipse-mosquitto
  tag: 2.0.22

port: 1883
# The meter gateways use the address of midgard-0
hostPort: 1883

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1883
  runAsGroup: 1883
  fsGroup: 1883
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 20Mi
  requests:
    cpu: 10m
    memory: 20Mi

persistence:
  size: 1Gi
  mountPath: /mosquitto/data
  storageClass: zfs-fast
  volumeName: zfs-mosquitto-config

# Mosquitto wants its password file owned by itself, so copy the mounted Secret
args:
  - sh
  - -c
  - >-
    install -m 0600 /mosquitto/secrets/passwd /mosquitto/run/passwd &&
    exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

emptyDirs:
  - name: run
    mountPath: /mosquitto/run
    medium: Memory
    sizeLimit: 1Mi

configFiles:
  - name: config
    mountPath: /mosquitto/config
    files:
      mosquitto.conf: |
        persistence true
        persistence_location /mosquitto/data/
        log_dest stdout

        # Sealed by seal-passwd.sh
        allow_anonymous false
        password_file /mosquitto/run/passwd

        listener 1883 0.0.0.0
  - name: passwd
    mountPath: /mosquitto/secrets
    secret: mosquitto-passwd
    keys:
      - passwd
    defaultMode: 0440

service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: "192.168.1.57,192.168.200.57"
