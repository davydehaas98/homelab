# MQTT broker for Zigbee2MQTT, Home Assistant and the meter gateways. The config is in this file and only the
# persistence database is in the volume. Like the broker on the home server it needs a username and password, and only
# the LAN can reach it. Websockets (9001) are not exposed.
image:
  registry: docker.io
  repository: library/eclipse-mosquitto
  tag: 2.0.22

port: 1883

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1883
  runAsGroup: 1883
  fsGroup: 1883
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probe:
  tcpSocket:
    port: http

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

persistence:
  size: 1Gi
  mountPath: /mosquitto/data

# Mosquitto wants its password file owned by its own user, and a mounted Secret is owned by root: copy it at the start
args:
  - sh
  - -c
  - >-
    install -m 0600 /mosquitto/secrets/passwd /mosquitto/run/passwd &&
    exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

emptyDirs:
  - name: run
    mountPath: /mosquitto/run
    medium: Memory
    sizeLimit: 1Mi

configFiles:
  - name: config
    mountPath: /mosquitto/config
    files:
      mosquitto.conf: |
        persistence true
        persistence_location /mosquitto/data/
        log_dest stdout

        # One account (admin) for all clients, sealed by seal-passwd.sh into templates/mosquitto-passwd.yaml
        allow_anonymous false
        password_file /mosquitto/run/passwd

        listener 1883 0.0.0.0
  - name: passwd
    mountPath: /mosquitto/secrets
    secret: mosquitto-passwd
    keys:
      - passwd
    defaultMode: 0440

# Reachable on the LAN at this address, outside the HTTP gateway
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.57
