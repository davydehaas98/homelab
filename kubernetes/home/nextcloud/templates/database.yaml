# PostgreSQL for Nextcloud, run by CloudNativePG (kubernetes/storage/cloudnative-pg), which must be deployed first,
# and which creates the Secret `nextcloud-database-app` for it. The database is on an iSCSI disk on yggdrasil, a
# target of its own, see kubernetes/media-server/media-server/README.md; one instance, as each instance needs a disk
# of its own. The disk is owned by the postgres user: `OWNER=26:26 sh lun.sh copy nextcloud-database <empty folder>`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-database
  annotations:
    # While the app is suspended (argocd.yaml), the database pod stops and its volume stays
    cnpg.io/hibernation: {{ if eq (toString .Values.suspend) "true" }}"on"{{ else }}"off"{{ end }}
spec:
  instances: 1
  # The budget of the primary blocks every drain with one instance, so a node upgrade could never finish
  enablePDB: false
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 128Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
  storage:
    size: 10Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      volumeName: nextcloud-database-1
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-database-1
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Mounted by the democratic-csi driver `node-manual` (kubernetes/storage/democratic-csi)
  csi:
    driver: org.democratic-csi.node-manual
    fsType: ext4
    readOnly: false
    volumeHandle: nextcloud-database-1
    volumeAttributes:
      portal: "192.168.1.44:3260"
      iqn: "iqn.2026-10.nl.davydehaas:nextcloud-database"
      lun: "0"
      node_attach_driver: iscsi
      provisioner_driver: node-manual
  claimRef:
    namespace: nextcloud
    name: nextcloud-database-1
