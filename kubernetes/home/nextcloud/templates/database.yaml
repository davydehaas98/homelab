# PostgreSQL for Nextcloud, run by CloudNativePG (kubernetes/storage/cloudnative-pg), which must be deployed first,
# and which creates the Secret `nextcloud-database-app` for it. The database is on a ZFS volume on midgard-0 (see
# kubernetes/storage/zfs-localpv); one instance, as each instance needs a volume of its own.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-database
  annotations:
    # While the app is suspended (argocd.yaml), the database pod stops and its volume stays
    cnpg.io/hibernation: {{ if eq (toString .Values.suspend) "true" }}"on"{{ else }}"off"{{ end }}
spec:
  instances: 1
  # The budget of the primary blocks every drain with one instance, so a node upgrade could never finish
  enablePDB: false
  affinity:
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 150Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
  storage:
    size: 10Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: zfs-fast
      volumeName: zfs-nextcloud-database
      resources:
        requests:
          storage: 10Gi
