# The code, config, themes and custom apps of Nextcloud: some 30,000 small files, on a ZFS volume on midgard-0 (see
# kubernetes/storage/zfs-localpv).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-fast
  volumeName: zfs-nextcloud-html
  resources:
    requests:
      storage: 16Gi
