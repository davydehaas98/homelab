# Redirects to the hostname of the route, so the login and the sync clients use one address
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: redirect
  name: nextcloud-aliases
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - drive.davydehaas.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: nextcloud.davydehaas.dev
            statusCode: 301
