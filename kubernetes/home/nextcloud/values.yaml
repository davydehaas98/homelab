nextcloud:
  replicaCount: 1

  phpClientHttpsFix:
    enabled: true
    protocol: https

  ingress:
    enabled: false

  nextcloud:
    host: nextcloud.davydehaas.dev

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    mail:
      enabled: false

    # The Envoy proxies are in the pod network, and Nextcloud only trusts forwarded addresses from them
    extraEnv:
      - name: TRUSTED_PROXIES
        value: 10.244.0.0/16

  # The database and Valkey are in templates/, as the chart's own use images that are no longer public
  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    existingSecret:
      enabled: true
      secretName: nextcloud-database-app
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname

  externalRedis:
    enabled: true
    host: nextcloud-valkey
    port: "6379"

  # Runs `cron.sh` in a sidecar
  cronjob:
    enabled: true

  # The code and config, and apart from it the files of the users
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 16Gi
    nextcloudData:
      enabled: true
      accessMode: ReadWriteOnce
      size: 200Gi

  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
