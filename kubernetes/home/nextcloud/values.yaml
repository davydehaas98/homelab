nextcloud:
  replicaCount: 1

  phpClientHttpsFix:
    enabled: true
    protocol: https

  ingress:
    enabled: false

  nextcloud:
    host: nextcloud.davydehaas.dev

    # The apache image runs as root, so only seccomp and no privilege escalation
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    mail:
      enabled: false

    # The Envoy proxies are in the pod network, and Nextcloud only trusts forwarded addresses from them
    extraEnv:
      - name: TRUSTED_PROXIES
        value: 10.244.0.0/16
      - name: OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: nextcloud-oidc-credentials
            key: client-id
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: nextcloud-oidc-credentials
            key: client-secret

    # Sign in with Authentik (client `nextcloud`) through the user_oidc app, next to the local login. The credentials
    # are in templates/oidc-credentials.yaml. `occ user_oidc:provider` creates or updates, so it can run on every start.
    hooks:
      before-starting: |
        php /var/www/html/occ app:install user_oidc || true
        php /var/www/html/occ user_oidc:provider authentik \
          --clientid="$OIDC_CLIENT_ID" \
          --clientsecret="$OIDC_CLIENT_SECRET" \
          --discoveryuri=https://auth.davydehaas.dev/application/o/nextcloud/.well-known/openid-configuration \
          --scope="openid email profile" \
          --unique-uid=0 \
          --mapping-uid=preferred_username \
          --mapping-display-name=name \
          --mapping-email=email

  # The database and Valkey are in templates/, as the chart's own use images that are no longer public
  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    existingSecret:
      enabled: true
      secretName: nextcloud-database-app
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname

  externalRedis:
    enabled: true
    host: nextcloud-valkey
    port: "6379"

  # Runs `cron.sh` in a sidecar
  cronjob:
    enabled: true
    sidecar:
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 32Mi

  # The code and config are on an iSCSI disk (templates/html-volume.yaml), and apart from it the files of the users
  persistence:
    enabled: true
    existingClaim: nextcloud-html
    accessMode: ReadWriteOnce
    size: 16Gi
    nextcloudData:
      enabled: true
      accessMode: ReadWriteOnce
      size: 200Gi

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

  # The first start copies Nextcloud to the volume, which takes longer than the liveness probe allows; it may kill the
  # container only after this probe has passed
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 360
