nextcloud:
  replicaCount: 1

  # The tag is rebuilt for PHP fixes
  image:
    pullPolicy: Always

  phpClientHttpsFix:
    enabled: true
    protocol: https

  ingress:
    enabled: false

  nextcloud:
    host: nextcloud.davydehaas.dev

    # The apache image runs as root
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    mail:
      enabled: false

    # Trust forwarded addresses from the Envoy proxies
    extraEnv:
      - name: TRUSTED_PROXIES
        value: 10.244.0.0/16
      - name: OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: nextcloud-oidc-credentials
            key: client-id
      - name: OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: nextcloud-oidc-credentials
            key: client-secret

    # OIDC through the user_oidc app; `occ user_oidc:provider` is safe to rerun
    hooks:
      before-starting: |
        php /var/www/html/occ app:install user_oidc || true
        php /var/www/html/occ user_oidc:provider authentik \
          --clientid="$OIDC_CLIENT_ID" \
          --clientsecret="$OIDC_CLIENT_SECRET" \
          --discoveryuri=https://auth.davydehaas.dev/application/o/nextcloud/.well-known/openid-configuration \
          --scope="openid email profile" \
          --unique-uid=0 \
          --mapping-uid=preferred_username \
          --mapping-display-name=name \
          --mapping-email=email

  # In templates/, as the chart's images are no longer public
  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    existingSecret:
      enabled: true
      secretName: nextcloud-database-app
      usernameKey: username
      passwordKey: password
      hostKey: host
      databaseKey: dbname

  externalRedis:
    enabled: true
    host: nextcloud-valkey
    port: "6379"

  cronjob:
    enabled: true
    sidecar:
      resources:
        limits:
          memory: 450Mi
        requests:
          cpu: 10m
          memory: 250Mi
      securityContext:
        allowPrivilegeEscalation: false

  # The code (templates/html-volume.yaml) and the users' files on `tank`
  persistence:
    enabled: true
    existingClaim: nextcloud-html
    accessMode: ReadWriteOnce
    size: 16Gi
    nextcloudData:
      enabled: true
      storageClass: zfs-tank
      accessMode: ReadWriteOnce
      size: 200Gi

  tolerations:
    - key: davydehaas.dev/dedicated
      operator: Equal
      value: storage
      effect: NoSchedule

  resources:
    limits:
      memory: 600Mi
    requests:
      cpu: 30m
      memory: 200Mi

  # The first start copies Nextcloud to the volume
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 360
