nextcloud:
  replicaCount: 1

  phpClientHttpsFix:
    enabled: true
    protocol: https

  ingress:
    enabled: false

  nextcloud:
    host: drive.davydehaas.dev

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    mail:
      enabled: false

    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: postgresql
    host: postgresql.postgresql.svc.cluster.local
    database: nextcloud

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: postgres-username
      passwordKey: postgres-password



  redis:
    enabled: false

  cronjob:
    enabled: true

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 16Gi

  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  rbac:
    enabled: true
    serviceaccount:
      create: true
      name: nextcloud-serviceaccount
