# PostgreSQL with VectorChord for Immich, run by CloudNativePG (kubernetes/storage/cloudnative-pg), which must be
# deployed first. The extension comes from an image volume. The database is on a ZFS volume on midgard-0 (see
# kubernetes/storage/zfs-localpv); one instance, as each instance needs a volume of its own.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  instances: 1
  # The budget of the primary blocks every drain with one instance, so a node upgrade could never finish
  enablePDB: false
  # Backs up to the bucket `cnpg`, see templates/database-backup.yaml
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-database
  affinity:
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 300Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 32Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: zfs-fast
      volumeName: zfs-immich-database
      resources:
        requests:
          storage: 32Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-database
spec:
  # CloudNativePG creates this database and user, and the Secret `immich-database-app` for them
  name: app
  owner: app
  cluster:
    name: immich-database
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
