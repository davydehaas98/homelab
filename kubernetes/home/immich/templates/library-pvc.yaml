# The photos and videos, a ZFS volume on `tank` (kubernetes/storage/zfs-localpv)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-tank
  volumeName: zfs-immich-library
  resources:
    requests:
      storage: 200Gi
