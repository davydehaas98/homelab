apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: native
  name: immich
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - immich.davydehaas.dev
  rules:
    # Large uploads outlast the default route timeout
    - timeouts:
        request: 0s
      backendRefs:
        - name: immich-server
          port: 2283
