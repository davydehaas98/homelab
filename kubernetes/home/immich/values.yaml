immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.3.3

  immich:
    persistence:
      library:
        existingClaim: immich-library

  # Job queues are lost when valkey restarts, as in a default install. It runs as the valkey user (999).
  valkey:
    enabled: true
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 256Mi
              requests:
                memory: 32Mi

  # The machine learning image runs as any user, its cache is an emptyDir
  machine-learning:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 4Gi
              requests:
                memory: 512Mi

  # The server image runs as root, so only seccomp and no privilege escalation
  server:
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 4Gi
              requests:
                memory: 1Gi
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
