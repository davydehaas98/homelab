immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.3.3

  immich:
    persistence:
      library:
        existingClaim: immich-library

  # Job queues are lost when it restarts, as in a default install
  valkey:
    enabled: true

  server:
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
