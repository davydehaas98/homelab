immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.3.3

  immich:
    persistence:
      library:
        existingClaim: immich-library

  # Job queues are lost when valkey restarts, as in a default install. It runs as the valkey user (999).
  valkey:
    enabled: true
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 40Mi
              requests:
                cpu: 30m
                memory: 30Mi

  # The machine learning image runs as any user, its cache is an emptyDir. The server and this pod keep to the worker:
  # their jobs use several cores for hours, which slows etcd and the API server on the control plane nodes.
  machine-learning:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jotunheim-3
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 80m
                memory: 2.5Gi

  # The server image runs as root but has a node user (1000), which owns the library on NFS (fsGroup does not apply
  # there, the files were chowned once)
  server:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jotunheim-3
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 4.5Gi
              requests:
                cpu: 150m
                memory: 3Gi
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
