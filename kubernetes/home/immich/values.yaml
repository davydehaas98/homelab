immich:
  immich:
    persistence:
      library:
        existingClaim: immich-library

  # Job queues are lost when it restarts
  valkey:
    enabled: true
    defaultPodOptions:
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 40Mi
              requests:
                cpu: 30m
                memory: 30Mi

  # Its long jobs would slow etcd on the control plane nodes
  machine-learning:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: jotunheim-3
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            # Keep equal to the server's tag
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.4.1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 80m
                memory: 2.5Gi

  server:
    defaultPodOptions:
      tolerations:
        - key: davydehaas.dev/dedicated
          operator: Equal
          value: storage
          effect: NoSchedule
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        # midgard-0 has no memory for a second server during an update
        strategy: Recreate
        containers:
          main:
            # Keep equal to the machine learning tag
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 4.5Gi
              requests:
                cpu: 150m
                memory: 3Gi
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname
