image:
  repository: ghcr.io/actualbudget/actual
  tag: 26.11.0

port: 5006

# The image runs as root without needing it
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  fsGroup: 65532
securityContext:
  capabilities:
    drop:
      - ALL

env:
  ACTUAL_DATA_DIR: /data

resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 20m
    memory: 90Mi

persistence:
  size: 1Gi
  mountPath: /data
  storageClass: zfs-fast
  volumeName: zfs-actual-budget-config

route:
  enabled: true
  hostnames:
    - actual.davydehaas.dev
  aliases:
    - budget.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
