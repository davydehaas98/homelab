# Official chart. It merges the `zigbee2mqtt:` block below over the configuration.yaml on the data volume, so only
# set what must differ. The network key, devices and groups stay in the volume: a new volume makes Zigbee2MQTT form a
# new network on the coordinator.
zigbee2mqtt:
  statefulset:
    # A ZFS volume on midgard-0 (kubernetes/storage/zfs-localpv)
    storage:
      enabled: true
      size: 1Gi
      storageClassName: zfs-fast
      existingVolume: zfs-zigbee2mqtt-data

    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

    # The MQTT password of the broker's account admin, from templates/zigbee2mqtt-mqtt.yaml
    env:
      - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: zigbee2mqtt-mqtt
            key: password

    resources:
      limits:
        memory: 250Mi
      requests:
        cpu: 10m
        memory: 200Mi

    # Runs as the image's node user (1000), which owns the data (the files were
    # chowned once)
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # The chart defaults to privileged with SYS_ADMIN for a USB adapter, not needed for a network coordinator
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        add: []
        drop:
          - ALL

  # The yq init container that merges the configuration defaults to root; it only edits files of the same user
  secretesMigratorContainer:
    securityContext:
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  service:
    type: ClusterIP

  httproute:
    enabled: true
    annotations:
      davydehaas.dev/auth: gateway
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: web-https
    hostnames:
      - zigbee.davydehaas.dev

  zigbee2mqtt:
    timezone: Europe/Amsterdam
    # The chart sets the Home Assistant status topic of Zigbee2MQTT 1.x
    homeassistant:
      status_topic: homeassistant/status
    mqtt:
      server: mqtt://mosquitto.mosquitto.svc.cluster.local:1883
      user: admin
      version: 5
    serial:
      port: tcp://192.168.1.30:6638
      adapter: zstack
    # The chart replaces the whole `advanced` block of configuration.yaml, so it repeats the network of the coordinator:
    # without it Zigbee2MQTT refuses to start. The network key is in secret.yaml on the data volume, not in git.
    advanced:
      # The maximum of the coordinator; the chart default is 5
      transmit_power: 20
      channel: 11
      pan_id: 22479
      ext_pan_id: [150, 163, 44, 38, 246, 255, 19, 29]
      network_key: "!secret network_key"
