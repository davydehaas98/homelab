# Official chart. It merges the `zigbee2mqtt:` block below over the configuration.yaml on the data volume, so only
# set what must differ. The network key, devices and groups stay in the volume, copy ~/home-server/zigbee2mqtt/data
# into it before the first start: a new volume makes Zigbee2MQTT form a new network on the coordinator.
zigbee2mqtt:
  statefulset:
    storage:
      enabled: true
      size: 1Gi
      storageClassName: nfs

    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi

    # The chart defaults to privileged with SYS_ADMIN for a USB adapter, not needed for a network coordinator
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        add: []
        drop:
          - ALL

  service:
    type: ClusterIP

  httproute:
    enabled: true
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: web-https
    hostnames:
      - zigbee.davydehaas.dev

  zigbee2mqtt:
    timezone: Europe/Amsterdam
    # The chart sets the Home Assistant status topic of Zigbee2MQTT 1.x
    homeassistant:
      status_topic: homeassistant/status
    mqtt:
      server: mqtt://mosquitto.mosquitto.svc.cluster.local:1883
    serial:
      port: tcp://192.168.1.30:6638
