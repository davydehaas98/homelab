# Merged over configuration.yaml on the volume, which keeps the network key, devices and groups
zigbee2mqtt:
  statefulset:
    storage:
      enabled: true
      storageClassName: zfs-fast
      existingVolume: zfs-zigbee2mqtt-data

    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

    # From templates/zigbee2mqtt-mqtt.yaml
    env:
      - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: zigbee2mqtt-mqtt
            key: password

    resources:
      limits:
        memory: 250Mi
      requests:
        cpu: 10m
        memory: 200Mi

    # The image's node user, which owns the data
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # The chart's privileged default is for a USB adapter
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        add: []
        drop:
          - ALL

  # Root by default, but it only edits files of this user
  secretesMigratorContainer:
    securityContext:
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  service:
    type: ClusterIP

  httproute:
    enabled: true
    annotations:
      davydehaas.dev/auth: gateway
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: web-https
    hostnames:
      - zigbee.davydehaas.dev

  zigbee2mqtt:
    # The chart sets the topic of Zigbee2MQTT 1.x
    homeassistant:
      status_topic: homeassistant/status
    mqtt:
      server: mqtt://mosquitto.mosquitto.svc.cluster.local:1883
      user: admin
      version: 5
    serial:
      port: tcp://192.168.15.30:6638
      adapter: zstack
    # The chart replaces the whole block, and Zigbee2MQTT refuses to start without the network
    advanced:
      # The coordinator's maximum
      transmit_power: 20
      channel: 11
      pan_id: 22479
      ext_pan_id: [150, 163, 44, 38, 246, 255, 19, 29]
      network_key: "!secret network_key"
