# Also read by Authentik, which kubernetes-replicator copies it to
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hubble-oidc-credentials
  namespace: kube-system
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replicate-to: authentik
      name: hubble-oidc-credentials
      namespace: kube-system
    type: Opaque
