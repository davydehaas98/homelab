# Every node on the Servers VLAN (davydehaas.dev/network=servers in its Talos config) peers over eBGP with the UniFi
# gateway there. The gateway's side is terraform/unifi/bgp.conf, which only takes routes from 192.168.200.0/24.
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: gateway-servers
  annotations:
    # The operator installs the BGP CRDs once the control plane is enabled
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nodeSelector:
    matchLabels:
      davydehaas.dev/network: servers
  bgpInstances:
    - name: cluster
      localASN: 64514
      peers:
        - name: gateway
          peerASN: 64513
          peerAddress: 192.168.10.1
          peerConfigRef:
            name: gateway
