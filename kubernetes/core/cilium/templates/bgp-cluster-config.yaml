# Every node peers with the UniFi gateway on the Servers VLAN over eBGP; its side is terraform/unifi/bgp.conf, which
# only takes nodes from 192.168.10.0/24 and routes from 192.168.200.0/24
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: gateway
  annotations:
    # The operator installs the BGP CRDs once the control plane is enabled
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  bgpInstances:
    - name: cluster
      localASN: 64514
      peers:
        - name: gateway
          peerASN: 64513
          peerAddress: 192.168.10.1
          peerConfigRef:
            name: gateway
