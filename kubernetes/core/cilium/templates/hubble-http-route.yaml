apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: gateway
  name: hubble
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - hubble.davydehaas.dev
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
