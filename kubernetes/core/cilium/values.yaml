cilium:
  k8sServiceHost: localhost
  k8sServicePort: 7445

  ipam:
    mode: kubernetes

  kubeProxyReplacement: "true"

  # Talos: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  bgpControlPlane:
    enabled: false

  l2announcements:
    enabled: true

  k8sClientRateLimit:
    qps: 20
    burst: 40

  certgen:
    ttlSecondsAfterFinished: null

  rollOutCiliumPods: true

  # Requests from the VPA recommendations (`kubectl -n kube-system get vpa`), rounded up
  operator:
    # Two, so a drain doesn't leave new pods waiting for an IP
    replicas: 2
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 30m
        memory: 256Mi
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true

  envoy:
    prometheus:
      serviceMonitor:
        enabled: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 64Mi

  # The init containers run briefly, then the agent starts
  initResources:
    limits:
      memory: 512Mi
    requests:
      memory: 32Mi

  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 1Gi

  monitor:
    enabled: true
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 35m
        memory: 64Mi

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    # Grafana only reads ConfigMaps of its own namespace
    namespace: grafana

  hubble:
    enabled: true

    tls:
      auto:
        method: cronJob

    metrics:
      # The metrics and labels the Hubble dashboards query. HTTP metrics only cover traffic that goes
      # through Cilium's L7 proxy.
      enabled:
        - dns:query;ignoreAAAA;labelsContext=source_namespace,destination_namespace
        - drop:labelsContext=source_namespace,destination_namespace
        - tcp:labelsContext=source_namespace,destination_namespace
        - flow:labelsContext=source_namespace,destination_namespace
        - port-distribution:labelsContext=source_namespace,destination_namespace
        - icmp:labelsContext=source_namespace,destination_namespace
        - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
      enableOpenMetrics: true
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        namespace: grafana

    relay:
      enabled: true
      rollOutPods: true
      resources:
        limits:
          memory: 128Mi
        requests:
          cpu: 15m
          memory: 64Mi
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    ui:
      enabled: true
      rollOutPods: true
      backend:
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
      frontend:
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
