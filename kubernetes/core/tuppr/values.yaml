# Keep equal to `talosctl` and `kubectl` in mise.toml; a manual sync starts the upgrade
talos:
  image:
    repository: ghcr.io/siderolabs/talos
    tag: v1.14.5

kubernetes:
  image:
    repository: ghcr.io/siderolabs/kubelet
    tag: v1.37.2

tuppr:
  monitoring:
    serviceMonitor:
      enabled: true

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 10m
      memory: 100Mi
