node-feature-discovery:
  enableNodeFeatureApi: false

  master:
    replicaCount: 1

    # The chart defaults are made for big clusters (limit 4Gi); here it uses ~40Mi, the VPA upper bound is ~100Mi
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 70Mi

  gc:
    enable: true
    replicaCount: 1

    # The chart default is a 1Gi limit, it uses ~30Mi
    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 10m
        memory: 40Mi

  # The chart default is a 512Mi limit, it uses up to ~55Mi
  worker:
    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 30m
        memory: 60Mi

  tls:
    enable: true
    certManager: true
