node-feature-discovery:
  enableNodeFeatureApi: false

  master:
    replicaCount: 1

    # The chart defaults are for big clusters
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 70Mi

  gc:
    enable: true
    replicaCount: 1

    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 10m
        memory: 40Mi

  worker:
    # Also on midgard-0, for its GPU label
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

    resources:
      limits:
        memory: 60Mi
      requests:
        cpu: 30m
        memory: 60Mi

  tls:
    enable: true
    certManager: true
