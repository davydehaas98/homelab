intel-gpu-resource-driver-chart:
  nodeFeatureRules:
    enabled: true

  # Talos' /etc is read-only
  cdi:
    staticPath: /run/cdi

  kubeletPlugin:
    # Without xpumd the driver reads the GPU's details from the device, which needs privileged
    healthMonitoring:
      enabled: false
    privileged: true

    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
