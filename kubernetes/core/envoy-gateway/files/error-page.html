<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <noscript><meta http-equiv="refresh" content="5"></noscript>
  <title>Unavailable</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f4; --card: #ffffff; --text: #1c1917; --muted: #78716c; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #a8a29e; --accent: #2dd4bf; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { margin: 16px; max-width: 420px; padding: 32px; border-radius: 12px; background: var(--card); text-align: center; }
    .code { font-size: 48px; font-weight: 700; color: var(--accent); margin: 0; }
    h1 { font-size: 20px; margin: 8px 0; }
    p { color: var(--muted); margin: 8px 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="code">%RESPONSE_CODE%</p>
    <h1>%REQ(:AUTHORITY)% is unavailable</h1>
    <p>The app is down or restarting.</p>
    <p>Reloading in <span id="seconds">5</span> s</p>
  </main>
  <script>
    let seconds = 5;
    const label = document.getElementById("seconds");
    setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) location.reload();
      else label.textContent = seconds;
    }, 1000);
  </script>
</body>
</html>
