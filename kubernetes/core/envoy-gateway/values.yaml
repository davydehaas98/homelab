gateway-helm:
  deployment:
    envoyGateway:
      resources:
        limits:
          memory: 200Mi
        requests:
          cpu: 20m
          memory: 200Mi
    replicas: 2

  config:
    envoyGateway:
      logging:
        level:
          default: info
      # Backend resources for upstreams outside the cluster (templates/home-server.yaml, plex.yaml)
      extensionApis:
        enableBackend: true
