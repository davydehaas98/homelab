gateway-helm:
  deployment:
    envoyGateway:
      resources:
        limits:
          memory: 200Mi
        requests:
          cpu: 20m
          memory: 200Mi
    replicas: 2

  config:
    envoyGateway:
      logging:
        level:
          default: info
      # Backend resources for upstreams outside the cluster (templates/plex.yaml)
      extensionApis:
        enableBackend: true

# Names under davydehaas.nl that redirect to the same name under davydehaas.dev (templates/nl-redirects.yaml)
nlRedirects:
  - actual
  - adguard
  - adguardhome
  - airtrail
  - argocd
