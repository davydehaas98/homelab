gateway-helm:
  deployment:
    envoyGateway:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
    replicas: 2

  config:
    envoyGateway:
      logging:
        level:
          default: info
      # Backend resources for upstreams outside the cluster (templates/home-server.yaml, plex.yaml)
      extensionApis:
        enableBackend: true
