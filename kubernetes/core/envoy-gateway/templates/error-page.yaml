# Replaces 502, 503 and 504 on every route. The page may use Envoy operators, so no literal percent sign.
apiVersion: v1
kind: ConfigMap
metadata:
  name: error-page
data:
  response.body: |
    {{- .Files.Get "files/error-page.html" | trim | nindent 4 }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: error-page
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-private
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 502
          - type: Value
            value: 503
          - type: Value
            value: 504
      response:
        contentType: text/html; charset=utf-8
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: error-page
