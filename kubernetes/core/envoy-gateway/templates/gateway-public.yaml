apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
spec:
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-gateway
  listeners:
    - name: web-http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: web-https
      protocol: HTTPS
      port: 443
      hostname: "*.davydehaas.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: default-tls-certificate
    - name: web-https-apex
      protocol: HTTPS
      port: 443
      hostname: davydehaas.dev
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: default-tls-certificate
    # The old domain: Plex is served on it, the other names redirect to davydehaas.dev (templates/nl-redirects.yaml)
    - name: web-https-nl
      protocol: HTTPS
      port: 443
      hostname: "*.davydehaas.nl"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nl-tls-certificate
    - name: web-https-nl-apex
      protocol: HTTPS
      port: 443
      hostname: davydehaas.nl
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nl-tls-certificate
