# Plex runs on the network of midgard-0 (kubernetes/media-server/plex). Streams are one long response, so no route
# timeout. A Backend, as Argo CD does not sync EndpointSlices.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: plex
spec:
  endpoints:
    - ip:
        address: 192.168.1.44
        port: 32400
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: native
  name: plex
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: web-https
    - name: envoy-gateway
      sectionName: web-https-nl
  hostnames:
    - plex.davydehaas.dev
    - plex.davydehaas.nl
  rules:
    - timeouts:
        request: 0s
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: plex
          port: 32400
