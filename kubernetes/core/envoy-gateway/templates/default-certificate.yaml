kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: default-tls-certificate
spec:
  secretName: default-tls-certificate
  dnsNames:
    - "*.davydehaas.dev"
    - "*.mcp.davydehaas.dev"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
---
# Its own certificate: Envoy only offers HTTP/2 when listener certificates do not overlap
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: apex-tls-certificate
spec:
  secretName: apex-tls-certificate
  dnsNames:
    - "davydehaas.dev"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
---
# Its own for the same reason
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: lan-tls-certificate
spec:
  secretName: lan-tls-certificate
  dnsNames:
    - "*.lan.davydehaas.dev"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
