kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: default-tls-certificate
spec:
  secretName: default-tls-certificate
  dnsNames:
    - "*.davydehaas.dev"
    - "*.mcp.davydehaas.dev"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
---
# A certificate of its own for the apex: Envoy Gateway only offers HTTP/2 when the certificates of the listeners do not
# overlap, as a browser would reuse a connection for a name it shares a certificate with and get a 404 from this listener
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: apex-tls-certificate
spec:
  secretName: apex-tls-certificate
  dnsNames:
    - "davydehaas.dev"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
