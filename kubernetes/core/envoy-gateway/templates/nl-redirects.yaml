# The old names under davydehaas.nl redirect to the same name under davydehaas.dev. A redirect has a fixed hostname, so
# each name has a route. The apps are not served on the old domain, as their logins belong to davydehaas.dev.
{{- range .Values.nlRedirects }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: redirect
  name: nl-redirect-{{ . }}
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: web-https-nl
  hostnames:
    - {{ . }}.davydehaas.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ . }}.davydehaas.dev
            statusCode: 301
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: redirect
  name: nl-redirect-apex
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: web-https-nl-apex
  hostnames:
    - davydehaas.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: davydehaas.dev
            statusCode: 301
