kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: nl-tls-certificate
spec:
  secretName: nl-tls-certificate
  dnsNames:
    - "*.davydehaas.nl"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
---
# Its own, see default-certificate.yaml
kind: Certificate
apiVersion: cert-manager.io/v1
metadata:
  name: nl-apex-tls-certificate
spec:
  secretName: nl-apex-tls-certificate
  dnsNames:
    - "davydehaas.nl"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-dns
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  revisionHistoryLimit: 1
  usages:
    - digital signature
    - key encipherment
