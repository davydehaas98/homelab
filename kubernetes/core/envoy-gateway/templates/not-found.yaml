# The 404 for unknown hostnames. The page may use Envoy operators, so no literal percent sign.
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-found-page
data:
  response.body: |
    {{- .Files.Get "files/not-found.html" | trim | nindent 4 }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: not-found-page
spec:
  directResponse:
    statusCode: 404
    contentType: text/html; charset=utf-8
    body:
      type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: not-found-page
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: public
  name: not-found
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: web-https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      sectionName: web-https-nl
  hostnames:
    - "*.davydehaas.dev"
    - "*.davydehaas.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: not-found-page
