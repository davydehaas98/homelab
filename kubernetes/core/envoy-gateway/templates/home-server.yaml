# TLS passthrough of davydehaas.nl to the Traefik on the home server, which keeps its own certificates. A Backend, as
# Argo CD does not sync EndpointSlices.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: home-server
spec:
  endpoints:
    - ip:
        address: 192.168.1.44
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: home-server
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: home-server
    - name: envoy-gateway
      sectionName: home-server-apex
  hostnames:
    - '*.davydehaas.nl'
    - davydehaas.nl
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: home-server
          port: 443
