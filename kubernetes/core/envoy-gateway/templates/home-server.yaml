# TLS passthrough of davydehaas.nl to the Traefik on the home server, which keeps its own certificates
apiVersion: v1
kind: Service
metadata:
  name: home-server
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-server
  labels:
    kubernetes.io/service-name: home-server
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.44
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: home-server
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: home-server
    - name: envoy-gateway
      sectionName: home-server-apex
  hostnames:
    - '*.davydehaas.nl'
    - davydehaas.nl
  rules:
    - backendRefs:
        - name: home-server
          port: 443
