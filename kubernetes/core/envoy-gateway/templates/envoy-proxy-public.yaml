apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              revisionHistoryLimit: 0
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits:
                          memory: 128Mi
                        requests:
                          cpu: 10m
                          memory: 32Mi
        replicas: 3
        container:
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyService:
        annotations:
          'io.cilium/lb-ipam-ips': 192.168.1.56
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false