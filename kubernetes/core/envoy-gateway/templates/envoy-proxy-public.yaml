apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              revisionHistoryLimit: 0
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits:
                          memory: 200Mi
                        requests:
                          cpu: 10m
                          memory: 100Mi
        replicas: 3
        container:
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 30m
              memory: 90Mi
      # The entry point of all traffic: a drain evicts one replica at a time. maxUnavailable and not minAvailable, so
      # a replica that cannot start never blocks a drain.
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        annotations:
          "io.cilium/lb-ipam-ips": 192.168.1.56
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false
