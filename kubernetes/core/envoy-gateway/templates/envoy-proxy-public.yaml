apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              revisionHistoryLimit: 0
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits:
                          memory: 200Mi
                        requests:
                          cpu: 10m
                          memory: 100Mi
        replicas: 3
        container:
          resources:
            limits:
              memory: 400Mi
            requests:
              cpu: 30m
              memory: 150Mi
      # maxUnavailable, so a replica that cannot start never blocks a drain
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        annotations:
          "io.cilium/lb-ipam-ips": "192.168.1.56,192.168.200.56"
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false
