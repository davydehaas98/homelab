apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
  tls:
    minVersion: '1.2'
    maxVersion: '1.3'
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
  headers:
    enableEnvoyHeaders: false
    lateResponseHeaders:
      set:
        - name: "strict-transport-security"
          value: "max-age=31536000; includeSubDomains; preload"
        - name: "permissions-policy"
          value: "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
        - name: "referrer-policy"
          value: "no-referrer"
        - name: "x-content-type-options"
          value: "nosniff"
        - name: "x-frame-options"
          value: "DENY"
        - name: "xss-protection"
          value: "1; mode=block"
        - name: "content-security-policy"
          value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri https://auth.davydehaas.dev/csp-report"
        - name: "cache-control"
          value: "private, no-store, no-cache, must-revalidate"
        - name: "reporting-endpoints"
          value: "csp https://auth.davydehaas.dev/csp-report; pki-oversupply https://auth.davydehaas.dev/pki-report"