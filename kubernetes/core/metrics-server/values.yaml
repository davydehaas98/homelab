metrics-server:
  replicas: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  defaultArgs:
    - --cert-dir=/tmp
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
    - --kubelet-insecure-tls

  metrics:
    enabled: true

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 30m
      memory: 90Mi

  serviceMonitor:
    enabled: true
