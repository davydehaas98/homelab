metrics-server:
  serviceAccount:
    create: true

  rbac:
    create: true

  apiService:
    create: true

  hostNetwork:
    enabled: false

  replicas: 2

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  defaultArgs:
    - --cert-dir=/tmp
    - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
    - --kubelet-insecure-tls

  service:
    type: ClusterIP
    port: 443

  metrics:
    enabled: true

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  serviceMonitor:
    enabled: true
