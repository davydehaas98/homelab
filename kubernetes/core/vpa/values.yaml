# Only the recommender: every VPA uses `updateMode: "Off"`
vpa:
  recommender:
    extraArgs:
      # The chart default is debug logging
      v: "1"
      pod-recommendation-min-cpu-millicores: 5
      pod-recommendation-min-memory-mb: 10
      prometheus-address: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
      storage: prometheus
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 80Mi

  updater:
    enabled: false

  admissionController:
    enabled: false

# Only kube-system, which Kyverno skips; it generates the VPAs of the other namespaces
workloads:
  kube-system:
    - DaemonSet/cilium
    - Deployment/cilium-operator
    - Deployment/hubble-relay
    - Deployment/hubble-ui
