argo-cd:
  global:
    revisionHistoryLimit: 0
    logging:
      format: json
      level: warn

  configs:
    cm:
      exec.enabled: true
      url: https://argocd.davydehaas.dev
      # Single sign-on with Authentik. Client ID and secret live in the `argocd-authentik-oidc` Secret
      oidc.config: |
        name: Authentik
        issuer: https://auth.davydehaas.dev/application/o/argocd/
        clientID: $argocd-authentik-oidc:clientID
        clientSecret: $argocd-authentik-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - offline_access
        requestedIDTokenClaims:
          groups:
            essential: true
    rbac:
      policy.default: ""
      policy.csv: |
        g, authentik Admins, role:admin
      scopes: "[groups]"
    secret:
      createSecret: true
    params:
      server.insecure: true

  controller:
    replicas: 1
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 150m
        memory: 512Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  dex:
    enabled: false

  redis:
    enabled: true
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    exporter:
      enabled: true
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 32Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  server:
    replicas: 2

    pdb:
      enabled: true
      minAvailable: 1

    httproute:
      enabled: true
      hostnames:
        - argocd.davydehaas.dev
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https

    configEnabled: false

    rbacConfigCreate: false

  # Renders the manifests of every sync, so while it is down nothing syncs
  repoServer:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  # The chart always deploys the controller; no ApplicationSets are used
  applicationSet:
    replicas: 0

  notifications:
    enabled: false
