argo-cd:
  global:
    revisionHistoryLimit: 0
    logging:
      format: json
      level: warn

  configs:
    cm:
      exec.enabled: true
      url: https://argocd.davydehaas.dev
      timeout.reconciliation: 60s
      timeout.reconciliation.jitter: 10s
      # Only the single sign-on below. If Authentik is down, `argocd --core` with the kubeconfig still works.
      admin.enabled: "false"
      # Single sign-on with Authentik. Client ID and secret live in the `argocd-authentik-oidc` Secret
      oidc.config: |
        name: Authentik
        issuer: https://auth.davydehaas.dev/application/o/argocd/
        clientID: $argocd-authentik-oidc:clientID
        clientSecret: $argocd-authentik-oidc:clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - offline_access
        requestedIDTokenClaims:
          groups:
            essential: true
    rbac:
      policy.default: ""
      policy.csv: |
        g, authentik Admins, role:admin
      scopes: "[groups]"
    secret:
      createSecret: true
    params:
      server.insecure: true

  controller:
    replicas: 1
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 800m
        memory: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  dex:
    enabled: false

  redis:
    enabled: true
    resources:
      limits:
        memory: 70Mi
      requests:
        cpu: 10m
        memory: 70Mi
    exporter:
      enabled: true
      resources:
        limits:
          memory: 40Mi
        requests:
          cpu: 10m
          memory: 30Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  server:
    replicas: 2

    pdb:
      enabled: true
      minAvailable: 1

    httproute:
      enabled: true
      annotations:
        davydehaas.dev/auth: native
      hostnames:
        - argocd.davydehaas.dev
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https

    configEnabled: false

    rbacConfigCreate: false

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 30m
        memory: 150Mi

  # Renders the manifests of every sync, so while it is down nothing syncs
  repoServer:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 300m
        memory: 550Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

  applicationSet:
    replicas: 1
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 40m
        memory: 70Mi

  # Posts to Discord when an app fails to sync or turns unhealthy. The webhook is in
  # templates/notifications-secret.yaml.
  notifications:
    enabled: true
    # The webhook SealedSecret creates it, see templates/notifications-secret.yaml
    secret:
      create: false
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 30m
        memory: 150Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    argocdUrl: https://argocd.davydehaas.dev
    notifiers:
      service.webhook.discord: |
        url: $discord-webhook-url
        headers:
          - name: Content-Type
            value: application/json
    # The Discord message bodies are one JSON line each
    # yamllint disable rule:line-length
    templates:
      template.app-sync-failed: |
        webhook:
          discord:
            method: POST
            body: |
              {"embeds": [{"title": "Sync failed: {{.app.metadata.name}}", "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}", "description": {{.app.status.operationState.message | toJson}}, "color": 15158332}]}
      template.app-health-degraded: |
        webhook:
          discord:
            method: POST
            body: |
              {"embeds": [{"title": "Unhealthy: {{.app.metadata.name}}", "url": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}", "description": "Health is {{.app.status.health.status}}", "color": 15105570}]}
    # yamllint enable rule:line-length
    triggers:
      trigger.on-sync-failed: |
        - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
          oncePer: app.status.operationState.syncResult.revision
          send: [app-sync-failed]
      trigger.on-health-degraded: |
        - when: app.status.health.status == 'Degraded'
          send: [app-health-degraded]
    subscriptions:
      - recipients:
          - webhook:discord
        triggers:
          - on-sync-failed
          - on-health-degraded
