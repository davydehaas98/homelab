---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    # Takes over the empty Secret that the first Helm install of Argo CD left behind
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    discord-webhook-url: 
  template:
    metadata:
      name: argocd-notifications-secret
      namespace: argocd
    type: Opaque
