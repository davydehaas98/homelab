{{- /* Helm must not render the Go templates of the ApplicationSet, so the manifest is a raw string. */ -}}
{{ `
# One Application per argocd.yaml with deploy: true; keys in kubernetes/README.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yggdrasil
  namespace: argocd
spec:
  goTemplate: true
  # Optional keys of argocd.yaml may be absent
  goTemplateOptions: ["missingkey=default"]
  generators:
    - git:
        repoURL: https://github.com/davydehaas98/homelab.git
        revision: HEAD
        files:
          - path: kubernetes/core/*/argocd.yaml
          - path: kubernetes/games/*/argocd.yaml
          - path: kubernetes/home/*/argocd.yaml
          - path: kubernetes/media-server/*/argocd.yaml
          - path: kubernetes/monitoring/*/argocd.yaml
          - path: kubernetes/security/*/argocd.yaml
          - path: kubernetes/storage/*/argocd.yaml
          - path: kubernetes/tools/*/argocd.yaml
      selector:
        matchLabels:
          deploy: "true"
  # No resources-finalizer: removing an app leaves its workloads and volumes
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{.path.basename}}'
      namespace: argocd
      labels:
        davydehaas.dev/group: '{{index .path.segments 1}}'
        davydehaas.dev/app: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/davydehaas98/homelab.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{default .path.basename .namespace}}'
      revisionHistoryLimit: 2
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
          - FailOnSharedResource=true
        automated:
          enabled: true
          prune: true
          selfHeal: true
        retry:
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
  # A patch replaces lists, so syncOptions is repeated
  templatePatch: |
    {{- if .serverSideApply }}
    metadata:
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    {{- end }}
    {{- if or .valueFiles .suspend .ignoreDifferences .serverSideApply (and (hasKey . "autoSync") (not .autoSync)) }}
    spec:
      {{- if or .valueFiles .suspend }}
      source:
        helm:
          {{- with .valueFiles }}
          valueFiles: {{ toJson . }}
          {{- end }}
          {{- if .suspend }}
          parameters:
            - name: suspend
              value: "true"
              forceString: true
          {{- with .suspendValues }}
          valuesObject: {{ toJson . }}
          {{- end }}
          {{- end }}
      {{- end }}
      {{- with .ignoreDifferences }}
      ignoreDifferences: {{ toJson . }}
      {{- end }}
      {{- if or .serverSideApply (and (hasKey . "autoSync") (not .autoSync)) }}
      syncPolicy:
        {{- if and (hasKey . "autoSync") (not .autoSync) }}
        automated:
          enabled: false
        {{- end }}
        {{- if .serverSideApply }}
        syncOptions:
          - RespectIgnoreDifferences=true
          - FailOnSharedResource=true
          - ServerSideApply=true
        {{- end }}
      {{- end }}
    {{- end }}
` }}
