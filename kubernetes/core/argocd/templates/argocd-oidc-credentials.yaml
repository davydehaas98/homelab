# Also read by Authentik, which kubernetes-replicator copies it to
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc-credentials
  namespace: argocd
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replication-allowed: "true"
        replicator.v1.mittwald.de/replication-allowed-namespaces: "authentik"
      labels:
        app.kubernetes.io/part-of: argocd
      name: argocd-oidc-credentials
      namespace: argocd
    type: Opaque
