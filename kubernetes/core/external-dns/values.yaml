external-dns:
  global:
    security:
      # Bitnami removed its versioned images, use the upstream image from registry.k8s.io
      allowInsecureImages: true

  image:
    registry: registry.k8s.io
    repository: external-dns/external-dns
    tag: v0.23.0

  sources:
    - gateway-httproute

  extraArgs:
    # Never publish private gateway IPs (192.168.1.56) to public DNS, it would override the wildcard record
    exclude-target-net: 192.168.0.0/16

  provider: cloudflare

  cloudflare:
    secretName: "cloudflare-api-token"
    proxied: false

  policy: sync

  replicaCount: 1

  crd:
    create: false

  serviceAccount:
    create: true
    automountServiceAccountToken: true

  resources:
    limits:
      memory: 50Mi
    requests:
      cpu: 10m
      memory: 30Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
