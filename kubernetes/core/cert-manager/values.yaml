cert-manager:
  crds:
    enabled: true

  global:
    logLevel: 1

  serviceAccount:
    automountServiceAccountToken: true

  securityContext:
    runAsNonRoot: true

  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  prometheus:
    servicemonitor:
      enabled: true

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 10m
      memory: 70Mi

  # Its webhooks fail closed, so while it is down no Certificate or Issuer can be created
  webhook:
    replicaCount: 2
    timeoutSeconds: 10

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    securityContext:
      runAsNonRoot: true

    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

    serviceAccount:
      automountServiceAccountToken: true

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 50Mi

  cainjector:
    resources:
      limits:
        memory: 300Mi
      requests:
        cpu: 10m
        memory: 200Mi

    securityContext:
      runAsNonRoot: true

    containerSecurityContext:
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

    serviceAccount:
      automountServiceAccountToken: true

  startupapicheck:
    securityContext:
      runAsNonRoot: true

    serviceAccount:
      automountServiceAccountToken: true
