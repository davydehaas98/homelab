# A SealedSecret cannot be copied; annotate the Secret it makes
kubernetes-replicator:
  image:
    repository: quay.io/mittwald/kubernetes-replicator
    tag: v2.12.4

  # Copies a changed or deleted copy back within a minute instead of 30
  args:
    - --resync-period=1m

  podSecurityContext:
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  resources:
    limits:
      memory: 90Mi
    requests:
      cpu: 10m
      memory: 50Mi
