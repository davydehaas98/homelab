# A SealedSecret cannot be copied; annotate the Secret it makes
kubernetes-replicator:
  podSecurityContext:
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  resources:
    limits:
      memory: 90Mi
    requests:
      cpu: 10m
      memory: 50Mi
