# Its tags are unordered commit hashes, so update this by hand
image:
  repository: ghcr.io/linuxserver/lazylibrarian
  tag: 85edbb10-ls387

replicas: 1

securityContext: {}

port: 5299

media:
  claimName: media
  # One mount, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/books
      subPath: data/books

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 30m
    memory: 350Mi

persistence:
  size: 2Gi
  storageClass: zfs-fast

route:
  enabled: true
  hostnames:
    - lazylibrarian.davydehaas.dev
  aliases:
    - books.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
