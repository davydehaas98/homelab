# All-in-one image that needs root to start its services and drops to 1000 itself
image:
  repository: docker.io/dispatcharr/dispatcharr
  tag: 0.33.0

port: 9191

env:
  DISPATCHARR_ENV: aio
  DISPATCHARR_LOG_LEVEL: info
  REDIS_HOST: localhost
  CELERY_BROKER_URL: redis://localhost:6379/0

# The first start sets up the database
probe:
  httpGet:
    path: /
    port: http

resources:
  limits:
    memory: 2.5Gi
  requests:
    cpu: 200m
    memory: 1.5Gi

persistence:
  size: 5Gi
  mountPath: /data
  storageClass: zfs-fast
  volumeName: zfs-dispatcharr-config

# Plex reaches the tuner here
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.59

# Only the player paths, which need an account's credentials, skip the login
route:
  enabled: true
  hostnames:
    - dispatcharr.davydehaas.dev
  aliases:
    - dvr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /player_api.php
    - /panel_api.php
    - /get.php
    - /xmltv.php
    - /live/
    - /movie/
    - /series/
    - /timeshift/
    - /streaming/
    - /logos/
    - /api/channels/logos/
    - /api/vod/vodlogos/
