# IPTV manager that serves Plex as an HDHomeRun tuner and provides M3U and XMLTV output. The all-in-one image runs
# PostgreSQL, Redis, nginx, uWSGI and Celery in one container, so its /data volume is a ZFS volume on midgard-0.
# Left out: GPU devices and a priority boost, which the nodes do not offer. The image needs root to start its services
# (it drops to PUID and PGID itself), so the pod runs as root with the default capabilities.
image:
  registry: docker.io
  repository: dispatcharr/dispatcharr
  tag: 0.33.0

port: 9191

env:
  DISPATCHARR_ENV: aio
  DISPATCHARR_LOG_LEVEL: info
  REDIS_HOST: localhost
  CELERY_BROKER_URL: redis://localhost:6379/0
  PUID: "1400"
  PGID: "1400"

# The first start sets up the database, which takes a few minutes
probe:
  httpGet:
    path: /
    port: http

resources:
  limits:
    memory: 2.5Gi
  requests:
    cpu: 200m
    memory: 1.5Gi

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 5Gi
  mountPath: /data
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-dispatcharr-config

# Plex on the home server reaches the tuner (http://192.168.1.59:9191) on this address, outside the HTTP gateway
service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: 192.168.1.59

# The web UI is behind the gateway login (client `dispatcharr`). The paths that players call with the credentials of an
# account (the Xtream Codes API and its streams) skip it. The playlist, guide, stream and tuner paths (/output/, /hdhr/,
# /proxy/ts/stream/) do not: Dispatcharr answered /output/ to anyone, and Plex on the home server reaches the tuner on
# the LAN address below, outside the gateway.
route:
  enabled: true
  hostnames:
    - dispatcharr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - dvr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /player_api.php
    - /panel_api.php
    - /get.php
    - /xmltv.php
    - /live/
    - /movie/
    - /series/
    - /timeshift/
    - /streaming/
    - /logos/
    - /api/channels/logos/
    - /api/vod/vodlogos/
