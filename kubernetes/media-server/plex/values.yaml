# On the host network of midgard-0, for the port forward and Tautulli
image:
  repository: ghcr.io/linuxserver/plex
  tag: 1.43.5

env:
  VERSION: docker
securityContext: {}

port: 32400
hostNetwork: true

probe:
  httpGet:
    path: /identity
    port: http

resources:
  limits:
    memory: 6Gi
  requests:
    cpu: 100m
    memory: 1Gi

gpu:
  deviceClassName: gpu.intel.com

# Only what cannot be rebuilt: the databases and settings
persistence:
  size: 100Gi
  storageClass: zfs-fast
  volumeName: zfs-plex-config

# Previews, artwork and cache, not backed up
extraClaims:
  - name: plex-cache
    mounts:
      - mountPath: /config/Library/Application Support/Plex Media Server/Cache
        subPath: Cache
      - mountPath: /config/Library/Application Support/Plex Media Server/Media
        subPath: Media
      - mountPath: /config/Library/Application Support/Plex Media Server/Metadata
        subPath: Metadata

# The libraries in Plex refer to these paths
media:
  claimName: media
  mounts:
    - mountPath: /movies
      subPath: data/movies/library
      readOnly: true
    - mountPath: /series
      subPath: data/series/library
      readOnly: true
    - mountPath: /music
      subPath: data/music/library
      readOnly: true
    - mountPath: /dvr
      subPath: data/dvr

emptyDirs:
  - name: transcode
    mountPath: /transcode
    sizeLimit: 20Gi

route:
  enabled: false
