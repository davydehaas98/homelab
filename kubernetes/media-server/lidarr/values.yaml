podSecurityContext:
  fsGroup: 1400
  # The media disk and the backups are large: only change their group when the root of the volume differs
  fsGroupChangePolicy: OnRootMismatch
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media
env:
  PUID: 1400
  PGID: 1400

port: 8686

media:
  claimName: media
  # One mount with only its own downloads and library, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/music
      subPath: data/music

resources:
  limits:
    cpu: 500m
    memory: 350Mi
  requests:
    cpu: 30m
    memory: 300Mi

image:
  registry: ghcr.io
  repository: linuxserver/lidarr
  tag: 3.1.6

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: lidarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 2Gi
  storageClass: zfs-fast
  volumeName: zfs-lidarr-config

route:
  enabled: true
  hostnames:
    - lidarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - music.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `lidarr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
