image:
  repository: ghcr.io/linuxserver/lidarr
  tag: 3.1.6

replicas: 1

securityContext: {}

port: 8686

# The API key, from templates/lidarr-api-key.yaml; it overrides the one in config.xml
env:
  LIDARR__AUTH__APIKEY:
    secretKeyRef:
      name: lidarr-api-key
      key: api-key

media:
  claimName: media
  # One mount, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/music
      subPath: data/music

resources:
  limits:
    cpu: 500m
    memory: 700Mi
  requests:
    cpu: 30m
    memory: 400Mi

backups:
  claimName: backups
  subPath: lidarr

persistence:
  size: 2Gi
  storageClass: zfs-fast
  volumeName: zfs-lidarr-config

route:
  enabled: true
  hostnames:
    - lidarr.davydehaas.dev
  aliases:
    - music.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: lidarr.lan.davydehaas.dev
