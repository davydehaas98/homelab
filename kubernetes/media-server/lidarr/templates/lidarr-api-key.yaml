# The API key of Lidarr, which it reads from LIDARR__AUTH__APIKEY. kubernetes-replicator copies it to homepage;
# terraform/devopsarr/env.sh reads it too
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lidarr-api-key
  namespace: media-server
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replication-allowed: "true"
        replicator.v1.mittwald.de/replication-allowed-namespaces: "homepage"
      name: lidarr-api-key
      namespace: media-server
    type: Opaque
