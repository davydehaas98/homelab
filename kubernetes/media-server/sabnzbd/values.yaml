podSecurityContext:
  fsGroup: 1400
  # The media disk and the backups are large: only change their group when the root of the volume differs
  fsGroupChangePolicy: OnRootMismatch
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media
env:
  PUID: 1400
  PGID: 1400

port: 8080

# SABnzbd rejects requests whose Host header is not in its `host_whitelist`, also from kubelet probes by
# name, so probe the port only. Add sabnzbd.davydehaas.dev to host_whitelist in Config > Special.
probe:
  tcpSocket:
    port: http

media:
  claimName: media
  # One mount, so a finished download moves from incomplete to complete instead of being copied
  mounts:
    - mountPath: /downloads
      subPath: downloads

resources:
  limits:
    cpu: 1000m
    memory: 3.5Gi
  requests:
    cpu: 10m
    memory: 2Gi

image:
  registry: ghcr.io
  repository: linuxserver/sabnzbd
  tag: 5.1.3

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server. Set the
# Backup Folder in SABnzbd (Config > Folders) to /backup.
backups:
  claimName: backups
  subPath: sabnzbd
  mountPath: /backup

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-sabnzbd-config

route:
  enabled: true
  hostnames:
    - sabnzbd.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - usenet.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `sabnzbd`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
