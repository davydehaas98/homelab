podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 8080

# SABnzbd rejects requests whose Host header is not in its `host_whitelist`, also from kubelet probes by
# name, so probe the port only. Add sabnzbd.davydehaas.dev to host_whitelist in Config > Special.
probe:
  tcpSocket:
    port: http

media:
  claimName: media
  mounts:
    - mountPath: /downloads/usenet/complete
      subPath: downloads/usenet/complete
    - mountPath: /downloads/usenet/incomplete
      subPath: downloads/usenet/incomplete

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 50m
    memory: 256Mi

image:
  registry: ghcr.io
  repository: linuxserver/sabnzbd
  tag: 5.1.3

replicas: 1

# The backups of the app are on the RAID of yggdrasil (md0), next to the image of the LUN. Set the
# Backup Folder in SABnzbd (Config > Folders) to /backup.
backups:
  claimName: backups
  subPath: sabnzbd
  mountPath: /backup

# The config is on an iSCSI disk on yggdrasil, a target of its own for this app, see
# kubernetes/media-server/media-server/README.md
persistence:
  size: 1Gi
  backup: true
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:sabnzbd
    lun: 0

route:
  enabled: true
  hostnames:
    - sabnzbd.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - usenet.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `sabnzbd`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
