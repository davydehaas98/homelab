image:
  repository: ghcr.io/linuxserver/sabnzbd
  tag: 5.1.3

replicas: 1

securityContext: {}

port: 8080

# SABnzbd rejects Host headers not in `host_whitelist`, also from probes
probe:
  tcpSocket:
    port: http

media:
  claimName: media
  # One mount, so a finished download is moved, not copied
  mounts:
    - mountPath: /data
      subPath: data

resources:
  limits:
    cpu: 1000m
    memory: 3.5Gi
  requests:
    cpu: 10m
    memory: 2Gi

# Set as the Backup Folder in SABnzbd
backups:
  claimName: backups
  subPath: sabnzbd
  mountPath: /backup

persistence:
  size: 1Gi
  storageClass: zfs-fast
  volumeName: zfs-sabnzbd-config

route:
  enabled: true
  hostnames:
    - sabnzbd.davydehaas.dev
  aliases:
    - usenet.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: sabnzbd.lan.davydehaas.dev
