image:
  repository: ghcr.io/linuxserver/sabnzbd
  tag: 5.1.3

replicas: 1

securityContext: {}

port: 8080

# SABnzbd rejects requests whose Host header is not in its `host_whitelist`, also from kubelet probes by
# name, so probe the port only. Add sabnzbd.davydehaas.dev to host_whitelist in Config > Special.
probe:
  tcpSocket:
    port: http

media:
  claimName: media
  # One mount, so a finished download moves to the folder of its category instead of being copied
  mounts:
    - mountPath: /data
      subPath: data

resources:
  limits:
    cpu: 1000m
    memory: 3.5Gi
  requests:
    cpu: 10m
    memory: 2Gi

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server. Set the
# Backup Folder in SABnzbd (Config > Folders) to /backup.
backups:
  claimName: backups
  subPath: sabnzbd
  mountPath: /backup

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  storageClass: zfs-fast
  volumeName: zfs-sabnzbd-config

route:
  enabled: true
  hostnames:
    - sabnzbd.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - usenet.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `sabnzbd`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is on the private gateway only, protected by the API key of the app
  bypassPaths:
    - /api
  privateHostname: sabnzbd.lan.davydehaas.dev
