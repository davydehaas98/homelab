jellyfin:
  deploymentStrategy:
    type: Recreate

  # The owner of the media
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 911
    runAsGroup: 911
    fsGroup: 911
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 4000m
      memory: 3Gi
    requests:
      cpu: 300m
      memory: 1000Mi

  tolerations:
    - key: davydehaas.dev/dedicated
      operator: Equal
      value: storage
      effect: NoSchedule

  persistence:
    config:
      existingClaim: jellyfin-config
    media:
      enabled: false

  volumes:
    - name: library
      persistentVolumeClaim:
        claimName: media
    # Set as the transcode path in Jellyfin; counts against the memory limit
    - name: transcode
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi

  volumeMounts:
    - name: library
      mountPath: /movies
      subPath: data/movies/library
      readOnly: true
    - name: library
      mountPath: /music
      subPath: data/music/library
      readOnly: true
    - name: library
      mountPath: /series
      subPath: data/series/library
      readOnly: true
    - name: transcode
      mountPath: /data/transcode

  httpRoute:
    enabled: true
    annotations:
      davydehaas.dev/auth: native
    parentRefs:
      - name: envoy-gateway
        namespace: envoy-gateway
        sectionName: web-https
    hostnames:
      - jellyfin.davydehaas.dev
