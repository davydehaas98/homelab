image:
  repository: ghcr.io/linuxserver/bazarr
  tag: 1.6.2

replicas: 1

securityContext: {}

port: 6767

probe:
  httpGet:
    path: /ping
    port: http

media:
  claimName: media
  mounts:
    # The same paths as in Radarr and Sonarr
    - mountPath: /data/movies/library
      subPath: data/movies/library
    - mountPath: /data/series/library
      subPath: data/series/library

resources:
  limits:
    cpu: 500m
    memory: 700Mi
  requests:
    cpu: 300m
    memory: 400Mi

backups:
  claimName: backups
  subPath: bazarr
  mountPath: /config/backup

persistence:
  size: 1Gi
  storageClass: zfs-fast
  volumeName: zfs-bazarr-config

route:
  enabled: true
  hostnames:
    - bazarr.davydehaas.dev
  aliases:
    - subtitles.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
