podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 6767

probe:
  httpGet:
    path: /ping
    port: http

media:
  claimName: media
  mounts:
    - mountPath: /movies
      subPath: media/movies
    - mountPath: /series
      subPath: media/series

resources:
  limits:
    cpu: 500m
    memory: 700Mi
  requests:
    cpu: 300m
    memory: 400Mi

image:
  registry: ghcr.io
  repository: linuxserver/bazarr
  tag: 1.6.2

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: bazarr
  mountPath: /config/backup

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-bazarr-config

route:
  enabled: true
  hostnames:
    - bazarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - subtitles.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `bazarr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
