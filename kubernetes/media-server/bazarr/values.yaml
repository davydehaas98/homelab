podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 6767

probe:
  httpGet:
    path: /ping
    port: http

media:
  claimName: media
  mounts:
    - mountPath: /movies
      subPath: media/movies
    - mountPath: /series
      subPath: media/series

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 20m
    memory: 256Mi

image:
  registry: ghcr.io
  repository: linuxserver/bazarr
  tag: 1.6.2

replicas: 1

# The backups of the app are on the RAID of yggdrasil (md0), next to the image of the LUN
backups:
  claimName: backups
  subPath: bazarr
  mountPath: /config/backup

# The config is on iSCSI LUN 5 on yggdrasil, see kubernetes/media-server/media-server/README.md
persistence:
  size: 1Gi
  labels:
    backup.velero.io/include: "true"
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:yggdrasil
    lun: 5

route:
  enabled: true
  hostnames:
    - bazarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - subtitles.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `bazarr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
