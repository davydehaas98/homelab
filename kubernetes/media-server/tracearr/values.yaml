# Playback monitoring for Plex and Jellyfin. The app keeps no state of its own: its database is templates/postgres.yaml
# (TimescaleDB), its cache templates/valkey.yaml, and its secrets are in `tracearr-env`.
image:
  repository: ghcr.io/connorgallopo/tracearr
  tag: 3.1.3

port: 3000

kind: Deployment

# Runs as the user of the image
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 65533
  fsGroup: 65533
  # The backups are large: only change their group when the root of the volume differs
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  capabilities:
    drop:
      - ALL

env:
  NODE_ENV: production
  PORT: 3000
  HOST: 0.0.0.0
  LOG_LEVEL: INFO
  REDIS_URL: redis://tracearr-valkey:6379

envFrom:
  - secretRef:
      name: tracearr-env

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: tracearr
  mountPath: /data/backup

resources:
  limits:
    memory: 500Mi
  requests:
    cpu: 1500m
    memory: 400Mi

route:
  enabled: true
  hostnames:
    - tracearr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `tracearr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is on the private gateway only, protected by the login of the app itself: the mobile app cannot follow a
  # redirect, so it needs this name and the VPN
  bypassPaths:
    - /api
  privateHostname: tracearr.lan.davydehaas.dev
