# Its database, cache and secrets are in templates/ and `tracearr-env`
image:
  repository: ghcr.io/connorgallopo/tracearr
  tag: 3.1.5

port: 3000

kind: Deployment

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 65533
  fsGroup: 65533
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  capabilities:
    drop:
      - ALL

env:
  NODE_ENV: production
  PORT: 3000
  HOST: 0.0.0.0
  LOG_LEVEL: INFO
  REDIS_URL: redis://tracearr-valkey:6379

envFrom:
  - secretRef:
      name: tracearr-env

backups:
  claimName: backups
  subPath: tracearr
  mountPath: /data/backup

resources:
  limits:
    memory: 500Mi
  requests:
    cpu: 1500m
    memory: 400Mi

route:
  enabled: true
  hostnames:
    - tracearr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The mobile app cannot follow a redirect, so it uses this name over the VPN
  bypassPaths:
    - /api
  privateHostname: tracearr.lan.davydehaas.dev
