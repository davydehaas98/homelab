podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 7878

media:
  claimName: media
  mounts:
    - mountPath: /downloads
      subPath: downloads
    - mountPath: /movies
      subPath: media/movies

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 20m
    memory: 300Mi

image:
  registry: ghcr.io
  repository: linuxserver/radarr
  tag: 6.4.4

replicas: 1

persistence:
  size: 5Gi
  labels:
    backup.velero.io/include: "true"
  # On the default StorageClass (NFS) for now, although SQLite can corrupt on NFS. To move it to
  # iSCSI LUN 2 on yggdrasil, add `iscsi` (see kubernetes/media-server/media-server/README.md)

route:
  enabled: true
  hostnames:
    - radarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - movies.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `radarr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
