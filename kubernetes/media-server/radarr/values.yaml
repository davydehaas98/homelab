image:
  repository: ghcr.io/linuxserver/radarr
  tag: 6.4.4

replicas: 1

securityContext: {}

port: 7878

media:
  claimName: media
  # One mount, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/movies
      subPath: data/movies

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 150m
    memory: 1000Mi

backups:
  claimName: backups
  subPath: radarr

persistence:
  size: 5Gi
  storageClass: zfs-fast
  volumeName: zfs-radarr-config

route:
  enabled: true
  hostnames:
    - radarr.davydehaas.dev
  aliases:
    - movies.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: radarr.lan.davydehaas.dev
