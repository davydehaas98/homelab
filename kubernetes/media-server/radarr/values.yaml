podSecurityContext:
  fsGroup: 1400
  # The media disk and the backups are large: only change their group when the root of the volume differs
  fsGroupChangePolicy: OnRootMismatch
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 7878

media:
  claimName: media
  mounts:
    - mountPath: /downloads
      subPath: downloads
    - mountPath: /movies
      subPath: media/movies

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 150m
    memory: 1000Mi

image:
  registry: ghcr.io
  repository: linuxserver/radarr
  tag: 6.4.4

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: radarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 5Gi
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-radarr-config

route:
  enabled: true
  hostnames:
    - radarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - movies.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `radarr`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
