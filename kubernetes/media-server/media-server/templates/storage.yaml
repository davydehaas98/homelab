# The media disk of midgard-0 (ext4, mounted by Talos at /var/mnt/media), shared by the apps in this namespace, which
# all run on that node. Each app mounts its own subPaths from the `media` claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-local
spec:
  capacity:
    storage: 14Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local
  local:
    path: /var/mnt/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - midgard-0
  claimRef:
    namespace: media-server
    name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local
  volumeName: media-local
  resources:
    requests:
      storage: 14Ti
---
# The backups of the apps (Servarr: System > Backup), a ZFS volume on `tank` (kubernetes/storage/zfs-localpv). One
# folder per app, mounted at /config/Backups.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-tank
  volumeName: zfs-media-server-backups
  resources:
    requests:
      storage: 10Gi
