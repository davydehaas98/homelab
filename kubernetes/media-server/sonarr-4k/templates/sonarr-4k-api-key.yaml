# The API key of Sonarr 4K, which it reads from SONARR__AUTH__APIKEY. kubernetes-replicator copies it to homepage
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sonarr-4k-api-key
  namespace: media-server
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replication-allowed: "true"
        replicator.v1.mittwald.de/replication-allowed-namespaces: homepage
      name: sonarr-4k-api-key
      namespace: media-server
    type: Opaque
