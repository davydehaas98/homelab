podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 8989

media:
  claimName: media
  mounts:
    - mountPath: /downloads
      subPath: downloads
    - mountPath: /series
      subPath: media/series

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 40m
    memory: 1000Mi

image:
  registry: ghcr.io
  repository: linuxserver/sonarr
  tag: 4.0.20

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: sonarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 5Gi
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-sonarr-config

route:
  enabled: true
  hostnames:
    - sonarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - series.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
