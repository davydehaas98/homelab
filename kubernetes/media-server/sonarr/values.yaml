podSecurityContext:
  fsGroup: 1400
securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 8989

media:
  claimName: media
  mounts:
    - mountPath: /downloads
      subPath: downloads
    - mountPath: /series
      subPath: media/series

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 20m
    memory: 256Mi

image:
  registry: ghcr.io
  repository: linuxserver/sonarr
  tag: 4.0.20

replicas: 1

# The backups of the app are on the RAID of yggdrasil (md0), next to the image of the LUN
backups:
  claimName: backups
  subPath: sonarr

# The config is on an iSCSI disk on yggdrasil, a target of its own for this app, see kubernetes/media-server/media-server/README.md
persistence:
  size: 5Gi
  labels:
    backup.velero.io/include: "true"
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:sonarr
    lun: 0

route:
  enabled: true
  hostnames:
    - sonarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - series.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
