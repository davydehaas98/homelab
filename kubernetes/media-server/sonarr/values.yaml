image:
  repository: ghcr.io/linuxserver/sonarr
  tag: 4.0.20

replicas: 1

securityContext: {}

port: 8989

media:
  claimName: media
  # One mount with only its own downloads and library, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/series
      subPath: data/series

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 40m
    memory: 1000Mi

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: sonarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 5Gi
  storageClass: zfs-fast
  volumeName: zfs-sonarr-config

route:
  enabled: true
  hostnames:
    - sonarr.davydehaas.dev
  # Redirects to the hostname above, see kubernetes/_library/app/README.md
  aliases:
    - series.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The API is on the private gateway only, protected by the API key of the app
  bypassPaths:
    - /api
  privateHostname: sonarr.lan.davydehaas.dev
