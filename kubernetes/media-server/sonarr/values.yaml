image:
  repository: ghcr.io/linuxserver/sonarr
  tag: 4.0.20

replicas: 1

securityContext: {}

port: 8989

media:
  claimName: media
  # One mount, so an import moves the file instead of copying it
  mounts:
    - mountPath: /data/series
      subPath: data/series

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 40m
    memory: 1000Mi

backups:
  claimName: backups
  subPath: sonarr

persistence:
  size: 5Gi
  storageClass: zfs-fast
  volumeName: zfs-sonarr-config

route:
  enabled: true
  hostnames:
    - sonarr.davydehaas.dev
  aliases:
    - series.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: sonarr.lan.davydehaas.dev
