image:
  repository: ghcr.io/linuxserver/prowlarr
  tag: 2.7.0

replicas: 1

securityContext: {}

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 450Mi
  requests:
    cpu: 60m
    memory: 250Mi

backups:
  claimName: backups
  subPath: prowlarr

persistence:
  size: 1Gi
  storageClass: zfs-fast
  volumeName: zfs-prowlarr-config

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: prowlarr.lan.davydehaas.dev
