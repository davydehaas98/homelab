podSecurityContext:
  fsGroup: 1400

securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 20m
    memory: 150Mi

image:
  registry: ghcr.io
  repository: linuxserver/prowlarr
  tag: 2.6.5

replicas: 1

persistence:
  size: 1Gi
  labels:
    backup.velero.io/include: "true"
  # On the default StorageClass (NFS) for now, although SQLite can corrupt on NFS. To move it to
  # iSCSI LUN 1 on yggdrasil, add `iscsi` (see kubernetes/media-server/media-server/README.md)

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
