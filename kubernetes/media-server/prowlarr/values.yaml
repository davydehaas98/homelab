podSecurityContext:
  fsGroup: 1400

securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 20m
    memory: 150Mi

image:
  registry: ghcr.io
  repository: linuxserver/prowlarr
  tag: 2.6.5

replicas: 1

media:
  mounts:
    # The backups of the app stay on NFS, next to the database on the LUN
    - mountPath: /config/Backups
      subPath: backups/prowlarr

# The config is on iSCSI LUN 0 on yggdrasil, see kubernetes/media-server/media-server/README.md
persistence:
  size: 1Gi
  labels:
    backup.velero.io/include: "true"
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:yggdrasil
    lun: 0

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
