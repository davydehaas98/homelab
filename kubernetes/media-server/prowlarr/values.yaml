podSecurityContext:
  fsGroup: 1400
  # The media disk and the backups are large: only change their group when the root of the volume differs
  fsGroupChangePolicy: OnRootMismatch

securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media
env:
  PUID: 1400
  PGID: 1400

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 450Mi
  requests:
    cpu: 60m
    memory: 250Mi

image:
  registry: ghcr.io
  repository: linuxserver/prowlarr
  tag: 2.7.0

replicas: 1

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: prowlarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  backup: true
  storageClass: zfs-fast
  volumeName: zfs-prowlarr-config

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
