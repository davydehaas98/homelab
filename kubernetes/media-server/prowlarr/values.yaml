image:
  registry: ghcr.io
  repository: linuxserver/prowlarr
  tag: 2.7.0

replicas: 1

securityContext: {}

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 450Mi
  requests:
    cpu: 60m
    memory: 250Mi

# The backups of the app are in the `backups` claim on `tank`, see kubernetes/media-server/media-server
backups:
  claimName: backups
  subPath: prowlarr

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 1Gi
  storageClass: zfs-fast
  volumeName: zfs-prowlarr-config

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The API is on the private gateway only, protected by the API key of the app
  bypassPaths:
    - /api
  privateHostname: prowlarr.lan.davydehaas.dev
