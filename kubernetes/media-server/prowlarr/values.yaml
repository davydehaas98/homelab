podSecurityContext:
  fsGroup: 1400

securityContext: {}

# linuxserver.io images run as this user and group: the owner of the media on the NFS share
env:
  PUID: 1400
  PGID: 1400

port: 9696

resources:
  limits:
    cpu: 1000m
    memory: 450Mi
  requests:
    cpu: 60m
    memory: 250Mi

image:
  registry: ghcr.io
  repository: linuxserver/prowlarr
  tag: 2.6.5

replicas: 1

# The backups of the app are on the RAID of yggdrasil (md0), next to the image of the LUN
backups:
  claimName: backups
  subPath: prowlarr

# The config is on an iSCSI disk on yggdrasil, a target of its own for this app, see
# kubernetes/media-server/media-server/README.md
persistence:
  size: 1Gi
  backup: true
  iscsi:
    targetPortal: 192.168.1.44:3260
    iqn: iqn.2026-10.nl.davydehaas:prowlarr
    lun: 0

route:
  enabled: true
  hostnames:
    - prowlarr.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
