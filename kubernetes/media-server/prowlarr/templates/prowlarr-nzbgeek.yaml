# The NZBgeek API key, read by terraform/devopsarr/env.sh; Terraform sets it on the indexer in Prowlarr, which only
# returns it masked
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prowlarr-nzbgeek
  namespace: media-server
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      name: prowlarr-nzbgeek
      namespace: media-server
    type: Opaque
