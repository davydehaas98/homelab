image:
  repository: ghcr.io/linuxserver/tautulli
  tag: 2.19.1

securityContext: {}

port: 8181

probe:
  httpGet:
    path: /status
    port: http

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 20m
    memory: 200Mi

persistence:
  size: 10Gi
  storageClass: zfs-fast
  volumeName: zfs-tautulli-config

route:
  enabled: true
  hostnames:
    - tautulli.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

oidc:
  enabled: true
  bypassPaths:
    - /api
  privateHostname: tautulli.lan.davydehaas.dev
