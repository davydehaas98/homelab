# Plex monitoring. Moved from the home server's compose file. Plex stays on the home server, so after copying the
# config set the server address in Tautulli (Settings > Plex Media Server) to http://192.168.1.44:32400, as the old one
# may be the Docker name `plex`. Left out: the read-only mount of the Plex config, which Tautulli only reads for the
# logs of Plex (Settings > Plex Media Server > Logs Folder), and the /logs mount, which the image does not use.
image:
  registry: ghcr.io
  repository: linuxserver/tautulli
  tag: 2.18.2

# linuxserver.io images run as this user and group: the owner of the media
podSecurityContext:
  fsGroup: 1400
securityContext: {}
env:
  PUID: 1400
  PGID: 1400

port: 8181

probe:
  httpGet:
    path: /status
    port: http

resources:
  limits:
    memory: 300Mi
  requests:
    cpu: 20m
    memory: 200Mi

# A ZFS volume on midgard-0, see kubernetes/storage/zfs-localpv
persistence:
  size: 10Gi
  storageClass: zfs-fast
  volumeName: zfs-tautulli-config

route:
  enabled: true
  hostnames:
    - tautulli.davydehaas.dev
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https

# Sign in with Authentik (client `tautulli`), the credentials are in templates/oidc-credentials.yaml
oidc:
  enabled: true
  # The API is protected by the API key of the app, not by the login
  bypassPaths:
    - /api
