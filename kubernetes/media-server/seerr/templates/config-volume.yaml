# The config is on an iSCSI disk on yggdrasil, a target of its own for this app, see
# kubernetes/media-server/media-server/README.md. Seerr has no backup folder of its own.
# The driver `node-manual` (kubernetes/storage/democratic-csi) mounts it. The chart makes the claim and binds it
# to this volume (`config.persistence.volumeName`).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-server-seerr-config
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: org.democratic-csi.node-manual
    fsType: ext4
    readOnly: false
    volumeHandle: media-server-seerr-config
    volumeAttributes:
      portal: "192.168.1.44:3260"
      iqn: "iqn.2026-10.nl.davydehaas:seerr"
      lun: "0"
      node_attach_driver: iscsi
      provisioner_driver: node-manual
  claimRef:
    namespace: media-server
    name: seerr-config
