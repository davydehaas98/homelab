apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-aliases
spec:
  parentRefs:
    {{- toYaml (index .Values "seerr-chart").route.main.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.aliases | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ first (index .Values "seerr-chart").route.main.hostnames }}
            statusCode: 301
