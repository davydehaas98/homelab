seerr-chart:
  fullnameOverride: seerr

  # Runs as this user and group, the same as the container on the home server
  podSecurityContext:
    fsGroup: 1400
  securityContext:
    runAsUser: 1400
    runAsGroup: 1400

  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: TZ
      value: Europe/Amsterdam

  service:
    port: 5055

  # The volume is in templates/config-volume.yaml. "-" is no storage class, so the claim binds to it by name
  config:
    persistence:
      size: 1Gi
      storageClass: "-"
      volumeName: media-server-seerr-config

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 20m
      memory: 256Mi

  # Requests come from outside, so there is no login at the gateway: Seerr has its own
  route:
    main:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - seerr.davydehaas.dev
    # Redirect to the hostname above. The chart adds its own rule after this one, which is never reached
    aliases:
      enabled: true
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - request.davydehaas.dev
        - requests.davydehaas.dev
      additionalRules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                hostname: seerr.davydehaas.dev
                statusCode: 301
