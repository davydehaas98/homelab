seerr-chart:
  fullnameOverride: seerr

  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000

  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: TZ
      value: Europe/Amsterdam

  service:
    port: 5055

  tolerations:
    - key: davydehaas.dev/dedicated
      operator: Equal
      value: storage
      effect: NoSchedule
  config:
    persistence:
      size: 1Gi
      storageClass: zfs-fast
      volumeName: zfs-seerr-config

  resources:
    limits:
      cpu: 1000m
      memory: 500Mi
    requests:
      cpu: 10m
      memory: 300Mi

  # Seerr has its own login
  route:
    main:
      enabled: true
      annotations:
        davydehaas.dev/auth: native
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - seerr.davydehaas.dev
    # The chart's own rule after this one is never reached
    aliases:
      enabled: true
      annotations:
        davydehaas.dev/auth: redirect
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - request.davydehaas.dev
        - requests.davydehaas.dev
      additionalRules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                hostname: seerr.davydehaas.dev
                statusCode: 301
