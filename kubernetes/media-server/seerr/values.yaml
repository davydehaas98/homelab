seerr-chart:
  fullnameOverride: seerr

  # Runs as the owner of its config
  podSecurityContext:
    fsGroup: 1400
  securityContext:
    runAsUser: 1400
    runAsGroup: 1400

  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: TZ
      value: Europe/Amsterdam

  service:
    port: 5055

  # A ZFS volume on midgard-0 (kubernetes/storage/zfs-localpv), which the claim binds to by name
  tolerations:
    - key: davydehaas.dev/dedicated
      operator: Equal
      value: storage
      effect: NoSchedule
  config:
    persistence:
      size: 1Gi
      storageClass: zfs-fast
      volumeName: zfs-seerr-config

  resources:
    limits:
      cpu: 1000m
      memory: 500Mi
    requests:
      cpu: 10m
      memory: 300Mi

  # Requests come from outside, so there is no login at the gateway: Seerr has its own
  route:
    main:
      enabled: true
      annotations:
        davydehaas.dev/auth: native
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - seerr.davydehaas.dev
    # Redirect to the hostname above. The chart adds its own rule after this one, which is never reached
    aliases:
      enabled: true
      annotations:
        davydehaas.dev/auth: redirect
      parentRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - request.davydehaas.dev
        - requests.davydehaas.dev
      additionalRules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                hostname: seerr.davydehaas.dev
                statusCode: 301
