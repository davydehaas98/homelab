nfs-subdir-external-provisioner:
  # NFS export on the home server (yggdrasil), see README.md
  nfs:
    server: 192.168.1.44
    path: /mnt/md0/kubernetes
    mountOptions:
      - nfsvers=4.1
      - hard

  storageClass:
    name: nfs
    # zfs-fast (storage/zfs-localpv) is the default
    defaultClass: false
    reclaimPolicy: Retain
    archiveOnDelete: true
    accessModes: ReadWriteOnce

  resources:
    limits:
      memory: 40Mi
    requests:
      cpu: 10m
      memory: 30Mi
