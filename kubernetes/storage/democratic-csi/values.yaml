# Mounts the iSCSI LUNs that lun.sh makes on the home server (yggdrasil) on the node of the pod. The
# driver `node-manual` only attaches volumes whose PersistentVolume is written by hand, here by the `app`
# library chart (persistence.iscsi), it provisions nothing. Every volume needs a target of its own: on unstage
# the driver logs the node out of the whole target, which would cut the other volumes of that target. See kubernetes/media-server/media-server/README.md.
democratic-csi:
  csiDriver:
    # Has to equal the `driver` in the PersistentVolumes of the library chart
    name: org.democratic-csi.node-manual

  controller:
    externalAttacher:
      enabled: true
    externalProvisioner:
      enabled: false
    externalResizer:
      enabled: false
    externalSnapshotter:
      enabled: false
    driver:
      image:
        registry: ghcr.io/democratic-csi/democratic-csi
        tag: v1.9.5

  driver:
    config:
      driver: node-manual

  node:
    # Talos has no iscsiadm in the PATH of a container: the driver enters the host and runs the one of the
    # iscsi-tools extension (/usr/local/sbin), which talks to ext-iscsid
    hostPID: true
    driver:
      image:
        registry: ghcr.io/democratic-csi/democratic-csi
        tag: v1.9.5
      extraEnv:
        - name: ISCSIADM_HOST_STRATEGY
          value: nsenter
        - name: ISCSIADM_HOST_PATH
          value: /usr/local/sbin/iscsiadm
      iscsiDirHostPath: /var/iscsi
      iscsiDirHostPathType: ""
