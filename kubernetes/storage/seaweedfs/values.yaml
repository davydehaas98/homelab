seaweedfs:
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false

  allInOne:
    enabled: true
    replicas: 1

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-config
      createBuckets:
        - name: loki-chunks
        - name: loki-ruler
        - name: loki-admin
        - name: velero
        - name: talos-backup
        - name: cnpg

    data:
      type: persistentVolumeClaim
      size: 500Gi
      storageClass: zfs-tank
    # A string in this chart
    tolerations: |
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

    # weed only needs to own /data, which was chowned once
    podSecurityContext:
      enabled: true
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    affinity: ""

    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 30m
        memory: 950Mi
