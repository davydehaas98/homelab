seaweedfs:
  # The all-in-one pod below replaces the separate components
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false

  # Single pod with master, volume server, filer and S3 gateway. Plenty for a homelab.
  allInOne:
    enabled: true
    replicas: 1

    s3:
      enabled: true
      enableAuth: true
      # Secret with key `seaweedfs_s3_config`, see README.md
      existingConfigSecret: seaweedfs-s3-config
      createBuckets:
        - name: loki-chunks
        - name: loki-ruler
        - name: loki-admin
        - name: velero
        - name: talos-backup
        - name: cnpg

    # A ZFS volume on `tank` on midgard-0 (kubernetes/storage/zfs-localpv), bound to the chart's claim
    data:
      type: persistentVolumeClaim
      size: 500Gi
      storageClass: zfs-tank
    # A string in this chart
    tolerations: |
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

    # The image runs as root, but weed only needs to own /data (tested as nobody). The files were chowned once,
    # so fsGroup is not needed.
    podSecurityContext:
      enabled: true
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # One replica, no need for anti-affinity
    affinity: ""

    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 30m
        memory: 950Mi
