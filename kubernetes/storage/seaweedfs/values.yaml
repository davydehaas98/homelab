seaweedfs:
  # The all-in-one pod below replaces the separate components
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false

  # Single pod with master, volume server, filer and S3 gateway. Plenty for a homelab.
  allInOne:
    enabled: true
    replicas: 1

    s3:
      enabled: true
      enableAuth: true
      # Secret with key `seaweedfs_s3_config`, see README.md
      existingConfigSecret: seaweedfs-s3-config
      createBuckets:
        - name: loki-chunks
        - name: loki-ruler
        - name: loki-admin
        - name: velero

    data:
      type: persistentVolumeClaim
      size: 20Gi
      storageClass: nfs

    # The image runs as root, so only seccomp and no privilege escalation
    podSecurityContext:
      enabled: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false

    # One replica, no need for anti-affinity
    affinity: ""

    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
