velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /target
          name: plugins

  # The image runs as the named user cnb (1002:1000), so runAsNonRoot needs the numbers. The node agent has its own
  # security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1002
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  configuration:
    # SeaweedFS S3 gateway, bucket `velero`, see README.md
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero
        default: true
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: http://seaweedfs-all-in-one.seaweedfs:8333
    # Snapshots stay on the node only until they are copied to the bucket, by Kopia in a pod per volume
    volumeSnapshotLocation: []
    uploaderType: kopia
    features: EnableCSI

  credentials:
    useSecret: true
    # SealedSecret with key `cloud`, see README.md
    existingSecret: velero-credentials

  snapshotsEnabled: false
  deployNodeAgent: true

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 30m
      memory: 450Mi

  # It reads the volumes of other pods from the host as root, which needs a Kyverno exemption
  # (kubernetes/security/kyverno); seccomp and no privilege escalation it can take. The chart's runAsUser 0 stays.
  nodeAgent:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
    # Also on midgard-0, where the volumes on ZFS are
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 100Mi

  # Daily at 02:00 UTC, an hour before talos-backup. Each volume is snapshotted, copied to the bucket and the snapshot
  # removed, as it counts towards the quota of its volume. See README.md for what is left out.
  schedules:
    daily:
      schedule: "0 2 * * *"
      template:
        ttl: 720h
        snapshotVolumes: true
        snapshotMoveData: true
        excludedNamespaces:
          - loki
          - prometheus
          - seaweedfs
