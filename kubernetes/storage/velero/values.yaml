velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.14.4
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - mountPath: /target
          name: plugins

  # The image's user is named, so runAsNonRoot needs the numbers
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1002
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: velero
        default: true
        config:
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: http://seaweedfs-all-in-one.seaweedfs:8333
    # Snapshots only stay on the node until Kopia copies them to the bucket
    volumeSnapshotLocation: []
    uploaderType: kopia
    features: EnableCSI

  credentials:
    existingSecret: velero-credentials

  snapshotsEnabled: false
  deployNodeAgent: true

  # For the backup alerts in monitoring/prometheus; the chart's autodetect does not see the CRD under Argo CD
  metrics:
    serviceMonitor:
      enabled: true

  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 30m
      memory: 700Mi

  # Reads other pods' volumes from the host as root, with a Kyverno exemption
  nodeAgent:
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 100Mi

  # An hour before talos-backup; snapshots are removed after the copy, as they count towards the quota
  schedules:
    daily:
      schedule: "0 2 * * *"
      template:
        ttl: 720h
        snapshotVolumes: true
        snapshotMoveData: true
        excludedNamespaces:
          - loki
          - prometheus
          - seaweedfs
