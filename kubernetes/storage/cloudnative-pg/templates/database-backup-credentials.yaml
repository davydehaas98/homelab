# The SeaweedFS identity cnpg of the Barman plugin, for every database. kubernetes-replicator copies it to the
# namespaces of the databases, where their ObjectStore reads it; a new database needs its namespace added below and
# the empty Secret in its database-backup.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: database-backup-credentials
  namespace: cnpg-system
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      annotations:
        replicator.v1.mittwald.de/replication-allowed: "true"
        replicator.v1.mittwald.de/replication-allowed-namespaces: "airtrail,authentik,immich,nextcloud"
      name: database-backup-credentials
      namespace: cnpg-system
    type: Opaque
