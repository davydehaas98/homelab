cloudnative-pg:
  crds:
    create: true

  # Its webhooks fail closed; one replica leads, the other waits
  replicaCount: 2

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 30m
      memory: 100Mi

plugin-barman-cloud:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
