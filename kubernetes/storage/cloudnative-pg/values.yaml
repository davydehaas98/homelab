cloudnative-pg:
  crds:
    create: true

  # Its webhooks fail closed, so while it is down no database cluster can be changed. One replica leads
  # (`--leader-elect`), the other waits. The chart has no PodDisruptionBudget, see templates/pod-disruption-budget.yaml.
  replicaCount: 2

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 30m
      memory: 100Mi

# Backs up the databases to the bucket `cnpg` on SeaweedFS, see README.md. Its TLS certificates come from cert-manager.
plugin-barman-cloud:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
