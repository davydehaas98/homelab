# No finalizer and not pruned, so removing an entry never destroys a dataset
{{- range .Values.volumes }}
{{- $pool := .pool | default "fast" }}
---
apiVersion: zfs.openebs.io/v1
kind: ZFSVolume
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity: {{ mul (trimSuffix "Gi" .size | int64) 1073741824 | quote }}
  fsType: zfs
  ownerNodeID: midgard-0
  poolName: {{ $pool }}/k8s
  volumeType: DATASET
  {{- with .shared }}
  shared: {{ . | quote }}
  {{- end }}
status:
  state: Ready
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zfs-{{ .name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: {{ .size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-{{ $pool }}
  csi:
    driver: zfs.csi.openebs.io
    fsType: zfs
    volumeHandle: {{ .name }}
    volumeAttributes:
      openebs.io/poolname: {{ $pool }}/k8s
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - midgard-0
  claimRef:
    namespace: {{ .namespace }}
    name: {{ .claim | default .name }}
{{- end }}
