zfs-localpv:
  analytics:
    enabled: false

  # The snapshot CRDs and controller come from the snapshot-controller app
  crds:
    csi:
      volumeSnapshots:
        enabled: false

  zfsController:
    snapshotController:
      enabled: false

  zfsNode:
    # Talos' root is read-only
    encrKeysDir: /var/openebs/keys

    # The pools are on midgard-0 only
    nodeSelector:
      kubernetes.io/hostname: midgard-0
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

# The nightly backup, README.md. 01:00 UTC, before the Velero backup (02:00 UTC).
backup:
  image:
    registry: docker.io
    repository: alpine/k8s
    tag: 1.37.1
  schedule: "0 1 * * *"
  # Days of dumps and of copies on `tank`
  keep: 14
  # Datasets of `fast` not worth copying: metrics that change all day, and a cache
  exclude:
    - prometheus-db
    - trivy-server
  databases:
    - name: airtrail
      namespace: airtrail
      selector: cnpg.io/cluster=airtrail-database,cnpg.io/instanceRole=primary
      container: postgres
      command: pg_dumpall -U postgres
    - name: immich
      namespace: immich
      selector: cnpg.io/cluster=immich-database,cnpg.io/instanceRole=primary
      container: postgres
      command: pg_dumpall -U postgres
    - name: nextcloud
      namespace: nextcloud
      selector: cnpg.io/cluster=nextcloud-database,cnpg.io/instanceRole=primary
      container: postgres
      command: pg_dumpall -U postgres
    - name: authentik
      namespace: authentik
      selector: app.kubernetes.io/instance=authentik,app.kubernetes.io/name=postgresql
      container: postgresql
      command: PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")" pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DATABASE"
    - name: tracearr
      namespace: media-server
      selector: app.kubernetes.io/name=tracearr-postgres
      container: postgres
      command: pg_dumpall -U "$POSTGRES_USER"
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

# Static volumes, each a dataset `<pool>/k8s/<name>` with its PV `zfs-<name>` bound to `namespace`/`claim`, which
# the app's chart makes on the pool's StorageClass. `shared: "yes"` allows several pods to mount it.
volumes:
  - name: actual-budget-config
    pool: fast
    size: 1Gi
    namespace: actual-budget
    claim: actual-budget-config
  - name: adguard-home-config
    pool: fast
    size: 2Gi
    namespace: adguard-home
    claim: adguard-home-config
  - name: airtrail-database
    pool: fast
    size: 2Gi
    namespace: airtrail
    claim: airtrail-database-1
  - name: authentik-postgresql
    pool: fast
    size: 2Gi
    namespace: authentik
    claim: authentik-postgresql-data
  - name: factorio-config
    pool: fast
    size: 5Gi
    namespace: factorio
    claim: factorio-config
  - name: grafana-storage
    pool: fast
    size: 16Gi
    namespace: grafana
    claim: storage-grafana-0
  - name: home-assistant-config
    pool: fast
    size: 5Gi
    namespace: home-assistant
    claim: home-assistant-config
  - name: immich-database
    pool: fast
    size: 32Gi
    namespace: immich
    claim: immich-database-1
  - name: immich-library
    pool: tank
    size: 200Gi
    namespace: immich
    claim: immich-library
  - name: loki-backend
    pool: fast
    size: 5Gi
    namespace: loki
    claim: data-loki-backend-0
  - name: loki-write
    pool: fast
    size: 5Gi
    namespace: loki
    claim: data-loki-write-0
  - name: media-server-backups
    pool: tank
    size: 10Gi
    # Mounted by several pods; the driver refuses a second mount otherwise
    shared: "yes"
    namespace: media-server
    claim: backups
  - name: bazarr-config
    pool: fast
    size: 1Gi
    namespace: media-server
    claim: bazarr-config
  - name: dispatcharr-config
    pool: fast
    size: 5Gi
    namespace: media-server
    claim: dispatcharr-config
  - name: jellyfin-config
    pool: fast
    size: 20Gi
    namespace: media-server
    claim: jellyfin-config
  - name: lidarr-config
    pool: fast
    size: 2Gi
    namespace: media-server
    claim: lidarr-config
  - name: prowlarr-config
    pool: fast
    size: 1Gi
    namespace: media-server
    claim: prowlarr-config
  - name: radarr-config
    pool: fast
    size: 5Gi
    namespace: media-server
    claim: radarr-config
  - name: sabnzbd-config
    pool: fast
    size: 1Gi
    namespace: media-server
    claim: sabnzbd-config
  - name: seerr-config
    pool: fast
    size: 1Gi
    namespace: media-server
    claim: seerr-config
  - name: sonarr-config
    pool: fast
    size: 5Gi
    namespace: media-server
    claim: sonarr-config
  - name: tautulli-config
    pool: fast
    size: 10Gi
    namespace: media-server
    claim: tautulli-config
  - name: tracearr-postgres
    pool: fast
    size: 10Gi
    namespace: media-server
    claim: tracearr-postgres-data
  - name: memos-config
    pool: fast
    size: 1Gi
    namespace: memos
    claim: memos-config
  - name: minecraft-config
    pool: fast
    size: 5Gi
    namespace: minecraft
    claim: minecraft-config
  - name: mosquitto-config
    pool: fast
    size: 1Gi
    namespace: mosquitto
    claim: mosquitto-config
  - name: nextcloud-data
    pool: tank
    size: 200Gi
    namespace: nextcloud
    claim: nextcloud-nextcloud-data
  - name: nextcloud-database
    pool: fast
    size: 10Gi
    namespace: nextcloud
    claim: nextcloud-database-1
  - name: nextcloud-html
    pool: fast
    size: 16Gi
    namespace: nextcloud
    claim: nextcloud-html
  - name: plex-config
    pool: fast
    size: 100Gi
    namespace: plex
    claim: plex-config
  - name: alertmanager
    pool: fast
    size: 2Gi
    namespace: prometheus
    # yamllint disable-line rule:line-length
    claim: alertmanager-prometheus-kube-prometheus-alertmanager-db-alertmanager-prometheus-kube-prometheus-alertmanager-0
  - name: prometheus-db
    pool: fast
    size: 10Gi
    namespace: prometheus
    claim: prometheus-prometheus-kube-prometheus-prometheus-db-prometheus-prometheus-kube-prometheus-prometheus-0
  - name: seaweedfs-data
    pool: tank
    size: 50Gi
    namespace: seaweedfs
    claim: seaweedfs-all-in-one-data
  - name: zigbee2mqtt-data
    pool: fast
    size: 1Gi
    namespace: zigbee2mqtt
    claim: data-volume-zigbee2mqtt-0
