zfs-localpv:
  analytics:
    enabled: false

  # From the snapshot-controller app
  crds:
    csi:
      volumeSnapshots:
        enabled: false

  zfsController:
    snapshotController:
      enabled: false

  zfsNode:
    # Talos' root is read-only
    encrKeysDir: /var/openebs/keys

    nodeSelector:
      kubernetes.io/hostname: midgard-0
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule

# Existing datasets `<pool>/k8s/<name>`, imported as PV `zfs-<name>` for `namespace`/`claim`
# (`pool` defaults to fast, `claim` to the name)
volumes:
  - name: actual-budget-config
    size: 1Gi
    namespace: actual-budget
  - name: adguard-home-config
    size: 2Gi
    namespace: adguard-home
  - name: airtrail-database
    size: 2Gi
    namespace: airtrail
    claim: airtrail-database-1
  - name: authentik-database
    size: 2Gi
    namespace: authentik
    claim: authentik-database-1
  - name: factorio-config
    size: 5Gi
    namespace: factorio
  - name: grafana-storage
    size: 16Gi
    namespace: grafana
    claim: storage-grafana-0
  - name: home-assistant-config
    size: 5Gi
    namespace: home-assistant
  - name: immich-database
    size: 32Gi
    namespace: immich
    claim: immich-database-1
  - name: immich-library
    pool: tank
    size: 200Gi
    namespace: immich
  - name: loki-backend
    size: 5Gi
    namespace: loki
    claim: data-loki-backend-0
  - name: loki-write
    size: 5Gi
    namespace: loki
    claim: data-loki-write-0
  - name: media-server-backups
    pool: tank
    size: 10Gi
    # Mounted by several pods
    shared: "yes"
    namespace: media-server
    claim: backups
  - name: bazarr-config
    size: 1Gi
    namespace: media-server
  - name: dispatcharr-config
    size: 5Gi
    namespace: media-server
  - name: jellyfin-config
    size: 20Gi
    namespace: media-server
  - name: lidarr-config
    size: 2Gi
    namespace: media-server
  - name: prowlarr-config
    size: 1Gi
    namespace: media-server
  - name: radarr-config
    size: 5Gi
    namespace: media-server
  - name: sabnzbd-config
    size: 1Gi
    namespace: media-server
  - name: seerr-config
    size: 1Gi
    namespace: media-server
  - name: sonarr-config
    size: 5Gi
    namespace: media-server
  - name: tautulli-config
    size: 10Gi
    namespace: media-server
  - name: tracearr-postgres
    size: 10Gi
    namespace: media-server
    claim: tracearr-postgres-data
  - name: memos-config
    size: 1Gi
    namespace: memos
  - name: minecraft-config
    size: 5Gi
    namespace: minecraft
  - name: mosquitto-config
    size: 1Gi
    namespace: mosquitto
  - name: nextcloud-data
    pool: tank
    size: 200Gi
    namespace: nextcloud
    claim: nextcloud-nextcloud-data
  - name: nextcloud-database
    size: 10Gi
    namespace: nextcloud
    claim: nextcloud-database-1
  - name: nextcloud-html
    size: 16Gi
    namespace: nextcloud
  - name: plex-config
    size: 100Gi
    namespace: plex
  - name: plex-cache
    size: 100Gi
    namespace: plex
  - name: alertmanager
    size: 2Gi
    namespace: prometheus
    # yamllint disable-line rule:line-length
    claim: alertmanager-prometheus-kube-prometheus-alertmanager-db-alertmanager-prometheus-kube-prometheus-alertmanager-0
  - name: prometheus-db
    size: 10Gi
    namespace: prometheus
    claim: prometheus-prometheus-kube-prometheus-prometheus-db-prometheus-prometheus-kube-prometheus-prometheus-0
  - name: seaweedfs-data
    pool: tank
    size: 500Gi
    namespace: seaweedfs
    claim: seaweedfs-all-in-one-data
  - name: zigbee2mqtt-data
    size: 1Gi
    namespace: zigbee2mqtt
    claim: data-volume-zigbee2mqtt-0
