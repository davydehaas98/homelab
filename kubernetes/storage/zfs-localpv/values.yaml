    size: 2Gi
    namespace: airtrail
    claim: airtrail-database-1
    source: iscsi/airtrail-database-config.img
  - name: authentik-postgresql
    pool: fast
    size: 2Gi
    namespace: authentik
    claim: authentik-postgresql-data
    source: iscsi/authentik-postgresql-config.img
  - name: factorio-config
    pool: fast
    size: 5Gi
    namespace: factorio
    claim: factorio-config
    source: kubernetes/factorio-factorio-config-pvc-87c7964d-475c-40ab-b6e1-1d33d979189c
  - name: grafana-storage
