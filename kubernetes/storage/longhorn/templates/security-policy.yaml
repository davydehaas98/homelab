apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  oidc:
    provider:
      # Set, so a discovery fetch while Authentik restarts cannot mark the policy Invalid
      issuer: https://auth.davydehaas.dev/application/o/longhorn/
      authorizationEndpoint: https://auth.davydehaas.dev/application/o/authorize/
      tokenEndpoint: https://auth.davydehaas.dev/application/o/token/
      endSessionEndpoint: https://auth.davydehaas.dev/application/o/longhorn/end-session/
    clientIDRef:
      name: oidc-credentials
    clientSecret:
      name: oidc-credentials
    redirectURL: https://longhorn.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
      - offline_access
