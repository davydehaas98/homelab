apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  # Sign in with Authentik (application `longhorn`), restrict who may log in with policy bindings there.
  # The client credentials are in the `oidc-credentials` Secret of this namespace, see README.md
  oidc:
    provider:
      issuer: https://auth.davydehaas.dev/application/o/longhorn/
    clientIDRef:
      name: oidc-credentials
    clientSecret:
      name: oidc-credentials
    redirectURL: https://longhorn.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
