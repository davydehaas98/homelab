policy-reporter:
  replicaCount: 1
  worker: 5

  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 30m
      memory: 80Mi

  metrics:
    enabled: true
    mode: detailed

  ui:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 40Mi
      requests:
        cpu: 10m
        memory: 30Mi

    ingress:
      enabled: false

  kyvernoPlugin:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 40Mi

  # database:
  #   type: postgres
  #   secretRef: policy-reporter-credentials

  monitoring:
    enabled: true

  global:
    plugins:
      kyverno: true
