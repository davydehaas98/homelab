policy-reporter:
  resources:
    limits:
      memory: 150Mi
    requests:
      cpu: 30m
      memory: 80Mi

  metrics:
    enabled: true

  ui:
    enabled: true

    resources:
      limits:
        memory: 40Mi
      requests:
        cpu: 10m
        memory: 30Mi

  kyvernoPlugin:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 40Mi

  # database:
  #   type: postgres
  #   secretRef: policy-reporter-credentials

  # In memory: the database is small but rewritten constantly, which slowed etcd on the same eMMC; it is rebuilt from
  # the reports on start
  sqliteVolume:
    emptyDir:
      medium: Memory
      sizeLimit: 32Mi

  monitoring:
    enabled: true

  global:
    plugins:
      kyverno: true
