policy-reporter:
  replicaCount: 1
  worker: 5

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  metrics:
    enabled: true
    mode: detailed

  ui:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 32Mi

    ingress:
      enabled: false

  kyvernoPlugin:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 5m
        memory: 32Mi

  # database:
  #   type: postgres
  #   secretRef: policy-reporter-credentials

  monitoring:
    enabled: true

  global:
    plugins:
      kyverno: true
