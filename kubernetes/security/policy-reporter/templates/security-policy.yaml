apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: policy-reporter
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: policy-reporter
  oidc:
    provider:
      # Set, so a discovery fetch while Authentik restarts cannot mark the policy Invalid
      issuer: https://auth.davydehaas.dev/application/o/policy-reporter/
      authorizationEndpoint: https://auth.davydehaas.dev/application/o/authorize/
      tokenEndpoint: https://auth.davydehaas.dev/application/o/token/
      endSessionEndpoint: https://auth.davydehaas.dev/application/o/policy-reporter/end-session/
    clientIDRef:
      name: policy-reporter-oidc-credentials
    clientSecret:
      name: policy-reporter-oidc-credentials
    redirectURL: https://policy.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
      - offline_access
