kyverno:
  crds:
    install: true

  config:
    create: true
    enableDefaultRegistryMutation: false

  grafana:
    enabled: true

  features:
    admissionReports:
      enabled: true
    autoUpdateWebhooks:
      enabled: true
    backgroundScan:
      enabled: true
      backgroundScanWorkers: 2
      backgroundScanInterval: 1h
      # The defaults skip ReplicaSets, whose old revisions would fail long after a fix
      skipResourceFilters: false
    configMapCaching:
      enabled: true
    dumpPayload:
      enabled: false
    forceFailurePolicyIgnore:
      enabled: false
    protectManagedResources:
      enabled: false
    reports:
      chunkSize: 1000

  cleanupJobs:
    admissionReports:
      enabled: true

    clusterAdmissionReports:
      enabled: true

  # The webhooks fail while the admission controller is down; two stay up in a drain
  admissionController:
    replicas: 3

    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    container:
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 300Mi

    serviceMonitor:
      enabled: true

  backgroundController:
    enabled: true

    replicas: 1

    # For templates/generate-vpa-policy.yaml
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 50m
        memory: 70Mi

    serviceMonitor:
      enabled: true

  cleanupController:
    enabled: true
    replicas: 1

    resources:
      limits:
        memory: 150Mi
      requests:
        cpu: 50m
        memory: 70Mi

    serviceMonitor:
      enabled: true

  reportsController:
    enabled: true

    replicas: 1

    resources:
      limits:
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 150Mi

    serviceMonitor:
      enabled: true

kyverno-policies:
  podSecurityStandard: restricted
  podSecuritySeverity: low
  validationFailureAction: Audit
  # The policies only audit, so admit when Kyverno does not answer
  failurePolicy: Ignore

  # Infrastructure that needs the host or root and cannot meet the standard
  vpolExclude:
    excludeNamespaces:
      - fluent-bit
      - intel-gpu-resource-driver
      - kube-system
      - node-feature-discovery
      - node-problem-detector
      - prometheus-node-exporter
      - zfs-localpv

  # Images that start as root and drop to another user (linuxserver, Home Assistant, Dispatcharr, Nextcloud), Home
  # Assistant on the host network, and the Velero node agent. An entry replaces the defaults, so they are repeated.
  vpolExcludeByPolicy:
    disallow-host-path: &excludeNodeAgent
      excludeNamespaces:
        - fluent-bit
        - intel-gpu-resource-driver
        - kube-system
        - node-feature-discovery
        - node-problem-detector
        - prometheus-node-exporter
        - zfs-localpv
      matchConditions:
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
    restrict-volume-types: *excludeNodeAgent
    require-run-as-non-root-user:
      excludeNamespaces:
        - fluent-bit
        - home-assistant
        - intel-gpu-resource-driver
        - kube-system
        - node-feature-discovery
        - node-problem-detector
        - prometheus-node-exporter
        - zfs-localpv
      matchConditions:
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
    disallow-host-namespaces:
      excludeNamespaces:
        - fluent-bit
        - home-assistant
        - intel-gpu-resource-driver
        - kube-system
        - node-feature-discovery
        - node-problem-detector
        - plex
        - prometheus-node-exporter
        - zfs-localpv
    disallow-host-ports:
      excludeNamespaces:
        - fluent-bit
        - home-assistant
        - intel-gpu-resource-driver
        - kube-system
        - mosquitto
        - node-feature-discovery
        - node-problem-detector
        - plex
        - prometheus-node-exporter
        - zfs-localpv
    require-run-as-nonroot:
      excludeNamespaces:
        - fluent-bit
        - intel-gpu-resource-driver
        - kube-system
        - node-feature-discovery
        - node-problem-detector
        - prometheus-node-exporter
        - zfs-localpv
      matchConditions:
        - name: exclude-root-init-images
          expression: >-
            !object.spec.containers.all(c, [
              'ghcr.io/linuxserver/',
              'ghcr.io/home-assistant/home-assistant:',
              'docker.io/dispatcharr/dispatcharr:',
              'docker.io/library/nextcloud:'
            ].exists(p, c.image.startsWith(p)))
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
