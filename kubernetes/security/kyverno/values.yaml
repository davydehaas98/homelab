kyverno:
  crds:
    install: true

  config:
    create: true
    enableDefaultRegistryMutation: false

  grafana:
    enabled: true

  features:
    admissionReports:
      enabled: true
    autoUpdateWebhooks:
      enabled: true
    backgroundScan:
      enabled: true
      backgroundScanWorkers: 2
      backgroundScanInterval: 1h
      skipResourceFilters: true
    configMapCaching:
      enabled: true
    dumpPayload:
      enabled: false
    forceFailurePolicyIgnore:
      enabled: false
    protectManagedResources:
      enabled: false
    reports:
      chunkSize: 1000

  cleanupJobs:
    admissionReports:
      enabled: true

    clusterAdmissionReports:
      enabled: true

  # Three replicas on different nodes: while the admission controller is down, the webhooks fail. The budget keeps
  # two up during a node drain.
  admissionController:
    replicas: 3

    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    container:
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi

    serviceMonitor:
      enabled: true

  backgroundController:
    enabled: true

    replicas: 1

    # Creates the VerticalPodAutoscalers of templates/generate-vpa-policy.yaml
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    serviceMonitor:
      enabled: true

  cleanupController:
    enabled: true
    replicas: 1

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    serviceMonitor:
      enabled: true

  reportsController:
    enabled: true

    replicas: 1

    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

    serviceMonitor:
      enabled: true

kyverno-policies:
  podSecurityStandard: restricted
  podSecuritySeverity: low
  validationFailureAction: Audit
  # The policies only audit, so a pod is admitted when Kyverno does not answer
  failurePolicy: Ignore

  # Infrastructure that needs the host (paths, network, namespaces) or root: node agents, the CNI, the storage driver.
  # They cannot meet the standard, so leave them out of the reports and let the rest show what can be fixed.
  vpolExclude:
    excludeNamespaces:
      - democratic-csi
      - fluent-bit
      - kube-system
      - nfs-subdir-external-provisioner
      - node-feature-discovery
      - prometheus-node-exporter

  # These images start their init as root and drop to another user: linuxserver (s6, PUID/PGID, fails without SETUID,
  # SETGID and CHOWN, tested with runAsUser 1400), Home Assistant (s6), Dispatcharr (entrypoint with su, and
  # Postgres, Redis and nginx in one container) and Nextcloud (apache drops to www-data). A per-policy entry replaces
  # the defaults above, so they are repeated.
  # Home Assistant runs on the host network (values.yaml of the app), which these two policies forbid; Kubernetes also
  # sets a host port equal to each container port then. Its config sidecars run as root to write the config of the
  # root Home Assistant.
  # The Velero node agent reads the volumes of other pods from /var/lib/kubelet on the host, as root.
  vpolExcludeByPolicy:
    disallow-host-path: &excludeNodeAgent
      excludeNamespaces:
        - democratic-csi
        - fluent-bit
        - kube-system
        - nfs-subdir-external-provisioner
        - node-feature-discovery
        - prometheus-node-exporter
      matchConditions:
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
    restrict-volume-types: *excludeNodeAgent
    require-run-as-non-root-user:
      excludeNamespaces:
        - democratic-csi
        - fluent-bit
        - home-assistant
        - kube-system
        - nfs-subdir-external-provisioner
        - node-feature-discovery
        - prometheus-node-exporter
      matchConditions:
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
    disallow-host-namespaces:
      excludeNamespaces:
        - democratic-csi
        - fluent-bit
        - home-assistant
        - kube-system
        - nfs-subdir-external-provisioner
        - node-feature-discovery
        - prometheus-node-exporter
    disallow-host-ports:
      excludeNamespaces:
        - democratic-csi
        - fluent-bit
        - home-assistant
        - kube-system
        - nfs-subdir-external-provisioner
        - node-feature-discovery
        - prometheus-node-exporter
    require-run-as-nonroot:
      excludeNamespaces:
        - democratic-csi
        - fluent-bit
        - kube-system
        - nfs-subdir-external-provisioner
        - node-feature-discovery
        - prometheus-node-exporter
      matchConditions:
        - name: exclude-root-init-images
          expression: >-
            !object.spec.containers.all(c, [
              'ghcr.io/linuxserver/',
              'ghcr.io/home-assistant/home-assistant:',
              'docker.io/dispatcharr/dispatcharr:',
              'docker.io/library/nextcloud:'
            ].exists(p, c.image.startsWith(p)))
        - name: exclude-velero-node-agent
          expression: >-
            !(request.namespace == 'velero' && has(object.metadata.labels) &&
            object.metadata.labels.exists(k, k == 'role' && object.metadata.labels[k] == 'node-agent'))
