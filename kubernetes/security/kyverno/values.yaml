kyverno:
  crds:
    install: true

  config:
    create: true
    enableDefaultRegistryMutation: false

  grafana:
    enabled: true

  features:
    admissionReports:
      enabled: true
    autoUpdateWebhooks:
      enabled: true
    backgroundScan:
      enabled: true
      backgroundScanWorkers: 2
      backgroundScanInterval: 1h
      skipResourceFilters: true
    configMapCaching:
      enabled: true
    dumpPayload:
      enabled: false
    forceFailurePolicyIgnore:
      enabled: false
    protectManagedResources:
      enabled: false
    reports:
      chunkSize: 1000

  cleanupJobs:
    admissionReports:
      enabled: true

    clusterAdmissionReports:
      enabled: true

  # Three replicas on different nodes: while the admission controller is down, the webhooks fail. The budget keeps
  # two up during a node drain.
  admissionController:
    replicas: 3

    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    container:
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 128Mi

    serviceMonitor:
      enabled: true

  backgroundController:
    enabled: true

    replicas: 1

    # Creates the VerticalPodAutoscalers of templates/generate-vpa-policy.yaml
    rbac:
      clusterRole:
        extraResources:
          - apiGroups:
              - autoscaling.k8s.io
            resources:
              - verticalpodautoscalers
            verbs:
              - create
              - delete
              - get
              - list
              - patch
              - update
              - watch

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    serviceMonitor:
      enabled: true

  cleanupController:
    enabled: true
    replicas: 1

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    serviceMonitor:
      enabled: true

  reportsController:
    enabled: true

    replicas: 1

    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    serviceMonitor:
      enabled: true

kyverno-policies:
  podSecurityStandard: restricted
  podSecuritySeverity: low
  validationFailureAction: Audit
  # The policies only audit, so a pod is admitted when Kyverno does not answer
  failurePolicy: Ignore
