# A VerticalPodAutoscaler for every Deployment, StatefulSet and DaemonSet, so a new app needs no entry in the vpa
# chart. It only recommends (`updateMode: "Off"`); the vpa chart runs no updater. The generated VPA is named after the
# workload, labeled `generated-by: kyverno`, and with `synchronize` Kyverno deletes it with the workload. Kyverno skips
# kube-system, so the vpa chart lists those workloads itself.
# The CRD is in this chart, so the first sync cannot dry-run the policy before the CRD exists.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-vpa-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    # Not in the namespaces of Kyverno itself and the ones it ignores by default. A workload with the label
    # `davydehaas.dev/vpa: "false"` gets no VPA.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-node-lease
            - kube-public
            - kube-system
            - kyverno
    objectSelector:
      matchExpressions:
        - key: davydehaas.dev/vpa
          operator: NotIn
          values:
            - "false"
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: autoscaling.k8s.io/v1
          kind: VerticalPodAutoscaler
          metadata:
            name: (( object.metadata.name ))
            namespace: (( object.metadata.namespace ))
            labels:
              generated-by: kyverno
          spec:
            targetRef:
              apiVersion: apps/v1
              kind: (( object.kind ))
              name: (( object.metadata.name ))
            updatePolicy:
              updateMode: "Off"
