# A recommend-only VPA per workload. The CRD is in this chart, so the first sync cannot dry-run this policy.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-vpa-policy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    # Label `davydehaas.dev/vpa: "false"` opts a workload out
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-node-lease
            - kube-public
            - kube-system
            - kyverno
    objectSelector:
      matchExpressions:
        - key: davydehaas.dev/vpa
          operator: NotIn
          values:
            - "false"
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: autoscaling.k8s.io/v1
          kind: VerticalPodAutoscaler
          metadata:
            name: (( object.metadata.name ))
            namespace: (( object.metadata.namespace ))
            labels:
              generated-by: kyverno
          spec:
            targetRef:
              apiVersion: apps/v1
              kind: (( object.kind ))
              name: (( object.metadata.name ))
            updatePolicy:
              updateMode: "Off"
