# Velero's data mover pods lack the toleration of midgard-0.
# The CRD is in this chart, so the first sync cannot dry-run this policy.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: velero-data-mover-toleration
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: velero
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: data-mover
      expression: >-
        has(object.metadata.labels) &&
        ('velero.io/data-upload' in object.metadata.labels || 'velero.io/data-download' in object.metadata.labels)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.tolerations) ?
          [JSONPatch{op: "add", path: "/spec/tolerations/-", value: dyn({"key": "davydehaas.dev/dedicated", "operator": "Equal", "value": "storage", "effect": "NoSchedule"})}] :
          [JSONPatch{op: "add", path: "/spec/tolerations", value: dyn([{"key": "davydehaas.dev/dedicated", "operator": "Equal", "value": "storage", "effect": "NoSchedule"}])}]
