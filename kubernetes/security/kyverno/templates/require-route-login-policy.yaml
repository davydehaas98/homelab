# Denies an HTTPRoute that says nothing about its login: it needs the annotation `davydehaas.dev/auth` with `gateway` (a
# login at the gateway, an Envoy Gateway SecurityPolicy with `oidc`) or the reason it has none: `native` (the app's own
# login), `public`, `redirect` (an alias route that only redirects) or `bypass` (the paths of an app that skip the login).
# The library chart sets the annotation, see kubernetes/_library/app/README.md; other charts set it in their values or
# templates. It checks the annotation only, not the SecurityPolicy, as a route and its policy are created in one sync in no
# set order: verify-route-login below checks that a `gateway` route really has its policy. The temporary routes that
# cert-manager makes for a challenge are left out. If Kyverno is down, a route cannot be created or changed.
# The CRD is in this chart, so the first sync cannot dry-run the policy before the CRD exists.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-route-login
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    objectSelector:
      matchExpressions:
        - key: acme.cert-manager.io/http01-solver
          operator: DoesNotExist
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  validations:
    - expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(k, k == 'davydehaas.dev/auth' &&
        object.metadata.annotations[k] in ['gateway', 'native', 'public', 'redirect', 'bypass'])
      message: >-
        The route needs the annotation davydehaas.dev/auth: gateway (a login at the gateway), or native, public,
        redirect or bypass as the reason it has none. See kubernetes/_library/app/README.md.
---
# Audits that a route that says `gateway` has a SecurityPolicy with `oidc` that targets it, so the annotation is true. It
# only reports, as the policy may come a moment after the route.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: verify-route-login
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  matchConditions:
    - name: says-gateway
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations.exists(k, k == 'davydehaas.dev/auth' && object.metadata.annotations[k] == 'gateway')
  variables:
    - name: securityPolicies
      expression: resource.List("gateway.envoyproxy.io/v1alpha1", "securitypolicies", object.metadata.namespace)
  validations:
    - expression: >-
        dyn(variables.securityPolicies.items).exists(p, has(p.spec.oidc) &&
        p.spec.targetRefs.exists(t, t.kind == 'HTTPRoute' && t.name == object.metadata.name))
      message: >-
        The route says davydehaas.dev/auth: gateway, but no SecurityPolicy with oidc targets it.
---
# Kyverno reads the HTTPRoutes (the policy reports need it) and the SecurityPolicies of Envoy Gateway to check that a
# route has its login
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:read-securitypolicies
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch"]
