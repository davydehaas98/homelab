# Kyverno audits the pod configuration, so only the image and secret scanners run
trivy-operator:
  operator:
    builtInTrivyServer: true
    configAuditScannerEnabled: false
    rbacAssessmentScannerEnabled: false
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
    exposedSecretScannerEnabled: true
    scanJobsConcurrentLimit: 1

  resources:
    limits:
      memory: 750Mi
    requests:
      cpu: 30m
      memory: 550Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # The trivy image has no user of its own
  trivyOperator:
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

  trivy:
    # A cache, downloaded again after a restart
    storageClassEnabled: false
    # Scans of large images filled a node's /var and caused evictions
    resources:
      limits:
        ephemeralStorage: 2Gi
      requests:
        ephemeralStorage: 512Mi
    server:
      resources:
        limits:
          memory: 500Mi
        requests:
          cpu: 10m
          memory: 500Mi
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

  serviceMonitor:
    enabled: true
