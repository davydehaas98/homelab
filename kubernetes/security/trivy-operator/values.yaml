# Scans the images and secrets of running workloads for vulnerabilities (VulnerabilityReports,
# ExposedSecretReports). Kyverno already audits the pod configuration, so those scanners stay off.
trivy-operator:
  operator:
    builtInTrivyServer: true
    configAuditScannerEnabled: false
    rbacAssessmentScannerEnabled: false
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false
    exposedSecretScannerEnabled: true
    scanJobsConcurrentLimit: 1

  resources:
    limits:
      memory: 750Mi
    requests:
      cpu: 30m
      memory: 550Mi

  # The image runs as user 10000, the container's own security context is restricted already
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # The scan Jobs: the trivy image has no user of its own, an image scan only writes to its emptyDirs (tested). Their
  # containers are restricted by the chart default.
  trivyOperator:
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

  trivy:
    # The scan jobs unpack the layers of an image on the node. The /var disk of a node is 27 GiB and the images alone
    # take about 13, so without a limit a scan of a large image pushed a node into disk pressure and the kubelet evicted
    # pods (also other apps). A scan that needs more than this fails and is retried; the others stay up.
    resources:
      limits:
        ephemeralStorage: 2Gi
      requests:
        ephemeralStorage: 512Mi
    server:
      resources:
        limits:
          memory: 500Mi
        requests:
          cpu: 10m
          memory: 500Mi
      # Merged with the chart's defaults, which already run it as user 65534
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

  serviceMonitor:
    enabled: true
