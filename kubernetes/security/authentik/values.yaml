  - name: Prometheus
    slug: prometheus
    redirectURL: https://prometheus.davydehaas.dev/oauth2/callback
  - name: Radarr
    slug: radarr
    redirectURL: https://radarr.davydehaas.dev/oauth2/callback
  - name: Policy Reporter
    slug: policy-reporter
    redirectURL: https://policy.davydehaas.dev/oauth2/callback
  - name: SABnzbd
    slug: sabnzbd
    redirectURL: https://sabnzbd.davydehaas.dev/oauth2/callback
  - name: Sonarr
    slug: sonarr
    redirectURL: https://sonarr.davydehaas.dev/oauth2/callback
  - name: Tautulli
    slug: tautulli
    redirectURL: https://tautulli.davydehaas.dev/oauth2/callback
  - name: Tracearr
    slug: tracearr
    redirectURL: https://tracearr.davydehaas.dev/oauth2/callback
  - name: Zigbee2MQTT
    slug: zigbee2mqtt
    redirectURL: https://zigbee.davydehaas.dev/oauth2/callback

authentik:
  global:
    # The database of templates/database.yaml
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-database-rw
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-database-app
            key: password
    # The chart does not template this list; templates/oidc-clients-check.yaml checks it
    envFrom:
      - secretRef:
          name: authentik-oidc-actual-budget
      - secretRef:
          name: authentik-oidc-adguard-home
      - secretRef:
          name: authentik-oidc-airtrail
      - secretRef:
          name: authentik-oidc-argocd
      - secretRef:
          name: authentik-oidc-bazarr
      - secretRef:
          name: authentik-oidc-dispatcharr
      - secretRef:
          name: authentik-oidc-gatus
      - secretRef:
          name: authentik-oidc-grafana
      - secretRef:
          name: authentik-oidc-headlamp
      - secretRef:
          name: authentik-oidc-homepage
      - secretRef:
          name: authentik-oidc-hubble
      - secretRef:
          name: authentik-oidc-it-tools
      - secretRef:
          name: authentik-oidc-lazylibrarian
      - secretRef:
          name: authentik-oidc-lidarr
      - secretRef:
          name: authentik-oidc-longhorn
      - secretRef:
          name: authentik-oidc-memos
      - secretRef:
          name: authentik-oidc-nextcloud
      - secretRef:
          name: authentik-oidc-omni-tools
      - secretRef:
          name: authentik-oidc-open-webui
      - secretRef:
          name: authentik-oidc-policy-reporter
      - secretRef:
          name: authentik-oidc-prometheus
      - secretRef:
          name: authentik-oidc-prowlarr
      - secretRef:
          name: authentik-oidc-radarr
      - secretRef:
          name: authentik-oidc-sabnzbd
      - secretRef:
          name: authentik-oidc-sonarr
      - secretRef:
          name: authentik-oidc-tautulli
      - secretRef:
          name: authentik-oidc-tracearr
      - secretRef:
          name: authentik-oidc-zigbee2mqtt

  blueprints:
    configMaps:
      - authentik-blueprints

  authentik:
    existingSecret:
      secretName: authentik-credentials

  server:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    # The image's own user, so the restricted standard sees it
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        memory: 1.5Gi
      requests:
        cpu: 150m
        memory: 800Mi

  worker:
    replicas: 1
    # The image's own user, so the restricted standard sees it
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        memory: 650Mi
      requests:
        cpu: 200m
        memory: 400Mi
