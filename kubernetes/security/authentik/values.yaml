# OIDC applications created by `templates/blueprints.yaml`. The slug must match the issuer URL in the
# app's SecurityPolicy. Only `authentik Admins` may sign in unless `openAccess: true`. Credentials: `<SLUG>_CLIENT_ID` /
# `<SLUG>_CLIENT_SECRET` in the SealedSecret `templates/oidc-client-<slug>.yaml`, listed in `envFrom` below.
oidcClients:
  - name: Argo CD
    slug: argocd
    redirectURL: https://argocd.davydehaas.dev/auth/callback
  - name: Bazarr
    slug: bazarr
    redirectURL: https://bazarr.davydehaas.dev/oauth2/callback
  - name: Grafana
    slug: grafana
    # Grafana maps roles from group claims, so every Authentik user may sign in
    openAccess: true
    redirectURL: https://grafana.davydehaas.dev/login/generic_oauth
  - name: Hubble
    slug: hubble
    redirectURL: https://hubble.davydehaas.dev/oauth2/callback
  - name: IT Tools
    slug: it-tools
    redirectURL: https://it-tools.davydehaas.dev/oauth2/callback
  - name: Lidarr
    slug: lidarr
    redirectURL: https://lidarr.davydehaas.dev/oauth2/callback
  - name: Longhorn
    slug: longhorn
    redirectURL: https://longhorn.davydehaas.dev/oauth2/callback
  - name: Open WebUI
    slug: open-webui
    redirectURL: https://open-webui.davydehaas.dev/oauth/oidc/callback
  - name: Prowlarr
    slug: prowlarr
    redirectURL: https://prowlarr.davydehaas.dev/oauth2/callback
  - name: Prometheus
    slug: prometheus
    redirectURL: https://prometheus.davydehaas.dev/oauth2/callback
  - name: Radarr
    slug: radarr
    redirectURL: https://radarr.davydehaas.dev/oauth2/callback
  - name: Policy Reporter
    slug: policy-reporter
    redirectURL: https://policy.davydehaas.dev/oauth2/callback
  - name: SABnzbd
    slug: sabnzbd
    redirectURL: https://sabnzbd.davydehaas.dev/oauth2/callback
  - name: Sonarr
    slug: sonarr
    redirectURL: https://sonarr.davydehaas.dev/oauth2/callback

authentik:
  global:
    # Non-secret connection settings. The secret values come from `authentik-credentials` (see README.md)
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-postgresql
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
    # Client IDs and secrets read by the blueprints, one Secret per entry in `oidcClients`. The chart does not
    # template this list, so add a line per client; `templates/oidc-clients-check.yaml` fails the render if one is missing.
    envFrom:
      - secretRef:
          name: authentik-oidc-argocd
      - secretRef:
          name: authentik-oidc-bazarr
      - secretRef:
          name: authentik-oidc-grafana
      - secretRef:
          name: authentik-oidc-hubble
      - secretRef:
          name: authentik-oidc-it-tools
      - secretRef:
          name: authentik-oidc-lidarr
      - secretRef:
          name: authentik-oidc-longhorn
      - secretRef:
          name: authentik-oidc-open-webui
      - secretRef:
          name: authentik-oidc-policy-reporter
      - secretRef:
          name: authentik-oidc-prometheus
      - secretRef:
          name: authentik-oidc-prowlarr
      - secretRef:
          name: authentik-oidc-radarr
      - secretRef:
          name: authentik-oidc-sabnzbd
      - secretRef:
          name: authentik-oidc-sonarr

  blueprints:
    configMaps:
      - authentik-blueprints

  authentik:
    existingSecret:
      secretName: authentik-credentials

  server:
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

  worker:
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      # The iSCSI disk of templates/postgresql-volume.yaml
      persistence:
        existingClaim: authentik-postgresql-data
      startupProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 60
        successThreshold: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 256Mi
