    slug: zigbee2mqtt
    redirectURL: https://zigbee.davydehaas.dev/oauth2/callback

authentik:
  global:
    # The database of templates/database.yaml
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-database-rw
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-database-app
            key: password
    # The chart does not template this list; templates/oidc-clients-check.yaml checks it
    envFrom:
      # The app's own Secret, copied here by kubernetes-replicator, as <slug>-<key>
      - prefix: actual-budget-
        secretRef:
          name: actual-budget-oidc-credentials
      - prefix: adguard-home-
        secretRef:
          name: adguard-home-oidc-credentials
      - prefix: airtrail-
        secretRef:
          name: airtrail-oidc-credentials
      - prefix: argocd-
        secretRef:
          name: argocd-oidc-credentials
      - prefix: bazarr-
        secretRef:
          name: bazarr-oidc-credentials
      - prefix: dispatcharr-
        secretRef:
          name: dispatcharr-oidc-credentials
      - prefix: gatus-
        secretRef:
          name: gatus-oidc-credentials
      - prefix: grafana-
        secretRef:
          name: grafana-oidc-credentials
      - prefix: headlamp-
        secretRef:
          name: headlamp-oidc-credentials
      - prefix: homepage-
        secretRef:
          name: homepage-oidc-credentials
      - prefix: hubble-
        secretRef:
          name: hubble-oidc-credentials
      - prefix: it-tools-
        secretRef:
          name: it-tools-oidc-credentials
      - prefix: lazylibrarian-
        secretRef:
          name: lazylibrarian-oidc-credentials
      - prefix: lidarr-
        secretRef:
          name: lidarr-oidc-credentials
      - prefix: memos-
        secretRef:
          name: memos-oidc-credentials
      - prefix: nextcloud-
        secretRef:
          name: nextcloud-oidc-credentials
      - prefix: omni-tools-
        secretRef:
          name: omni-tools-oidc-credentials
      - prefix: prowlarr-
        secretRef:
          name: prowlarr-oidc-credentials
      - prefix: prometheus-
        secretRef:
          name: prometheus-oidc-credentials
      - prefix: radarr-
        secretRef:
          name: radarr-oidc-credentials
      - prefix: policy-reporter-
        secretRef:
          name: policy-reporter-oidc-credentials
      - prefix: sabnzbd-
        secretRef:
          name: sabnzbd-oidc-credentials
      - prefix: sonarr-
        secretRef:
          name: sonarr-oidc-credentials
      - prefix: tautulli-
        secretRef:
          name: tautulli-oidc-credentials
      - prefix: tracearr-
        secretRef:
          name: tracearr-oidc-credentials
      - prefix: zigbee2mqtt-
        secretRef:
          name: zigbee2mqtt-oidc-credentials

  blueprints:
    configMaps:
      - authentik-blueprints

  authentik:
    existingSecret:
      secretName: authentik-credentials

  server:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    # The image's own user, so the restricted standard sees it
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        memory: 1.5Gi
      requests:
        cpu: 150m
        memory: 800Mi

  worker:
    replicas: 1
    # The image's own user, so the restricted standard sees it
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 450Mi
