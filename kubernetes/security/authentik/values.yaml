# Clients of templates/blueprints.yaml. Their credentials are the app's Secret `<slug>-oidc-credentials` (keys client-id
# and client-secret) in `namespace` (default the slug), pulled here by kubernetes-replicator and listed in envFrom with
# the prefix <slug>-.
oidcClients:
  - name: Actual Budget
    slug: actual-budget
    redirectURL: https://actual.davydehaas.dev/oauth2/callback
  - name: AdGuard Home
    slug: adguard-home
    redirectURL: https://adguard.davydehaas.dev/oauth2/callback
  - name: AirTrail
    slug: airtrail
    redirectURL: https://airtrail.davydehaas.dev/oauth2/callback
  - name: Argo CD
    slug: argocd
    redirectURL: https://argocd.davydehaas.dev/auth/callback
