  - name: IT Tools
    slug: it-tools
    redirectURL: https://it-tools.davydehaas.dev/oauth2/callback
  - name: LazyLibrarian
    slug: lazylibrarian
    namespace: media-server
    redirectURL: https://lazylibrarian.davydehaas.dev/oauth2/callback
  - name: Lidarr
    slug: lidarr
    namespace: media-server
    redirectURL: https://lidarr.davydehaas.dev/oauth2/callback
  - name: Memos
    slug: memos
