# OIDC applications created by `templates/blueprints.yaml`. The slug must match the issuer URL in the
# app's SecurityPolicy. Only `authentik Admins` may sign in unless `openAccess: true`. Credentials: `<SLUG>_CLIENT_ID` / `<SLUG>_CLIENT_SECRET` in `authentik-oidc-clients`.
oidcClients:
  - name: Argo CD
    slug: argocd
    redirectURL: https://argocd.davydehaas.dev/auth/callback
  - name: Grafana
    slug: grafana
    # Grafana maps roles from group claims, so every Authentik user may sign in
    openAccess: true
    redirectURL: https://grafana.davydehaas.dev/login/generic_oauth
  - name: Hubble
    slug: hubble
    redirectURL: https://hubble.davydehaas.dev/oauth2/callback
  - name: IT Tools
    slug: it-tools
    redirectURL: https://it-tools.davydehaas.dev/oauth2/callback
  - name: Longhorn
    slug: longhorn
    redirectURL: https://longhorn.davydehaas.dev/oauth2/callback
  - name: Open WebUI
    slug: open-webui
    redirectURL: https://open-webui.davydehaas.dev/oauth/oidc/callback
  - name: Prometheus
    slug: prometheus
    redirectURL: https://prometheus.davydehaas.dev/oauth2/callback
  - name: Policy Reporter
    slug: policy-reporter
    redirectURL: https://policy.davydehaas.dev/oauth2/callback

authentik:
  global:
    # Non-secret connection settings. The secret values come from `authentik-credentials` (see README.md)
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-postgresql
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
    # Client IDs and secrets read by the blueprints (see README.md)
    envFrom:
      - secretRef:
          name: authentik-oidc-clients

  blueprints:
    configMaps:
      - authentik-blueprints

  authentik:
    existingSecret:
      secretName: authentik-credentials

  server:
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

  worker:
    replicas: 1
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      startupProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 60
        successThreshold: 1
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 256Mi
