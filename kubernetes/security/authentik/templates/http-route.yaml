apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: native
  name: authentik
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - auth.davydehaas.dev
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
---
# `authentik.davydehaas.dev` redirects to the main name, so the login and the OIDC issuer stay on one hostname
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    davydehaas.dev/auth: redirect
  name: authentik-aliases
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - authentik.davydehaas.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: auth.davydehaas.dev
            statusCode: 301
