# Only the pods of this namespace, the CloudNativePG operator and Prometheus (metrics) reach the database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - port: 9187
