# The database of Authentik is on an iSCSI disk on yggdrasil (target iqn.2026-10.nl.davydehaas:authentik-postgresql),
# not on NFS, where Postgres risks corruption. Made with kubernetes/media-server/media-server/lun.sh, see README.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-postgresql-data
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # Mounted by the democratic-csi driver `node-manual` (kubernetes/storage/democratic-csi)
  csi:
    driver: org.democratic-csi.node-manual
    fsType: ext4
    readOnly: false
    volumeHandle: authentik-postgresql-data
    volumeAttributes:
      portal: "192.168.1.44:3260"
      iqn: "iqn.2026-10.nl.davydehaas:authentik-postgresql"
      lun: "0"
      node_attach_driver: iscsi
      provisioner_driver: node-manual
  claimRef:
    namespace: authentik
    name: authentik-postgresql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql-data
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: authentik-postgresql-data
  resources:
    requests:
      storage: 2Gi
