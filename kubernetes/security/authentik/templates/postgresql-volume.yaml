# The database of Authentik, on a ZFS volume on midgard-0 (see kubernetes/storage/zfs-localpv)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgresql-data
  namespace: authentik
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zfs-fast
  volumeName: zfs-authentik-postgresql
  resources:
    requests:
      storage: 2Gi
