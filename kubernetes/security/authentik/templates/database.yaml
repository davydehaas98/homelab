# PostgreSQL for Authentik, run by CloudNativePG (kubernetes/storage/cloudnative-pg), which creates the Secret
# `authentik-database-app` for it. The database is on a ZFS volume on midgard-0 (see kubernetes/storage/zfs-localpv);
# one instance, as each instance needs a volume of its own. It was imported once from the old database of the chart's
# `postgresql`, which is only read at bootstrap.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-database
  annotations:
    # While the app is suspended (argocd.yaml), the database pod stops and its volume stays
    cnpg.io/hibernation: {{ if eq (toString .Values.suspend) "true" }}"on"{{ else }}"off"{{ end }}
spec:
  instances: 1
  # The budget of the primary blocks every drain with one instance, so a node upgrade could never finish
  enablePDB: false
  # Backs up to the bucket `cnpg`, see templates/database-backup.yaml
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-database
  affinity:
    tolerations:
      - key: davydehaas.dev/dedicated
        operator: Equal
        value: storage
        effect: NoSchedule
  resources:
    limits:
      memory: 550Mi
    requests:
      memory: 350Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      import:
        type: microservice
        databases:
          - authentik
        source:
          externalCluster: authentik-postgresql
  externalClusters:
    - name: authentik-postgresql
      connectionParameters:
        host: authentik-postgresql
        user: authentik
        dbname: authentik
      password:
        name: authentik-credentials
        key: password
  storage:
    size: 2Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      storageClassName: zfs-fast
      volumeName: zfs-authentik-database
      resources:
        requests:
          storage: 2Gi
