apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - plex.davydehaas.dev
  rules:
    # Streams are one long response, so no route timeout
    - timeouts:
        request: 0s
      backendRefs:
        - name: plex-plex-media-server
          port: 32400
