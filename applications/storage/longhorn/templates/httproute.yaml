apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: web-https
  hostnames:
    - longhorn.davydehaas.dev
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
