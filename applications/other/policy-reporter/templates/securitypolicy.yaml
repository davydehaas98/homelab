apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: policy-reporter
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: policy-reporter
  # Sign in with Authentik (application `policy-reporter`), restrict who may log in with policy bindings there.
  # The client credentials are in the `oidc-credentials` Secret of this namespace, see README.md
  oidc:
    provider:
      issuer: https://auth.davydehaas.dev/application/o/policy-reporter/
    clientIDRef:
      name: oidc-credentials
    clientSecret:
      name: oidc-credentials
    redirectURL: https://policy.davydehaas.dev/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
