policy-reporter:
  replicaCount: 1
  worker: 5

  resources:
    limits:
      memory: 100Mi
    requests:
      memory: 30Mi
      cpu: 5m

  metrics:
    enabled: true
    mode: detailed

  ui:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 30Mi
        cpu: 5m

    ingress:
      enabled: false

  kyvernoPlugin:
    enabled: true
    replicaCount: 1

    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 30Mi
        cpu: 5m

  # database:
  #   type: postgres
  #   secretRef: policy-reporter-credentials

  monitoring:
    enabled: true

  global:
    plugins:
      kyverno: true
