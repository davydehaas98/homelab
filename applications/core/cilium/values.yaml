cilium:
  k8sServiceHost: localhost
  k8sServicePort: 7445

  ipam:
    mode: kubernetes

  kubeProxyReplacement: "true"

  # Talos: https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  gatewayAPI:
    enabled: true
    enableAlpn: true
    enableAppProtocol: true

  bgpControlPlane:
    enabled: false

  l2announcements:
    enabled: true

  k8sClientRateLimit:
    qps: 20
    burst: 40

  certgen:
    ttlSecondsAfterFinished: null

  rollOutCiliumPods: true

  operator:
    replicas: 1

  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 512Mi

  monitor:
    enabled: true

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true

  hubble:
    enabled: true

    metrics:
      enableOpenMetrics: true
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true

    relay:
      enabled: true
      rollOutPods: true
      resources: {}
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    ui:
      enabled: true
      rollOutPods: true
      backend:
        resources: {}
      frontend:
        resources: {}
