[tools]
# Keep equal to the Argo CD version in kubernetes/core/argocd
argocd = "3.5.7"
cilium-cli = "0.20.2"
gh = "2.103.3"
helm = "4.3.1"
k9s = "0.51.0"
# Keep equal to the cluster's Kubernetes version
kubectl = "1.37.2"
kubeseal = "0.41.2"
stern = "1.35.0"
# Keep equal to the Talos version on the nodes
talosctl = "1.14.5"
# Keep equal to the version in the terraform-cloudflare workflow
terraform = "1.17.1"
# For pipx
uv = "0.13.7"
yq = "4.54.2"
# Its archive keeps the binary in usr/bin
"github:turing-machines/tpi" = { version = "1.0.7", bin_path = "usr/bin" }
"pipx:yamllint" = "1.38.0"
