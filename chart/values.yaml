applications:
  core:
    argocd:
      deploy: true
      namespace: argocd
      serverSideApply: true
    cert-manager:
      deploy: true
    cilium:
      deploy: true
      autoSync: false
      namespace: kube-system
      serverSideApply: true
    descheduler:
      deploy: true
    envoy-gateway:
      deploy: true
      serverSideApply: true
    intel-device-plugins-gpu:
      deploy: false
      ignoreDifferences:
        - group: deviceplugin.intel.com
          kind: GpuDevicePlugin
          jsonPointers:
            - /spec/resourceManager
    metrics-server:
      deploy: true
    node-feature-discovery:
      deploy: true
    sealed-secrets:
      deploy: true
      namespace: kube-system
    vpa:
      deploy: true

  storage:
    cloudnative-pg:
      deploy: true
      namespace: cnpg-system
      serverSideApply: true
    democratic-csi:
      deploy: true
    longhorn:
      deploy: false
      autoSync: false
      namespace: longhorn-system
    nfs-subdir-external-provisioner:
      deploy: true
    seaweedfs:
      deploy: true
    velero:
      deploy: false
      serverSideApply: true
