applications:
  core:
    argocd:
      deploy: true
      autoSync: false
      namespace: argocd
    cert-manager:
      deploy: true
      autoSync: true
    cilium:
      deploy: true
      autoSync: false
      namespace: kube-system
      serverSideApply: true
    envoy-gateway:
      deploy: true
      autoSync: true
      serverSideApply: true
    external-dns:
      deploy: true
      autoSync: true
    sealed-secrets:
      deploy: true
      autoSync: true
      namespace: kube-system
    vpa:
      deploy: true
      autoSync: true
  devices:
    intel-device-plugins-gpu:
      deploy: true
      ignoreDifferences:
        - group: "deviceplugin.intel.com"
          kind: "GpuDevicePlugin"
          jsonPointers:
            - /spec/resourceManager
    node-feature-discovery:
      deploy: true
      autoSync: true
  home:
    home-assistant:
      deploy: false
      autoSync: true
    nextcloud:
      deploy: false
      autoSync: true
  media:

  monitoring:
    grafana:
      deploy: true
      autoSync: true
    grafana-dashboards:
      deploy: true
      autoSync: true
      namespace: grafana
      serverSideApply: true
    kepler:
      deploy: false
      autoSync: true
    loki:
      deploy: true
      autoSync: true
    metrics-server:
      deploy: true
      autoSync: true
    prometheus:
      deploy: true
      autoSync: true
    prometheus-crd:
      deploy: true
      autoSync: true
      namespace: defaults
      serverSideApply: true
    promtail:
      deploy: true
      autoSync: true
  storage:
    longhorn:
      deploy: true
      autoSync: false
      namespace: longhorn-system
    seaweedfs:
      deploy: true
      autoSync: true
    nfs-subdir-external-provisioner:
      deploy: true
      autoSync: true
  other:
    authentik:
      deploy: true
      autoSync: false
    victoria-metrics:
      deploy: false
      autoSync: true
      serverSideApply: true
