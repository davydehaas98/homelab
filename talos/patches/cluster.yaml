apiVersion: v1alpha1
kind: KubeClusterConfig
clusterName: yggdrasil
endpoint: https://192.168.1.55:6443
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  $patch: delete
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
# The installer image has no sandboxd, so cri would hang
workloadIsolation: false
---
apiVersion: v1alpha1
kind: ResolverConfig
# Not DHCP's DNS, which is AdGuard Home: without DNS the nodes cannot pull its image
nameservers:
  - address: 192.168.1.1
  - address: 1.1.1.1
