cluster:
  etcd:
    extraArgs:
      # For Prometheus. Applying it restarts etcd, so one node at a time.
      listen-metrics-urls: http://0.0.0.0:2381
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
# gen-config.sh fills in the VIP
name: __CLUSTER_IP__
link: end0
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
# For tuppr and talos-backup; the pods ask for their own roles
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - tuppr
  - talos-backup
