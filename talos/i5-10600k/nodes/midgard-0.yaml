machine:
  type: worker
  kernel:
    modules:
      - name: zfs
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: eno1
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
# The schematic of i5-10600k/gen-schematic-id.sh; without it the install drops the extensions. tuppr only swaps the
# version.
installer:
  image: factory.talos.dev/metal-installer/48e7f69daccf166e3b63a595e1b2854da6faccb7cc0bf08a6e5191ea270430ef:v1.14.5
provisioning:
  diskSelector:
    # The only SATA SSD; the NVMe and the hard disks hold the ZFS pools and the media
    match: disk.transport == "sata" && !disk.rotational
  wipe: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  davydehaas.dev/model: i5-10600k
# Only the apps pinned to the node's storage and GPU, and the DaemonSets, run here
taints:
  davydehaas.dev/dedicated: storage:NoSchedule
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: midgard-0
auto: "off"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
# The ext4 media partition from Ubuntu, labelled `media` with sgdisk, mounted at /var/mnt/media
name: media
discovery:
  volumeSelector:
    match: volume.partition_label == "media"
