machine:
  type: controlplane
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
# Untagged: the gateway puts it on the Servers VLAN by its MAC (the network override of its reservation in
# terraform/unifi/clients.tf), where DHCP reserves 192.168.10.44
apiVersion: v1alpha1
kind: DHCPv4Config
name: eno1
---
# The e1000e of this I219 can stall sending with segmentation offload on, which cut the node off for minutes
apiVersion: v1alpha1
kind: EthernetConfig
name: eno1
features:
  tx-tcp-segmentation: false
  tx-generic-segmentation: false
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # The NVMe and hard disks hold the ZFS pools and the media
    match: disk.transport == "sata" && !disk.rotational
  wipe: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  davydehaas.dev/model: i5-10600k
  # On the Servers VLAN, so Cilium peers with the gateway there
  davydehaas.dev/network: servers
nodeIP:
  validSubnets:
    - 192.168.10.0/24
taints:
  davydehaas.dev/dedicated: storage:NoSchedule
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: midgard-0
auto: "off"
---
apiVersion: v1alpha1
kind: ExistingVolumeConfig
# The ext4 media partition from Ubuntu
name: media
discovery:
  volumeSelector:
    match: volume.partition_label == "media"
