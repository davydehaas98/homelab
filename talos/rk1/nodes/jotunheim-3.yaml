machine:
  type: worker
---
apiVersion: v1alpha1
kind: LinkConfig
name: end0
up: true
---
# The Servers VLAN, apart from the clients on the untagged LAN; DHCP reserves 192.168.10.53
apiVersion: v1alpha1
kind: VLANConfig
name: end0.10
vlanID: 10
parent: end0
up: true
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: end0.10
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/mmcblk0"
  wipe: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  davydehaas.dev/model: rk1
nodeIP:
  validSubnets:
    - 192.168.10.0/24
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: jotunheim-3
auto: "off"
